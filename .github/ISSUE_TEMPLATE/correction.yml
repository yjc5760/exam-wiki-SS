name: 勘誤回報
description: 回報題解、講義或網頁內容的錯誤
title: "[勘誤] "
labels: ["勘誤"]
body:
  - type: markdown
    attributes:
      value: |
        謝謝你幫忙找錯！每一則回報都會讓這份教材更正確。
        答案和題解對不上時，不一定是你錯：部分題解仍在校對中。
  - type: input
    id: where
    attributes:
      label: 題號或頁面
      description: 例如 SS-2015-3，或頁面網址、講義名稱與章節
      placeholder: SS-2015-3
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 錯誤類型
      options:
        - 題目或附圖看錯（支承、尺寸、條件）
        - 計算錯誤
        - 規範條文或係數錯誤
        - 觀念說明錯誤
        - 主分類／副分類不對
        - 錯字、圖片或連結失效
        - 其他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 哪裡錯了？
      description: 寫出原本的內容，以及你認為正確的內容
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 依據（選填）
      description: 考卷頁碼與位置、規範條號、你的計算過程或參考書目
