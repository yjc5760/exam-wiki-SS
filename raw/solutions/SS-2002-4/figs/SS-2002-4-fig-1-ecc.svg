<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="682" viewBox="0 0 1120 682"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="560" height="560"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="560" height="560"/></clipPath></defs><rect width="1120" height="682" fill="#FFFFFF"/><text x="560.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 1　偏心距 e = 13.5 cm，扭矩 M = 270 tf·cm</text><text x="560.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">O＝螺栓群形心；P = 20 tf：Px = 12 tf（←）、Py = 16 tf（↓）；作用點相對形心 (28.5, 15.5) cm</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="548" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 扭矩 = P × 形心到力線的垂直距離</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">力線方向 3:4，作用於鋼板右上角</text><circle cx="118.50" cy="404.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="118.50" cy="341.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="118.50" cy="278.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="118.50" cy="215.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="181.50" cy="404.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="181.50" cy="341.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="181.50" cy="278.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="181.50" cy="215.50" r="9.90" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><line x1="139.20" y1="310.00" x2="160.80" y2="310.00" stroke="#1F2733" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><line x1="150.00" y1="320.80" x2="150.00" y2="299.20" stroke="#1F2733" stroke-width="1.4" stroke-linecap="round" opacity="1.0"/><text x="157.00" y="298.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">O</text><line x1="465.90" y1="91.30" x2="190.50" y2="458.50" stroke="#C3CAD5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="6 5" opacity="1.0"/><line x1="455.10" y1="105.70" x2="413.10" y2="161.70" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="406.50,170.50 409.05,158.66 417.15,164.74" fill="#C0392B"/><text x="463.10" y="105.70" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">P = 20 tf</text><circle cx="406.50" cy="170.50" r="4.5" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><text x="416.50" y="186.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">(28.5, 15.5)</text><line x1="150.00" y1="310.00" x2="247.20" y2="382.90" stroke="#B45309" stroke-width="2.6" stroke-linecap="round" opacity="1.0"/><polyline points="237.12,375.34 244.68,365.26 254.76,372.82" fill="none" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><text x="210.60" y="350.45" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">e = 13.5 cm</text><text x="280.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">M = P·e = 20 × 13.5 = 270 tf·cm（順時針）</text><text x="280.00" y="530.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">Ip = Σx² + Σy² = 588 cm²（8 顆）</text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="548" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 分量取矩：兩個分量的力矩方向相反</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">第二條路徑，結果必須與 ① 相同</text><text x="198.00" y="140.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">Py × xP = 16 × 28.5</text><rect x="210" y="126" width="173.28" height="28" rx="4" fill="#C0392B" stroke="none" stroke-width="1"/><text x="391.28" y="140.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">456（順時針）</text><text x="198.00" y="214.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">Px × yP = 12 × 15.5</text><rect x="210" y="200" width="70.68" height="28" rx="4" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="288.68" y="214.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">186（逆時針）</text><text x="198.00" y="288.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">淨扭矩 M</text><rect x="210" y="274" width="102.6" height="28" rx="4" fill="#B45309" stroke="none" stroke-width="1"/><text x="320.60" y="288.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">270（順時針）</text><text x="198.00" y="362.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">誤：P × xP = 20 × 28.5</text><rect x="210" y="348" width="216.6" height="28" rx="4" fill="#C3CAD5" stroke="none" stroke-width="1"/><text x="434.60" y="362.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">570（誤）</text><text x="280.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">456 − 186 = 270 tf·cm ✓ 與 P·e 相同</text><text x="280.00" y="530.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">水平分量把扭矩抵掉四成——只看垂直分量會高估 69%</text></g><text x="560.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">斜向載重的偏心距是形心到力線的垂直距離，不是作用點的水平或垂直座標</text></svg>