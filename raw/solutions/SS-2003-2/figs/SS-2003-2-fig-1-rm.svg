eiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">強軸挫屈沿 60 cm 方向、弱軸挫屈沿 50 cm 方向</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② rm 取型鋼 r 與 0.3 × 全厚的較大者（cm）</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩個方向都由 0.3 × 全厚控制</text><text x="158.00" y="140.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">繞弱軸：型鋼 ry</text><rect x="170" y="126" width="107.8" height="28" rx="4" fill="#C3CAD5" stroke="none" stroke-width="1"/><text x="285.80" y="140.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">7.7</text><text x="158.00" y="202.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">0.3 × 50</text><rect x="170" y="188" width="210.0" height="28" rx="4" fill="#2E7D6F" stroke="none" stroke-width="1"/><text x="388.00" y="202.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">15.0 ←