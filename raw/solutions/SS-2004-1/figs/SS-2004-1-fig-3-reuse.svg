ill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">A 扭矩法目標</text><circle cx="373.02" cy="226.13" r="6.6" fill="#C0392B" stroke="#FFFFFF" stroke-width="2"/><text x="389.02" y="248.13" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">B 轉角法目標區（塑性）</text><line x1="373.02" y1="226.13" x2="207.55" y2="500.00" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="7 4"/><text x="237.55" y="396.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="400">卸載</text><line x1="90.00" y1="516.00" x2="207.55" y2="516.00" stroke="#C0392B" stroke-width="3.6"/><text x="217.55" y="516.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">拆卸後留下的永久伸長</text><line x1="373.02" y1="184.00" x2="594.00" y2="184.00" stroke="#B45309" stroke-width="2.4"/><line x1="373.02" y1="178.00" x2="373.02" y2="190.00" stroke="#B45309" stroke-width="2.4"/><line x1="594.00" y1="178.00" x2="594.00" y2="190.00" stroke="#B45309" stroke-width="2.4"/><text x="483.51" y="166.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">再鎖時只剩這段延性餘裕</text><text x="714.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">規範 §5.3.1：</text><text x="714.00" y="366.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">「已使用過之螺栓或帶有</text><text x="714.00" y="386.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">傷痕銹蝕者，不得再使用」</text><text x="714.00" y="418.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">主因（規範解說）：</text><text x="714.00" y="440.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">預拉力已超過降伏拉力，</text><text x="714.00" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">拆卸後已產生永久變形</text><text x="714.00" y="492.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">次因：</text><text x="714.00" y="514.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">K 值偏移 ⇒ 扭矩法失準（±10%）</text><text x="714.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">密貼起算點失真 ⇒ 轉角法失準</text><text x="510.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 3　鎖緊本身就是刻意讓螺栓進入降伏之後</text><text x="354.34" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">以 F10T 為例：F<tspan dy="3.90" font-size="8.84">u</tspan><tspan dy="-3.90" font-size="13"> = 1000、降伏比約 0.9 ⇒ F</tspan><tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13"> ≈ 900 MPa</tspan></text><text x="369.58" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">0.7F<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5"> = 700 MPa 本身仍在彈性段（為 F</tspan><tspan dy="3.75" font-size="8.5">y</tspan><tspan dy="-3.75" font-size="12.5"> 的 78%）；</tspan></text><text x="510.00" y="106.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">是「轉角法再轉 1/3～2/3 圈」把螺栓推過降伏，規範解說所稱「已超過降伏拉力」即指此</text><text x="510.00" y="594.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">這是單調靜力造成的塑性耗損，不是疲勞——把理由寫成「疲勞」是本小題最常見的錯</text></svg>