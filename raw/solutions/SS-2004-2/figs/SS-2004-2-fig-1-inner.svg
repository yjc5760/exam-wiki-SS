 − 22)/2 = 60.5 → 60 mm</text><text x="280.00" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">一行螺栓兩側邊距 1.5d：3d ≤ 60 ⇒ d ≤ 20 mm</text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="548" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 螺栓直徑試選（每翼板每側）</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">灰＝內板寬需求 3d；藍＝每側連接長度</text><line x1="258.00" y1="108.00" x2="258.00" y2="408.00" stroke="#C0392B" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="5 4" opacity="1.0"/><text x="258.00" y="98.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">可用 60</text><text x="106.00" y="148.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">M16</text><rect x="120" y="128" width="110.39999999999999" height="18" rx="3" fill="#C3CAD5" stroke="none" stroke-width="1"/><text x="236.40" y="137.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">3d = 48</text><rect x="120" y="150" width="201.600000000