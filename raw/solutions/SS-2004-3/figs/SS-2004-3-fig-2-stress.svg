<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="682" viewBox="0 0 1120 682"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="560" height="560"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="560" height="560"/></clipPath></defs><rect width="1120" height="682" fill="#FFFFFF"/><text x="560.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　控制點在下水平銲右端，Pu = 33.4 tf</text><text x="560.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">f = Pu/Lw ＋ M·r/J（Lw = 25 cm、J = 3519.3 cm³、M = 1.94·Pu）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="548" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 銲道端點應力（直接＋扭矩，×Pu）</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">箭頭長度與應力成比例</text><line x1="170.00" y1="97.50" x2="267.50" y2="97.50" stroke="#C0392B" stroke-width="5.0" stroke-linecap="butt" opacity="1.0"/><line x1="170.00" y1="162.50" x2="170.00" y2="97.50" stroke="#C0392B" stroke-width="5.0" stroke-linecap="butt" opacity="1.0"/><line x1="170.00" y1="422.50" x2="267.50" y2="422.50" stroke="#C0392B" stroke-width="5.0" stroke-linecap="butt" opacity="1.0"/><line x1="170.00" y1="422.50" x2="170.00" y2="357.50" stroke="#C0392B" stroke-width="5.0" stroke-linecap="butt" opacity="1.0"/><polyline points="170.00,422.50 430.00,422.50" fill