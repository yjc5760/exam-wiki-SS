54" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">0.04702</text><line x1="170.00" y1="422.50" x2="142.11" y2="443.93" stroke="#2E7D6F" stroke-width="2.0" stroke-linecap="round"/><polygon points="134.97,449.41 139.59,440.65 144.63,447.21" fill="#2E7D6F"/><circle cx="170.00" cy="422.50" r="3.5" fill="#1F2733" stroke="#FFFFFF" stroke-width="1.6"/><text x="128.97" y="465.41" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">0.0444</text><line x1="170.00" y1="357.50" x2="144.64" y2="378.65" stroke="#2E7D6F" stroke-width="2.0" stroke-linecap="round"/><polygon points="137.72,384.41 141.98,375.47 147.29,381.83" fill="#2E7D6F"/><circle cx="170.00" cy="357.50" r="3.5" fill="#1F2733" stroke="#FFFFFF" stroke-width="1.6"/><text x="131.72" y="400.41" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">0.0422</text><text x="280.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">控制點：下水平右端　fr = 0.04702·Pu</text><text x="280.00" y="530.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">順時針扭矩使下緣右端的扭矩剪力朝左下，與直接剪力同向</text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="548" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 最大 Pu（tf）</text><text x="280.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">φRnw = 0.75 × 0.6 × 4.93 × 0.707 = 1.568 t/cm</text><text x="158.00" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">本解（含扭矩）</text><rect x="170" y="154" width="266.8592378322969" height="32" rx="4" fill="#2E7D6F" stroke="none" stroke-width="1"/><text x="444.86" y="170.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">33.4</text><text x="158.00" y="260.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">上限：無扭矩</text><rect x="170" y="244" width="313.69589999999994" height="32" rx="4" fill="#C3CAD5" stroke="none" stroke-width="1"/><text x="491.70" y="260.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">39.2</text><text x="280.00" y="478.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">Pu = 1.568 / 0.04702 = 33.4 tf</text><text x="280.00" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">為無扭矩上限的 85%——符合「載重線接近形心」</text><text x="280.00" y="530.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">答案若遠低於此上限，多半是扭矩算大了</text></g><text x="560.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">六個端點都要比：扭矩剪力最大處不一定是合力最大處，要看它與直接剪力的夾角</text></svg>