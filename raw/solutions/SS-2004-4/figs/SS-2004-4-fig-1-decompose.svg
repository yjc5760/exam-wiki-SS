<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="662" viewBox="0 0 1040 662"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="540"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="540"/></clipPath></defs><rect width="1040" height="662" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 1　45° 懸臂：P 拆成軸壓 N 與橫力 V，固端彎矩取水平力臂</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">N = V = 1.414 tf；M = P × L sin45° = V × L = 495 tf·cm（弱軸，S_y 控制）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="508" height="528" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 鉛直 P 分解到構材座標</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">固定端在左下、自由端在右上（長度示意）</text><line x1="120.00" y1="375.00" x2="332.13" y2="162.87" stroke="#3F4A5A" stroke-width="5" stroke-linecap="butt" opacity="1.0"/><line x1="98.79" y1="353.79" x2="141.21" y2="396.21" stroke="#3F4A5A" stroke-width="3.2" stroke-linecap="round"/><line x1="100.27" y1="355.27" x2="89.66" y2="355.97" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="110.13" y1="365.13" x2="99.53" y2="365.84" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="120.00" y1="375.00" x2="109.39" y2="375.71" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="129.87" y1="384.87" x2="119.26" y2="385.57" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="139.73" y1="394.73" x2="129.13" y2="395.44" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="332.13" y1="162.87" x2="332.13" y2="375.00" stroke="#C3CAD5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" opacity="1.0"/><line x1="96.00" y1="375.00" x2="350.13" y2="375.00" stroke="#C3CAD5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" opacity="1.0"/><line x1="120.00" y1="375.00" x2="120.00" y2="441.08" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="332.13" y1="375.00" x2="332.13" y2="441.08" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="120.00" y1="431.00" x2="332.13" y2="431.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="120.00,431.00 128.00,434.20 128.00,427.80" fill="#8A94A6"/><polygon points="332.13,431.00 324.13,427.80 324.13,434.20" fill="#8A94A6"/><text x="226.07" y="447.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L sin45° = 247.5 cm</text><text x="226.07" y="471.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">＝ P 對固定端的力臂</text><line x1="332.13" y1="162.87" x2="332.13" y2="271.87" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="332.13,282.87 327.07,271.87 337.19,271.87" fill="#C0392B"/><text x="322.13" y="270.87" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">P = 2 tf</text><line x1="322.59" y1="153.32" x2="266.02" y2="209.89" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="258.95,216.96 262.76,206.64 269.27,213.14" fill="#1D4ED8"/><text x="250.95" y="202.96" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">N = P cos45° = 1.414 tf（壓）</text><line x1="332.13" y1="162.87" x2="388.70" y2="219.44" stroke="#7C3AED" stroke-width="3.0" stroke-linecap="round"/><polygon points="395.77,226.51 385.45,222.69 391.95,216.18" fill="#7C3AED"/><text x="389.77" y="250.51" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#7C3AED" text-anchor="start" dominant-baseline="middle" font-weight="700">V = P sin45°</text><text x="389.77" y="270.51" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#7C3AED" text-anchor="start" dominant-baseline="middle" font-weight="700">= 1.414 tf</text><path d="M 85.36 355.00 A 40 40 0 1 1 126.95 414.39" fill="none" stroke="#2E7D6F" stroke-width="2.6" stroke-linecap="round"/><polygon points="126.95,414.39 136.00,408.13 137.59,417.19" fill="#2E7D6F"/><text x="170.00" y="401.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">M = 495 tf·cm</text><text x="260.00" y="510.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">P × 力臂 與 V × L 是同一個量：兩種算法必須相等</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="528" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 沿構材的彎矩 M(s)（s 由自由端量起）</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">M 隨 s 線性增加，固端最大</text><line x1="80.00" y1="400.00" x2="450.00" y2="400.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="butt" opacity="1.0"/><line x1="80.00" y1="400.00" x2="80.00" y2="110.00" stroke="#6B7684" stroke-width="1.6" stroke-linecap="butt" opacity="1.0"/><polygon points="80.00,400.00 440.00,209.08 440.00,400.00" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="2.4" opacity="1.0"/><line x1="80.00" y1="400.00" x2="440.00" y2="130.00" stroke="#C0392B" stroke-width="2.2" stroke-linecap="butt" stroke-dasharray="7 5" opacity="1.0"/><circle cx="440.00" cy="209.08" r="5" fill="#2E7D6F" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="440.00" cy="130.00" r="5" fill="#C0392B" stroke="#FFFFFF" stroke-width="1.6"/><text x="428.00" y="334.08" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">V·L = 495 tf·cm</text><text x="432.00" y="116.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">誤：P·L = 700</text><text x="80.00" y="422.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">自由端 s = 0</text><text x="440.00" y="422.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">固定端 s = L = 350 cm</text><text x="260.00" y="460.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">fby = 495 / 152 = 3.256 tf/cm²</text><text x="260.00" y="486.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">誤用 P·L 會得 4.605，高估 41%</text></g><text x="520.0" y="640" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">斜置構材的彎矩只由垂直桿軸的分量產生；沿桿軸的分量 N 是軸壓，不貢獻一階彎矩</text></svg>