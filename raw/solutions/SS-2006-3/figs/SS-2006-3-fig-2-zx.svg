C',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">腹板：12 × 560² / 4</text><text x="660.00" y="280.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">= 940,800 mm³</text><text x="660.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（半腹板 12×280 × 力偶臂 280）</text><text x="660.00" y="360.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">Zx = 4,420,800 mm³ = 4,420.8 cm³</text><text x="660.00" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">Mp = 3.5 × 4,420.8 = 15,472.8 tf-cm</text><text x="660.00" y="440.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">≈ 154.7 tf-m</text></g><text x="550.0" y="640" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">翼板力偶臂是兩翼板形心距 H − tf，不是 H；腹板力偶臂是 hw/2，不是 hw</text></svg>