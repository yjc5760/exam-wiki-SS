<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="662" viewBox="0 0 1100 662"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1100" height="540"/></clipPath></defs><rect width="1100" height="662" fill="#FFFFFF"/><text x="550.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　Zx = 4,420,800 mm³，Mp = Fy·Zx = 15,472.8 tf-cm</text><text x="550.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">mm³ 換 cm³ 除以 1,000；Fy 用 tf/cm²，Mp 單位才是 tf-cm</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="1088" height="528" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="550.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">全塑性：PNA 在對稱軸，上半全壓 Fy、下半全拉 Fy</text><text x="550.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">Zx = 翼板 bf·tf·(H − tf) ＋ 腹板 tw·hw²/4</text><polygon points="107.00,124.00 293.00,124.00 293.00,136.40 107.00,136.40" fill="#C9D0DA" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><polygon points="107.00,483.60 293.00,483.60 293.00,496.00 107.00,496.00" fill="#C9D0DA" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><polygon points="196.28,136.40 203.72,136.40 203.72,483.60 196.28,483.60" fill="#C9D0DA" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><line x1="80.00" y1="310.00" x2="460.00" y2="310.00" stroke="#B45309" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="8 3 2 3" opacity="1.0"/><text x="76.0