<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="642" viewBox="0 0 1000 642"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1000" height="520"/></clipPath></defs><rect width="1000" height="642" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 1　平衡銲：P 偏向肢背，b 側要比 a 側長（31 對 12 cm）</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">P 作用線距 a 側 10 cm、距 b 側 5 cm；端部橫向銲 15 cm 承 18.71 tf（合力在 7.5 cm）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="988" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="500.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">角鋼 150 mm 肢平貼連接板（平面，依比例）</text><text x="500.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">紅＝銲道；箭頭＝銲道對角鋼的抵抗力與外力 P</text><polygon points="235.00,350.00 745.00,350.00 745.00,125.00 235.00,125.00" fill="rgba(63,74,90,0.10)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><line x1="235.00" y1="125.00" x2="415.00" y2="125.00" stroke="#C0392B" stroke-width="6" stroke-linecap="butt" opacity="1.0"/><line x1="235.00" y1="350.00" x2="700.00" y2="350.00" stroke="#C0392B" stroke-width="6" stroke-linecap="butt" opacity="1.0"/><line x1="235.00" y1="350.00" x2="235.00" y2="125.00" stroke="#C0392B" stroke-width="6" stroke-linecap="butt" opacity="1.0"/><text x="325.00" y="111.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">a = 12 cm</text><text x="467.50" y="372.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">b = 31 cm</text><text x="817.00" y="129.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">a 側（趾）</text><text x="817.00" y="354.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">b 側（肢背）</text><line x1="655.00" y1="275.00" x2="850.00" y2="275.00" stroke="#C3CAD5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" opacity="1.0"/><line x1="715.00" y1="275.00" x2="838.00" y2="275.00" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="850.00,275.00 838.00,280.52 838.00,269.48" fill="#C0392B"/><text x="856.00" y="275.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">P = 71.9</text><line x1="212.50" y1="125.00" x2="194.00" y2="125.00" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="184.00,125.00 194.00,120.40 194.00,129.60" fill="#1D4ED8"/><text x="178.00" y="125.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">Fa = 14.62</text><line x1="212.50" y1="237.50" x2="186.02" y2="237.50" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="176.02,237.50 186.02,232.90 186.02,242.10" fill="#1D4ED8"/><text x="170.02" y="237.50" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">F3 = 18.71</text><line x1="212.50" y1="350.00" x2="147.26" y2="350.00" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round"/><polygon points="137.26,350.00 147.26,345.40 147.26,354.60" fill="#1D4ED8"/><text x="131.26" y="350.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="end" dominant-baseline="middle" font-weight="700">Fb = 38.59</text><line x1="805.00" y1="275.00" x2="769.60" y2="275.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="805.00" y1="125.00" x2="769.60" y2="125.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="775.00" y1="275.00" x2="775.00" y2="125.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="775.00,275.00 778.20,267.00 771.80,267.00" fill="#8A94A6"/><polygon points="775.00,125.00 771.80,133.00 778.20,133.00" fill="#8A94A6"/><text x="761.00" y="200.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">10</text><line x1="805.00" y1="350.00" x2="769.60" y2="350.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="805.00" y1="275.00" x2="769.60" y2="275.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="775.00" y1="350.00" x2="775.00" y2="275.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="775.00,350.00 778.20,342.00 771.80,342.00" fill="#8A94A6"/><polygon points="775.00,275.00 771.80,283.00 778.20,283.00" fill="#8A94A6"/><text x="761.00" y="312.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">5</text><text x="500.00" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">對 a 線取矩：Fb × 15 + F3 × 7.5 = P × 10 ⇒ Fb = 38.59；Fa = P − F3 − Fb = 14.62（tf）</text></g><text x="500.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">驗算：三力合力位置 (0 × 14.62 + 7.5 × 18.71 + 15 × 38.59) / 71.9 = 10.0 cm（自 a 側），恰為 P 作用線位置</text></svg>