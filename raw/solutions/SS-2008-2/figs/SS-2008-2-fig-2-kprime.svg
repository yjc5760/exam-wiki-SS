'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">P<tspan dy="3.90" font-size="8.84">e</tspan><tspan dy="-3.90" font-size="13"> = π²EI/L²；ΣP</tspan><tspan dy="3.90" font-size="8.84">e</tspan><tspan dy="-3.90" font-size="13">K = π²EI/(2L)²</tspan></text><text x="660.00" y="182.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">K'² = (P<tspan dy="3.90" font-size="8.84">e</tspan><tspan dy="-3.90" font-size="13">/P)·(2P/ΣP</tspan><tspan dy="3.90" font-size="8.84">e</tspan><tspan dy="-3.90" font-size="13">K) = 4 × 2 = 8</tspan></text><text x="660.00" y="214.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">K' = √8 = 2.83</text><text x="660.00" y="278.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">每柱臨界 P：</text><text x="660.00" y="310.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">單獨 π²EI/4L² = 2.467 EI/L²</text><text x="660.00" y="342.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">有靠桿 π²EI/8L² = 1.234 EI/L²（減半）</text></g><text x="500.0" y="640" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">分子分母寫反得 1.41（K 反而變小，與物理相反）；把 CD 也放進 ΣPeK 則根號內出現 0 或 ∞</text></svg>