n></text><text x="652.00" y="268.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="400">← 本題所問的答案</text><text x="652.00" y="302.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">② 當 F<tspan dy="3.60" font-size="8.16">p</tspan><tspan dy="-3.60" font-size="12"> 依式(10.3-1a)/(10.3-1b)</tspan></text><text x="652.00" y="322.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">　 取用時，沿力量傳遞方向</text><text x="652.00" y="344.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">s ≥ 3 d<tspan dy="3.90" font-size="8.84">b</tspan></text><text x="652.00" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="700">③ 承壓需求（式 10.3-2）</text><text x="652.00" y="400.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">s ≥ P/(F<tspan dy="3.75" font-size="8.5">u</tspan><tspan dy="-3.75" font-size="12.5">t) + d/2</tspan></text><text x="652.00" y="434.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">數值示例（d<tspan dy="3.60" font-size="8.16">b</