 141.2) = 15.72 cm</text><text x="540.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">KL/r = 2500 / 15.72 = 159.0</text><text x="540.00" y="412.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">配錯：276 配 15.0 cm ⇒ 32,874、KL/r 163.8</text></g><text x="500.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">形心距離由外緣量入：dX = 20 − cx、dY = 20 − cy；40 cm 不是形心間距</text></svg>