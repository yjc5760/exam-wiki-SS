<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="682" viewBox="0 0 1000 682"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1000" height="560"/></clipPath></defs><rect width="1000" height="682" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 1　平行軸定理：I_X = 34,898 小於 I_Y = 44,198，繞 X 控制，KL/r = 159.0</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">單角鋼的 I 與距離 d 必須是同一個軸</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="988" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="500.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">組合斷面：各角鋼形心到 C.G. 的距離</text><text x="500.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">長肢垂直 ⇒ cx = 5.0 是垂直量、配單角鋼 Ix = 782</text><polygon points="80.00,480.00 170.00,480.00 170.00,466.50 93.50,466.50 93.50,345.00 80.00,345.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><circle cx="102.77" cy="435.00" r="4.5" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><polygon points="80.00,120.00 170.00,120.00 170.00,133.50 93.50,133.50 93.50,255.00 80.00,255.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><circle cx="102.77" cy="165.00" r="4.5" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><polygon points="440.00,480.00 350.00,480.00 350.00,466.50 426.50,466.50 42