300" height="66" rx="10" fill="#FFFFFF" stroke="#E1E6ED" stroke-width="1.2"/><line x1="131.9" y1="343.6" x2="153.9" y2="343.6" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="161.90" y="343.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">C<tspan dy="3.60" font-size="8.16">b</tspan><tspan dy="-3.60" font-size="12"> = 1.000（主答：均勻彎矩）</tspan></text><line x1="131.9" y1="364.6" x2="153.9" y2="364.6" stroke="#6B7684" stroke-width="4" stroke-linecap="round"/><text x="161.90" y="364.60" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">C<tspan dy="3.60" font-size="8.16">b</tspan><tspan dy="-3.60" font-size="12"> = 1.136（另解：均佈載重）</tspan></text><text x="470.00" y="520.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">一支中間側撐讓強軸強度由 945.8 提升到 1,140.8 kN-m（＋20.6%），互制比由 0.715 降到 0.643</text><text x="470.00" y="542.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">這是 LTB 題型最重要的實務啟示：側撐位置比換大斷面便宜得多</text></svg>