拉力面（誤）</text><line x1="221.38" y1="293.38" x2="221.38" y2="333.50" stroke="#C0392B" stroke-width="1" stroke-dasharray="3 3"/><line x1="291.92" y1="293.38" x2="291.92" y2="333.50" stroke="#C0392B" stroke-width="1" stroke-dasharray="3 3"/><line x1="221.38" y1="327.38" x2="291.92" y2="327.38" stroke="#C0392B" stroke-width="1.2"/><polygon points="221.38,327.38 229.38,330.58 229.38,324.18" fill="#C0392B"/><polygon points="291.92,327.38 283.92,324.18 283.92,330.58" fill="#C0392B"/><text x="256.65" y="340.38" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">7</text><text x="177.93" y="404.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.20" font-size="9.52">nv</tspan><tspan dy="-4.20" font-size="14"> = 14.64 cm</tspan><tspan dy="-5.60" font-size="9.52">2</tspan></text><text x="324.00" y="404.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">（只扣 1 孔）</text><text x="170.98" y="426.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.20" font-size="9.52">nt</tspan><tspan dy="-4.20" font-size="14"> = 3.36   A</tspan><tspan dy="4.20" font-size="9.52">gt</tspan><tspan dy="-4.20" font-size="14"> = 4.20 cm</tspan><tspan dy="-5.60" font-size="9.52">2</tspan></text><text x="250.00" y="450.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">完全沒用到橫向間距 g，破壞機構的物理圖像錯誤</text></g><text x="500.0" y="570" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">兩處幾何誤差恰好部分相消，BSR 只差 1.0%（82.7 → 83.5 tf）；但若題目改變 g 或 e1，舊版會給出嚴重錯誤的答案</text></svg>