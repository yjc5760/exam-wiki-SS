<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="592" viewBox="0 0 1000 592"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="500" height="470"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="500" height="470"/></clipPath></defs><rect width="1000" height="592" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　塊狀剪力破壞塊的幾何（自由端在哪一側決定一切）</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">T 把槽鋼往右拉 ⇒ 螺栓推腹板向左 ⇒ 破壞塊往左側自由端擠出</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="488" height="458" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="250.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">正解：拉力面在最遠一排螺栓</text><text x="250.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">剪力面自自由端量 15 cm</text><polygon points="70.23,293.38 221.38,293.38 221.38,192.62 70.23,192.62" fill="rgba(192,57,43,0.18)" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="70.23,343.77 312.08,343.77 312.08,142.23 70.23,142.23" fill="none" stroke="#3F4A5A" stroke-width="2.4" opacity="1.0"/><line x1="70.23" y1="343.77" x2="70.23" y2="142.23" stroke="#2E7D6F" stroke-width="4.0" stroke-linecap="butt" opacity="1.0"/><circle cx="120.62" cy="293.38" r="14.11" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="120.62" cy="192.62" r="14.11" fill="#FFFFFF" stroke="#3F