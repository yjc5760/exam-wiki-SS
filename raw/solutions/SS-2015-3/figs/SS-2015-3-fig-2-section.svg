<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="400" height="430"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="400" height="430"/></clipPath><clipPath id="sdclip2"><rect x="0" y="0" width="400" height="430"/></clipPath></defs><rect width="1200" height="552" fill="#FFFFFF"/><text x="600.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">組合斷面：哪一軸需要平行軸定理，決定了誰是弱軸</text><text x="600.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">加大兩槽鋼間距只會增加繞 Y 軸的慣性矩，對繞 X 軸完全無效 ⇒ 無論間距多大，X 軸永遠是弱軸（3,940 小於 9,699 cm⁴）</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="388" height="418" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="200.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 斷面尺寸判讀</text><text x="200.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">翼板朝內、腹板朝外（「[ ]」型）</text><polygon points="72.05,293.30 78.02,293.30 78.02,122.70 72.05,122.70" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,122.70 136.03,122.70 136.03,133.79 78.02,133.79" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,293.30 136.03,293.30 136.03,282.21 78.02,282.21" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><polygon points="327.95,293.30 321.98,293.30 321.98,122.70 327.95,122.70" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><polygon points="321.98,122.70 263.98,122.70 263.98,133.79 321.98,133.79" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><polygon points="321.98,293.30 263.98,293.30 263.98,282.21 321.98,282.21" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><circle cx="93.29" cy="208.00" r="5.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="306.71" cy="208.00" r="5.0" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><line x1="72.05" y1="293.30" x2="72.05" y2="323.98" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="327.95" y1="293.30" x2="327.95" y2="323.98" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="72.05" y1="319.30" x2="327.95" y2="319.30" stroke="#8A94A6" stroke-width="1.2"/><polygon points="72.05,319.30 80.05,322.50 80.05,316.10" fill="#8A94A6"/><polygon points="327.95,319.30 319.95,316.10 319.95,322.50" fill="#8A94A6"/><text x="200.00" y="331.30" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">外寬 30 cm</text><line x1="72.05" y1="122.70" x2="31.93" y2="122.70" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="72.05" y1="293.30" x2="31.93" y2="293.30" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="38.05" y1="122.70" x2="38.05" y2="293.30" stroke="#8A94A6" stroke-width="1.2"/><polygon points="38.05,122.70 34.85,130.70 41.25,130.70" fill="#8A94A6"/><polygon points="38.05,293.30 41.25,285.30 34.85,285.30" fill="#8A94A6"/><text x="25.05" y="208.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">20 cm</text><line x1="72.05" y1="112.46" x2="72.05" y2="81.78" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="93.29" y1="112.46" x2="93.29" y2="81.78" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="72.05" y1="86.46" x2="93.29" y2="86.46" stroke="#8A94A6" stroke-width="1.2"/><polygon points="72.05,86.46 80.05,89.66 80.05,83.26" fill="#8A94A6"/><polygon points="93.29,86.46 85.29,83.26 85.29,89.66" fill="#8A94A6"/><text x="54.43" y="74.46" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">C<tspan dy="4.20" font-size="9.52">y</tspan><tspan dy="-4.20" font-size="14"> = 2.49</tspan></text><text x="200.00" y="352.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">20 cm 是腹板高（C200 的「200」），不是形心間距</text><text x="88.60" y="377.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">d = 30/2 − C<tspan dy="4.20" font-size="9.52">y</tspan><tspan dy="-4.20" font-size="14"> = 15 − 2.49 = 12.51 cm</tspan></text><text x="200.00" y="401.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">（每根槽鋼形心距組合 Y 軸）</text></g><g transform="translate(400,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="388" height="418" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="200.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 繞 X 軸（弱軸 ← 控制）</text><text x="200.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩形心都落在 X 軸上</text><polygon points="72.05,293.30 78.02,293.30 78.02,122.70 72.05,122.70" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,122.70 136.03,122.70 136.03,133.79 78.02,133.79" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,293.30 136.03,293.30 136.03,282.21 78.02,282.21" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="327.95,293.30 321.98,293.30 321.98,122.70 327.95,122.70" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="321.98,122.70 263.98,122.70 263.98,133.79 321.98,133.79" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="321.98,293.30 263.98,293.30 263.98,282.21 321.98,282.21" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><line x1="51.58" y1="208.00" x2="348.42" y2="208.00" stroke="#B45309" stroke-width="3.0" stroke-linecap="round" opacity="1.0"/><text x="356.42" y="208.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">X</text><circle cx="93.29" cy="208.00" r="5.4" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="306.71" cy="208.00" r="5.4" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="200.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">形心到 X 軸的距離 = 0 ⇒ 不需平行軸 Ad²</text><text x="119.73" y="352.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">I<tspan dy="4.20" font-size="9.52">X</tspan><tspan dy="-4.20" font-size="14"> = 2(1,970) = 3,940 cm</tspan><tspan dy="-5.60" font-size="9.52">4</tspan></text><text x="107.64" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">r<tspan dy="4.20" font-size="9.52">X</tspan><tspan dy="-4.20" font-size="14"> = √(3,940/59.8) = 8.12 cm</tspan></text><text x="200.00" y="402.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">← 最小迴旋半徑，控制本題</text></g><g transform="translate(800,76)" clip-path="url(#sdclip2)"><rect x="6" y="6" width="388" height="418" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="200.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">③ 繞 Y 軸</text><text x="200.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">形心偏離 Y 軸 d，必須用平行軸</text><polygon points="72.05,293.30 78.02,293.30 78.02,122.70 72.05,122.70" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,122.70 136.03,122.70 136.03,133.79 78.02,133.79" fill="#FFFFFF" stroke="#C3CAD5" stroke-width="1.6" opacity="1.0"/><polygon points="78.02,293.30 136.03,293.30 136.03,282.21 78.02,282.21" fill="#FFFFFF" s