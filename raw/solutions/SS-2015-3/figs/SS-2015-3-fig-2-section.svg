="3 3" opacity="1.0"/><line x1="200.00" y1="169.62" x2="200.00" y2="169.62" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="306.71" y1="169.62" x2="306.71" y2="169.62" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="200.00" y1="169.62" x2="306.71" y2="169.62" stroke="#8A94A6" stroke-width="1.2"/><polygon points="200.00,169.62 208.00,172.81 208.00,166.42" fill="#8A94A6"/><polygon points="306.71,169.62 298.71,166.42 298.71,172.81" fill="#8A94A6"/><text x="253.36" y="156.62" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">d = 12.51</text><text x="200.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">形心偏離 Y 軸 ⇒ 必須加 Ad²</text><text x="84.84" y="352.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">I<tspan dy="4.05" font-size="9.18">Y</tspan><tspan dy="-4.05" font-size="13.5"> = 2(170 + 29.9×12.51</tspan><tspan dy="-5.40" font-size="9.18">2</tspan><tspan dy="5.40" font-size="13.5">) = 9,699 cm</tspan><tspan dy="-5.40" font-size="9.18">4</tspan></text><text x="158.88" y="378.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">r<tspan dy="4.20" font-size="9.52">Y</tspan><tspan dy="-4.20" font-size="14"> = 12.74 cm</tspan></text><text x="200.00" y="402.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">不控制（加大槽鋼間距只會讓它更大）</text></g><text x="600.0" y="530" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">最小迴旋半徑 r = 8.12 cm（繞 X 軸）；若誤把圖上的 20 cm 當成形心間距，d 會由 12.51 變成 10，繞 Y 軸的慣性矩隨之算錯</text></svg>