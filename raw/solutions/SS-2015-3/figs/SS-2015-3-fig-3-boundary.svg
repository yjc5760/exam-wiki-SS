Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">本題柱底是鉸、曲率最大在頂端；懸臂柱柱底是固接、曲率最大在柱底。設計 k 一個 2.0、一個 2.1，判錯會讓容許長度由 700 掉到 667 cm（-4.8%）</text></svg>