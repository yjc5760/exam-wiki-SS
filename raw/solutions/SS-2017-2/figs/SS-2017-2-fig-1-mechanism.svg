rt" dominant-baseline="middle" font-weight="700" font-style="italic">T<tspan dy="4.20" font-size="9.52">b</tspan><tspan dy="-4.20" font-size="14"> = 0.7F</tspan><tspan dy="4.20" font-size="9.52">u</tspan><tspan dy="-4.20" font-size="14">A</tspan><tspan dy="4.20" font-size="9.52">t</tspan></text><text x="486.00" y="191.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400">螺栓預拉力 → 板間夾緊力</text><line x1="396.45" y1="252.84" x2="519.03" y2="252.84" stroke="#2E7D6F" stroke-width="3.6" stroke-linecap="round" opacity="1.0"/><line x1="460.19" y1="242.54" x2="366.23" y2="242.54" stroke="#2E7D6F" stroke-width="2.6" stroke-linecap="round"/><polygon points="357.23,242.54 366.23,238.40 366.23,246.68" fill="#2E7D6F"/><text x="349.87" y="242.54" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">接觸面 1</text><line x1="396.45" y1="287.16" x2="519.03" y2="287.16" stroke="#2E7D6F" stroke-width="3.6" stroke-linecap="round" opacity="1.0"/><line x1="460.19" y1="297.46" x2="366.23" y2="297.46" stroke="#2E7D6F" stroke-width="2.6" stroke-linecap="round"/><polygon points="357.23,297.46 366.23,293.32 366.23,301.60" fill="#2E7D6F"/><text x="349.87" y="297.46" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">接觸面 2</text><text x="228.61" y="169.48" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">f = μ · T<tspan dy="4.50" font-size="10.2">b</tspan></text><text x="259.16" y="189.48" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400">（每支、每個接觸面）</text><line x1="124.32" y1="235.68" x2="168.71" y2="235.68" stroke="#1D4ED8" stroke-width="3.4" stroke-linecap="round"/><polygon points="180.71,235.68 168.71,241.20 168.71,230.16" fill="#1D4ED8"/><text x="153.74" y="219.68" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">V</text><line x1="815.68" y1="270.00" x2="771.29" y2="270.00" stroke="#1D4ED8" stroke-width="3.4" stroke-linecap="round"/><polygon points="759.29,270.00 771.29,264.48 771.29,275.52" fill="#1D4ED8"/><text x="786.26" y="254.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">V</text><text x="470.00" y="377.87" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">滑動前螺栓桿幾乎不受剪、孔壁不承壓</text><text x="275.11" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">圖 1　摩阻型接合的剪力傳遞機制（雙剪，n<tspan dy="5.25" font-size="11.9">s</tspan><tspan dy="-5.25" font-size="17.5"> = 2）</tspan></text><text x="470.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">預緊 → 板間夾緊力 → 接觸面摩擦力抵抗剪力；力完全不經過螺栓桿</text><text x="262.33" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">A<tspan dy="3.75" font-size="8.5">t</tspan><tspan dy="-3.75" font-size="12.5"> 是螺紋處有效抗拉面積（約 0.75A</tspan><tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5">）；誤用全斷面積會把預拉力高估 33%</tspan></text><text x="253.67" y="494.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">AISC：R<tspan dy="3.90" font-size="8.84">n</tspan><tspan dy="-3.90" font-size="13"> = μ·D</tspan><tspan dy="3.90" font-size="8.84">u</tspan><tspan dy="-3.90" font-size="13">·h</tspan><tspan dy="3.90" font-size="8.84">f</tspan><tspan dy="-3.90" font-size="13">·T</tspan><tspan dy="3.90" font-size="8.84">b</tspan><tspan dy="-3.90" font-size="13">·n</tspan><tspan dy="3.90" font-size="8.84">s</tspan><tspan dy="-3.90" font-size="13">（D</tspan><tspan dy="3.90" font-size="8.84">u</tspan><tspan dy="-3.90" font-size="13"> = 1.13）；台灣 ASD 則直接查表列容許剪應力</tspan></text></svg>