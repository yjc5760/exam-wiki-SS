0">右側無銲道（開口朝右）</text><circle cx="151.46" cy="294.98" r="6.4" fill="#2E7D6F" stroke="#FFFFFF" stroke-width="1.6"/><line x1="151.46" y1="444.14" x2="151.46" y2="145.83" stroke="#2E7D6F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><text x="151.46" y="276.98" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">形心 (10, 40)</text><line x1="121.63" y1="438.17" x2="121.63" y2="468.85" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="240.95" y1="438.17" x2="240.95" y2="468.85" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="121.63" y1="464.17" x2="240.95" y2="464.17" stroke="#8A94A6" stroke-width="1.2"/><polygon points="121.63,464.17 129.63,467.37 129.63,460.97" fill="#8A94A6"/><polygon points="240.95,464.17 232.95,460.97 232.95,467.37" fill="#8A94A6"/><text x="181.29" y="476.17" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">40</text><line x1="240.95" y1="438.17" x2="240.95" y2="468.85" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="390.10" y1="438.17" x2="390.10" y2="468.85" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="240.95" y1="464.17" x2="390.10" y2="464.17" stroke="#8A94A6" stroke-width="1.2"/><polygon points="240.95,464.17 248.95,467.37 248.95,460.97" fill="#8A94A6"/><polygon points="390.10,464.17 382.10,460.97 382.10,467.37" fill="#8A94A6"/><text x="315.53" y="476.17" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">50</text><circle cx="240.95" cy="464.17" r="5" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="240.95" y="494.17" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">圓點＝尺寸線分段記號</text><text x="240.95" y="512.17" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">（不是形心）</text><line x1="390.10" y1="205.49" x2="390.10" y2="250.17" stroke="#C0392B" stroke-width="3.6" stroke-linecap="round"/><polygon points="390.10,262.17 384.58,250.17 395.62,250.17" fill="#C0392B"/><text x="390.10" y="193.56" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">P</text><line x1="151.46" y1="229.36" x2="151.46" y2="205.76" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="390.10" y1="229.36" x2="390.10" y2="205.76" stroke="#2E7D6F" stroke-width="1" stroke-dasharray="3 3"/><line x1="151.46" y1="209.36" x2="390.10" y2="209.36" stroke="#2E7D6F" stroke-width="1.2"/><polygon points="151.46,209.36 159.46,212.56 159.46,206.16" fill="#2E7D6F"/><polygon points="390.10,209.36 382.10,206.16 382.10,212.56" fill="#2E7D6F"/><text x="270.78" y="196.36" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">e = 80</text><text x="470.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　U 形銲道群的幾何與形心</text><text x="470.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">形心由 x̄ = b²/(2b+d) = 40²/160 = 10 cm 算出，偏心距要從形心量起</text><text x="470.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">若把尺寸線上的圓點當形心（x̄ = 40），反解得 b = 109.3 cm，與圖上長度比嚴重不符</text><text x="238.90" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">J<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> = 197,333 cm³（線積分；已用 J = Ix + Iy 交叉驗核）　M = P·e = 80P，順時針</tspan></text></svg>