an dy="3.60" font-size="8.16">w</tspan></text><line x1="642" y1="216" x2="664" y2="216" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="672.00" y="216.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">合成（臨界點）</text><line x1="642" y1="238" x2="664" y2="238" stroke="#6B7684" stroke-width="4" stroke-linecap="round"/><text x="672.00" y="238.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">合成（非臨界）</text><text x="642.00" y="288.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">f<tspan dy="3.75" font-size="8.5">v</tspan><tspan dy="-3.75" font-size="12.5"> = P/160 = 0.00625P</tspan></text><text x="642.00" y="312.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">f<tspan dy="3.75" font-size="8.5">tx</tspan><tspan dy="-3.75" font-size="12.5"> = M r</tspan><tspan dy="3.75" font-size="8.5">y</tspan><tspan dy="-3.75" font-size="12.5">/J</tspan><tspan dy="3.75" font-size="8.5">w</tspan></text><text x="642.00" y="334.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">f<tspan dy="3.75" font-size="8.5">ty</tspan><tspan dy="-3.75" font-size="12.5"> = − M r</tspan><tspan dy="3.75" font-size="8.5">x</tspan><tspan dy="-3.75" font-size="12.5">/J</tspan><tspan dy="3.75" font-size="8.5">w</tspan></text><text x="642.00" y="366.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">右端兩點的扭矩剪力</text><text x="642.00" y="386.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">有向下分量，與直接剪力</text><text x="642.00" y="406.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">同向疊加 ⇒ 最不利</text><text x="642.00" y="440.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">f<tspan dy="4.20" font-size="9.52">res</tspan><tspan dy="-4.20" font-size="14"> = 0.02454P</tspan></text><text x="440.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 2　彈性向量法：四個角點的疊加與臨界點</text><text x="440.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">扭矩剪力垂直於半徑、大小正比於 r；直接剪力沿全長均勻向下</text><text x="440.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">左端兩點離形心較近且扭矩分量向上（與直接剪力相消）——「離形心最遠」不等於「最不利」</text><text x="255.78" y="734.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">q = φ·0.6F<tspan dy="3.90" font-size="8.84">E</tspan><tspan dy="-3.90" font-size="13">XX·t</tspan><tspan dy="3.90" font-size="8.84">e</tspan><tspan dy="-3.90" font-size="13"> = 2.215 tf/cm ⇒ P</tspan><tspan dy="3.90" font-size="8.84">u</tspan><tspan dy="-3.90" font-size="13"> = 2.215/0.02454 = 90.3 tf</tspan></text></svg>