s TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">23.0 小於 27.5、34.8 ⇒ 非細長，Q = 1，全斷面有效</text></g><text x="500.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">把 80 當內寬、或忘了檢核 b/t，就沒完成「強度設計檢核」</text></svg>