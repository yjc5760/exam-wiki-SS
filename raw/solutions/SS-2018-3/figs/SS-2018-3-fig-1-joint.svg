1" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="654.06" y1="193.58" x2="793.30" y2="193.58" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="772.06" y1="207.01" x2="772.06" y2="193.58" stroke="#8A94A6" stroke-width="1.2"/><polygon points="772.06,207.01 775.26,199.01 768.86,199.01" fill="#8A94A6"/><polygon points="772.06,193.58 768.86,201.58 775.26,201.58" fill="#8A94A6"/><text x="765.11" y="200.30" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">t<tspan dy="4.20" font-size="9.52">f</tspan><tspan dy="-4.20" font-size="14"> = 16</tspan></text><line x1="612.07" y1="143.19" x2="612.07" y2="172.50" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="612.07,183.50 607.01,172.50 617.13,172.50" fill="#C0392B"/><text x="624.07" y="159.99" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">Q = 100 kN</text><path d="M 548.69 381.00 A 26 26 0 1 1 544.98 423.44" fill="none" stroke="#C0392B" stroke-width="2.8" stroke-linecap="round"/><polygon points="544.98,423.44 555.59,426.34 549.68,433.39" fill="#C0392B"/><text x="561.69" y="345.52" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">M = 150 kN·m</text><text x="450.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　梁柱接頭重繪：三處銲接符號皆為 6 mm 填角銲</text><text x="256.64" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">腹板有效銲長 l<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> = d − 2(t</tspan><tspan dy="3.90" font-size="8.84">f</tspan><tspan dy="-3.90" font-size="13"> + 扇形開孔) = 500 − 2(16 + 40) = 388 mm</tspan></text><text x="227.79" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">舊版把梁翼判為 CJP 而以母材 0.6F<tspan dy="3.75" font-size="8.5">y</tspan><tspan dy="-3.75" font-size="12.5"> 驗算得 OK；依圖面應以銲道喉面積檢核 ⇒ NG</tspan></text><text x="247.02" y="754.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">l<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> 與題目所給 S</tspan><tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> 公式中的 388² 完全一致，可作為圖面判讀的交叉驗核</tspan></text></svg>