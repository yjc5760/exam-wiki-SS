<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="500" height="440"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="500" height="440"/></clipPath></defs><rect width="1000" height="562" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 2　腹板填角銲：彎矩與剪力必須向量合成</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">腹板銲道為兩條鉛垂線；M_w 使力沿梁軸（橫向 θ = 90°）、Q 使力鉛垂（縱向 θ = 0°），兩者正交</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="488" height="428" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="250.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 兩個分量正交</text><text x="250.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">彎矩水平、剪力垂直</text><line x1="142.52" y1="190.90" x2="391.97" y2="190.90" stroke="#B45309" stroke-width="3.2" stroke-linecap="round"/><polygon points="402.97,190.90 391.97,195.96 391.97,185.84" fill="#B45309"/><line x1="142.52" y1="190.90" x2="142.52" y2="245.95" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round"/><polygon points="142.52,256.95 137.46,245.95 147.58,245.95" fill="#1D4ED8"/><line x1="142.52" y1="190.90" x2="390.37" y2="253.76" stroke="#C0392B" stroke-width="4.0" stroke-linecap="round"/><polygon points="402.97,256.95 388.90,259.55 391.84,247.96" fill="#C0392B"/><line x1="402.97" y1="190.90" x2="402.97" y2="256.95" stroke="#C3CAD5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><line x1="142.52" y1="256.95" x2="402.97" y2="256.95" stroke="#C3CAD5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><text x="240.85" y="174.90" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">τ<tspan dy="3.90" font-size="8.84">w1</tspan><tspan dy="-3.90" font-size="13"> = 119.8</tspan></text><text x="75.49" y="223.93" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">τ<tspan dy="3.90" font-size="8.84">w2</tspan><tspan dy="-3.90" font-size="13"> = 30.4</tspan></text><text x="412.97" y="272.95" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700" font-style="italic">τ = 123.6</text><text x="157.70" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">τ = 123.6 大於 f<tspan dy="4.05" font-size="9.18">a</tspan><tspan dy="-4.05" font-size="13.5"> = 90.5 N/mm²</tspan></text><text x="250.00" y="402.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">⇒ 6 mm 腹板填角銲 NG（超出 37%）</text><text x="154.28" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">只比 τ<tspan dy="3.60" font-size="8.16">w</tspan><tspan dy="-3.60" font-size="12">1 就下結論，會漏掉剪力貢獻</tspan></text></g><g transform="translate(500,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="488" height="428" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="250.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 反算所需銲腳尺寸</text><text x="250.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">應力與 w 成反比</text><text x="138.00" y="142.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">6 mm（圖示）</text><rect x="150" y="127" width="250" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="150" y="127" width="219.2982456140351" height="30" rx="6" fill="#C0392B" stroke="none" stroke-width="1"/><text x="386.30" y="142.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">123.6</text><text x="138.00" y="200.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">8.19 mm（恰好）</text><rect x="150" y="185" width="250" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="150" y="185" width="160.6156541907845" height="30" rx="6" fill="#B45309" stroke="none" stroke-width="1"/><text x="327.62" y="200.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">90.5</text><text x="138.00" y="258.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">9 mm（採用）</text><rect x="150" y="243" width="250" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="150" y="243" width="146.19883040935676" height="30" rx="6" fill="#2E7D6F" stroke="none" stroke-width="1"/><text x="313.20" y="258.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">82.4</text><line x1="310.61565419078454" y1="116" x2="310.61565419078454" y2="280" stroke="#B45309" stroke-width="1.8" stroke-dasharray="6 4"/><text x="286.41" y="108.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">f<tspan dy="3.60" font-size="8.16">a</tspan><tspan dy="-3.60" font-size="12"> = 90.5</tspan></text><text x="250.00" y="378.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">τ(w) = 741/w</text><text x="152.80" y="402.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">令 τ = f<tspan dy="3.90" font-size="8.84">a</tspan><tspan dy="-3.90" font-size="13"> ⇒ w ≥ 8.19 mm，採用 9 mm</tspan></text><text x="250.00" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">9 mm 驗算：τ = 82.4 小於 90.5 ✓</text></g><text x="500.0" y="540" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">題目已給 τ_w1 = 119.8，核心就是補上 τ_w2 = Q/A_w = 30.4 再合成——1 分鐘可完成</text></svg>