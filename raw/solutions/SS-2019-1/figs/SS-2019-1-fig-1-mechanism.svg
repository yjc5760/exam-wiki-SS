iti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">露鋼處立即鏽蝕</text><text x="190.00" y="378.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">且鏽蝕沿膜下擴展（膜下腐蝕）</text><text x="190.00" y="404.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">塗膜無法保護沒被蓋住的地方</text><text x="190.00" y="426.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">⇒ 表面處理是成敗關鍵</text></g><g transform="translate(380,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="368" height="428" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="190.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">熱浸鍍鋅</text><text x="190.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">浸入約 450 °C 熔融鋅液</text><polygon points="26.00,307.50 288.50,307.50 288.50,228.75 26.00,228.75" fill="#DCE3EC" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><text x="41.75" y="268.12" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#3F4A5A" text-anchor="start" dominant-baseline="middle" font-weight="700">鋼材</text><polygon points="26.00,228.75 288.50,228.75 288.50,210.38 26.00,210.38" fill="#9AA7B4" 