面</text><rect x="724" y="340" width="250" height="34" rx="4" fill="#DCE3EC" stroke="#3F4A5A" stroke-width="1.8"/><line x1="849" y1="334" x2="849" y2="380" stroke="#C0392B" stroke-width="3"/><text x="849.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">工地銲接</text><rect x="779" y="340" width="140" height="34" rx="0" fill="rgba(192,57,43,0.16)" stroke="none" stroke-width="1"/><line x1="779" y1="390" x2="849" y2="390" stroke="#C0392B" stroke-width="1.8"/><line x1="779" y1="385" x2="779" y2="395" stroke="#C0392B" stroke-width="1.8"/><line x1="849" y1="385" x2="849" y2="395" stroke="#C0392B" stroke-width="1.8"/><text x="814.00" y="406.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">100 mm</text><line x1="849" y1="390" x2="919" y2="390" stroke="#C0392B" stroke-width="1.8"/><line x1="849" y1="385" x2="849" y2="395" stroke="#C0392B" stroke-width="1.8"/><line x1="919" y1="385" x2="919" y2="395" stroke="#C0392B" stroke-width="1.8"/><text x="884.00" y="406.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">100 mm</text><text x="724.00" y="432.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">不是 50 mm——兩側各 100 mm，</text><text x="724.00" y="452.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">合計 200 mm 範圍內不予塗裝</text><text x="510.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 3　§7.4.4 的四項限制是「任一成立即不得塗裝」</text><text x="510.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">四項各切掉圖上一塊區域，剩下的綠色才是可施工窗口</text><text x="510.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">③ 露點條件不是 ② 的重述：溫度愈低，露點界線愈早咬住（10 °C 時約 81.6%，已低於 85%）</text><text x="510.00" y="574.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">只寫「濕度與露點」而漏掉 ① 5 °C 與 ④ 50 °C，等於漏掉一半的環境限制</text></svg>