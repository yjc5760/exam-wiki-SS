baseline="middle" font-weight="700">T = As·Fy = 277 tf（距版頂 ts + d/2 = 40）</text><line x1="685.00" y1="146.63" x2="685.00" y2="352.00" stroke="#8A94A6" stroke-width="1.3" stroke-linecap="butt" opacity="1.0"/><text x="692.00" y="249.31" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">力臂 = 40 − 3.105 = 36.895 cm</text><text x="660.00" y="480.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">Mn = 277 × 36.895 = 10,220 tf·cm = 102.2 tf·m</text><text x="660.00" y="506.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">（φbMn = 0.9 × 102.2 = 92.0 tf·m）</text></g><text x="560.0" y="720" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">力臂常見錯：用鋼梁深 d 或 d/2 + ts/2（把 PNA 當成在版中央）；或 a 用全版厚 15 cm</text></svg>