Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">最不利螺栓（最外排）</text><line x1="652" y1="168" x2="674" y2="168" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="682.00" y="168.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">直接剪力 V/n = 11.67 tf</text><line x1="652" y1="190" x2="674" y2="190" stroke="#B45309" stroke-width="4" stroke-linecap="round"/><text x="682.00" y="190.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">彎矩剪力 M y/Σy²</text><line x1="652" y1="212" x2="674" y2="212" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="682.00" y="212.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">合力（最不利）</text><text x="652.00" y="258.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">f<tspan dy="3.90" font-size="8.84">v</tspan><tspan dy="-3.90" font-size="13"> = 70/6 = 11.67 tf</tspan></text><text x="652.00" y="282.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">f<tspan dy="3.90" font-size="8.84">h</tspan><tspan dy="-3.90" font-size="13"> = 1,297×20/1,120 = 23.16 tf</tspan></text><text x="652.00" y="306.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">R<tspan dy="4.20" font-size="9.52">max</tspan><tspan dy="-4.20" font-size="14"> = 25.93 tf</tspan></text><text x="652.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">三種假設的差距：</text><text x="652.00" y="368.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A 只有 V（舊版）：11.67 tf</text><text x="652.00" y="389.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">B ＋偏心 V·e：13.24 tf</text><text x="652.00" y="410.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">C ＋腹板分擔彎矩：25.93 tf</text><text x="652.00" y="448.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5"> ≥ 25.93/(2×2.8) = 4.631 cm</tspan><tspan dy="-5.00" font-size="8.5">2</tspan></text><text x="652.00" y="472.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">d<tspan dy="3.75" font-size="8.5">b</tspan><tspan dy="-3.75" font-size="12.5"> ≥ 2.428 cm</tspan></text><text x="748.00" y="472.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">⇒ 選 D25</text><text x="652.00" y="498.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">容量 2×4.909×2.8 = 27.49 tf（使用率 94.3%）</text><text x="470.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 3　偏心螺栓群：直接剪力均勻、彎矩剪力線性</text><text x="470.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">ASD 是「逐支」檢核最不利螺栓，不是把總力除以螺栓數</text><text x="470.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">只用 V/n 會得 11.67 tf（低估 55%），螺栓由 D25 誤選為 M20</text><text x="470.00" y="594.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">彎矩剪力隨 y 線性變化 ⇒ 最外排最大；與均勻的直接剪力正交疊加</text></svg>