n dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13"> = 1，彎矩用 0.6F</tspan><tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13"> = 1.5 tf/cm²</tspan></text><text x="450.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">彎矩控制（1.126 cm）比剪力控制（0.729 cm）大 54%——只算剪力會選成 8 mm</text><text x="266.52" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">鈑件不符「結實斷面」之肢材定義，故彎曲用 0.6F<tspan dy="3.90" font-size="8.84">y</tspan><tspan dy="-3.90" font-size="13"> 而非 0.66F</tspan><tspan dy="3.90" font-size="8.84">y</tspan></text></svg>