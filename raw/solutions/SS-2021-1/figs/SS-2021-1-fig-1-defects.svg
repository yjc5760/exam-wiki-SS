="middle" font-weight="700">c　重疊：銲材翻捲外舖、未與母材熔合（多料）</text><polyline points="592.27,306.69 584.02,319.66 595.81,329.10 586.96,343.25 594.63,356.22" fill="none" stroke="#B45309" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><circle cx="592.27" cy="306.69" r="4.6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><line x1="592.27" y1="336.17" x2="656.90" y2="412.83" stroke="#B45309" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3" opacity="1.0"/><text x="662.90" y="412.83" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">d　母材／HAZ 裂縫：往板厚方向</text><text x="662.90" y="430.83" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">（受拘束時即層狀撕裂）</text><text x="480.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">圖 1　四處瑕疵的斷面幾何——先讀幾何再定名</text><text x="480.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩個問題答完，名稱就唯一：① 缺料還是多料　② 在銲材裡還是在母材裡</text><text x="480.00" y="84.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400">咬邊與重疊都在銲趾、方向卻相反：咬邊少肉是缺口，重疊多肉是假接</text><text x="480.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">圖中沒有任何圓形空洞或不規則夾雜——四處全是表面或自表面起始的缺陷</text></svg>