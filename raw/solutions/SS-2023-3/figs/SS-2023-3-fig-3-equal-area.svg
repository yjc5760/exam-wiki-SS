r="end" dominant-baseline="middle" font-weight="700">頂翼板 250</text><line x1="244.20" y1="443.00" x2="267.80" y2="443.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="244.20" y1="188.00" x2="267.80" y2="188.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="264.20" y1="443.00" x2="264.20" y2="188.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="264.20,443.00 267.40,435.00 261.00,435.00" fill="#8A94A6"/><polygon points="264.20,188.00 261.00,196.00 267.40,196.00" fill="#8A94A6"/><text x="278.20" y="315.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">75</text><text x="235.00" y="484.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">以下：150 + 150 = 300 cm²</text><text x="235.00" y="508.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">以上：50 + 250 = 300 cm²</text><text x="235.00" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">PNA 距底緣 = 5 + 75 = 80 cm</text></g><g transform="translate(470,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="458" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="235.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">② Z 的四項組成</text><text x="150.54" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Z = Σ A<tspan dy="3.75" font-size="8.5">i</tspan><tspan dy="-3.75" font-size="12.5"> × |形心至 PNA 的距離|</tspan></text><text x="28.00" y="107.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">底翼板</text><text x="28.00" y="128.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A = 150 cm²　d = 77.5 cm</text><rect x="214.0" y="101" width="176.0" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="214.0" y="101" width="176.0" height="30" rx="6" fill="#C0392B" stroke="none" stroke-width="1"/><text x="402.00" y="116.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">11,625</text><text x="28.00" y="169.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">腹板下段（75×2）</text><text x="28.00" y="190.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A = 150 cm²　d = 37.5 cm</text><rect x="214.0" y="163" width="176.0" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="214.0" y="163" width="85.16129032258064" height="30" rx="6" fill="#C0392B" stroke="none" stroke-width="1"/><text x="402.00" y="178.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">5,625</text><text x="28.00" y="231.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">腹板上段（25×2）</text><text x="28.00" y="252.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A = 50 cm²　d = 12.5 cm</text><rect x="214.0" y="225" width="176.0" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="214.0" y="225" width="9.46236559139785" height="30" rx="6" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="402.00" y="240.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">625</text><text x="28.00" y="293.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">頂翼板</text><text x="28.00" y="314.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">A = 250 cm²　d = 27.5 cm</text><rect x="214.0" y="287" width="176.0" height="30" rx="6" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="214.0" y="287" width="104.08602150537635" height="30" rx="6" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="402.00" y="302.00" font-family="'Latin Modern Math','Cambria Math','Times New 