<svg xmlns="http://www.w3.org/2000/svg" width="940" height="682" viewBox="0 0 940 682"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="470" height="560"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="470" height="560"/></clipPath></defs><rect width="940" height="682" fill="#FFFFFF"/><text x="470.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">腹板一定要在 PNA 處拆成兩段——這是 Z 算錯的頭號原因</text><text x="470.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">由底往上累加：底翼板 150 cm² 不足 300，還差 150 cm² ⇒ 進入腹板 150/2 = 75 cm，PNA 落在腹板內</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="458" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="235.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 等面積法：由底往上累加到 A/2</text><text x="235.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">腹板必須在 PNA 處切開</text><polygon points="149.00,460.00 251.00,460.00 251.00,443.00 149.00,443.00" fill="rgba(192,57,43,0.18)" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><polygon points="196.60,443.00 203.40,443.00 203.40,188.00 196.60,188.00" fill="rgba(192,57,43,0.18)" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><polygon points="196.60,188.00 203.40,188.00 203.40,103.00 196.60,103.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><polygon points="115.00,103.00 285.00,103.00 285.00,86.00 115.00,86.00" fill="rgba(2