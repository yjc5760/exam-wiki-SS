xt-anchor="middle" dominant-baseline="middle" font-weight="700">φTn = 117.0 t，作為（二）銲道設計力</text></g><text x="520.0" y="580" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">U 取 1.0（忘了剪力遲滯）會得 171.6 t，高估約 47%；x̄ 若量到管中心（= 0）也是同樣錯誤</text></svg>