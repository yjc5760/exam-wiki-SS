="13"> = 1.5</tspan></text><line x1="296.03" y1="295.56" x2="346.83" y2="295.56" stroke="#8A94A6" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><text x="352.83" y="295.56" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#8A94A6" text-anchor="start" dominant-baseline="middle" font-weight="400">t<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> = 1.5</tspan></text><polygon points="296.03,249.67 389.44,249.67 389.44,239.83 296.03,239.83" fill="rgba(180,83,9,0.22)" stroke="none" stroke-width="1" opacity="1.0"/><line x1="342.74" y1="239.83" x2="368.96" y2="171.00" stroke="#B45309" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><text x="373.96" y="171.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">懸臂長 b<tspan dy="3.60" font-size="8.16">f</tspan><tspan dy="-3.60" font-size="12">/2 = 15（λ</tspan><tspan dy="3.60" font-size="8.16">f</tspan><tspan dy="-3.60" font-size="12"> 分母）</tspan></text><text x="221.77" y="560.83" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">全深 d = h<tspan dy="3.90" font-size="8.84">w</tspan><tspan dy="-3.90" font-size="13"> + 2t</tspan><tspan dy="3.90" font-size="8.84">f</tspan><tspan dy="-3.90" font-size="13"> = 45 cm</tspan></text><rect x="570" y="96" width="334" height="232" rx="12" fill="#EEF4FF" stroke="#C7D9F5" stroke-width="1.3"/><text x="737.00" y="124.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">翼板（懸臂板）寬厚比</text><text x="588.00" y="154.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">λ<tspan dy="4.05" font-size="9.18">f</tspan><tspan dy="-4.05" font-size="13.5"> = b</tspan><tspan dy="4.05" font-size="9.18">f</tspan><tspan dy="-4.05" font-size="13.5">/(2t</tspan><tspan dy="4.05" font-size="9.18">f</tspan><tspan dy="-4.05" font-size="13.5">) = 30/3 = 10.00</tspan></text><text x="588.00" y="178.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">λ<tspan dy="4.05" font-size="9.18">pf</tspan><tspan dy="-4.05" font-size="13.5"> = 17/F</tspan><tspan dy="4.05" font-size="9.18">y</tspan><tspan dy="-9.45" font-size="9.18">1/2</tspan><tspan dy="5.40" font-size="13.5"> = 17/2.5</tspan><tspan dy="-5.40" font-size="9.18">1/2</tspan><tspan dy="5.40" font-size="13.5"> = 10.75</tspan></text><text x="588.00" y="206.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#15803D" text-anchor="start" dominant-baseline="middle" font-weight="700">λ<tspan dy="4.20" font-size="9.52">f</tspan><tspan dy="-4.20" font-size="14"> ＜ λ</tspan><tspan dy="4.20" font-size="9.52">p</tspan><tspan dy="-4.20" font-size="14">f → ✓ 結實（compact）</tspan></text><text x="737.00" y="244.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">腹板（加勁元素）寬厚比</text><text x="588.00" y="274.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">λ<tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = h</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5">/t</tspan><tspan dy="4.05" font-size="9.18">w</tspan><tspan dy="-4.05" font-size="13.5"> = 42/1.5 = 28.00</tspan></text><text x="588.00" y="298.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="13.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">λ<tspan dy="4.05" font-size="9.18">pw</tspan><tspan dy="-4.05" font-size="13.5"> = 170/F</tspan><tspan dy="4.05" font-size="9.18">y</tspan><tspan dy="-9.45" font-size="9.18">1/2</tspan><tspan dy="5.40" font-size="13.5"> = 170/2.5</tspan><tspan dy="-5.40" font-size="9.18">1/2</tspan><tspan dy="5.40" font-size="13.5"> = 107.52</tspan></text><text x="588.00" y="326.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#15803D" text-anchor="start" dominant-baseline="middle" font-weight="700">λ<tspan dy="4.20" font-size="9.52">w</tspan><tspan dy="-4.20" font-size="14"> ＜ λ</tspan><tspan dy="4.20" font-size="9.52">p</tspan><tspan dy="-4.20" font-size="14">w → ✓ 結實（compact）</tspan></text><rect x="570" y="346" width="334" height="92" rx="12" fill="#FFF6F1" stroke="#F0C9B8" stroke-width="1.3"/><text x="588.00" y="370.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">翼板、腹板皆結實 → 全斷面結實</text><text x="588.00" y="392.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">＋完全側向支撐（L<tspan dy="3.90" font-size="8.84">b</tspan><tspan dy="-3.90" font-size="13"> = 0 ＜ L</tspan><tspan dy="3.90" font-size="8.84">p</tspan><tspan dy="-3.90" font-size="13">）</tspan></text><text x="588.00" y="414.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#9A3412" text-anchor="start" dominant-baseline="middle" font-weight="700">→ M<tspan dy="3.90" font-size="8.84">n</tspan><tspan dy="-3.90" font-size="13"> = M</tspan><tspan dy="3.90" font-size="8.84">p</tspan><tspan dy="-3.90" font-size="13">（見圖 2）</tspan></text></svg>