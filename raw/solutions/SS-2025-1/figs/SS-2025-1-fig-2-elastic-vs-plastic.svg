<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="702" viewBox="0 0 1120 702"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="560" height="580"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="560" height="580"/></clipPath></defs><rect width="1120" height="702" fill="#FFFFFF"/><text x="560.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">陷阱1：結實斷面＋完全側向支撐時，設計強度用 Z_x（塑性）而非 S_x（彈性）</text><text x="560.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">F_y = 2.5 tf/cm² 兩圖同一應力比例尺；矩形分布的寬度差異＝翼板／腹板貢獻各自獨立計算</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect width="560" height="580" fill="#FFFFFF"/><rect x="6" y="6" width="548" height="568" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">彈性分布（首達降伏）</text><text x="280.00" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">× 本題不適用（結實斷面＋完全支撐已達全塑性）</text><line x1="172.0" y1="82" x2="190.0" y2="82" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="198.00" y="82.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">壓應力，邊緣峰值 = F<tspan dy="3.45" font-size="7.82">y</tspan><tspan dy="-3.45" font-size="11.5">（中性軸為 0）</tspan></text><line x1="172.0" y1="99" x2="190.0" y2="99" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="198.00" y="99.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">拉應力，同上</text><polygon points="52.50,187.25 234.64,187.25 234.64,196.36 148.12,196.36 148.12,451.36 234.64,451.36 234.64,460.46 52.50,460.46 52.50,451.36 139.02,451.36 139.02,196.36 52.50,196.36" fill="#EEF1F5" stroke="#3F4A5A" stroke-width="2.4" opacity="1.0"/><polygon points="148.12,196.36 154.80,196.36 148.12,203.04" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="139.02,196.36 132.34,196.36 139.02,203.04" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="148.12,451.36 154.80,451.36 148.12,444.68" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="139.02,451.36 132.34,451.36 139.02,444.68" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><line x1="40.36" y1="323.86" x2="350.00" y2="323.86" stroke="#8A94A6" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><text x="34.36" y="323.86" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">N.A.</text><line x1="271.07" y1="481.71" x2="271.07" y2="166.00" stroke="#8A94A6" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><polygon points="271.07,323.86 350.00,187.25 271.07,187.25" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="1.8" opacity="1.0"/><polygon points="271.07,323.86 350.00,460.46 271.07,460.46" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.8" opacity="1.0"/><line x1="271.07" y1="323.86" x2="350.00" y2="187.25" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" opacity="1.0"/><line x1="271.07" y1="323.86" x2="350.00" y2="460.46" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" opacity="1.0"/><text x="242.95" y="534.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">M<tspan dy="4.65" font-size="10.54">y</tspan><tspan dy="-4.65" font-size="15.5"> = F</tspan><tspan dy="4.65" font-size="10.54">y</tspan><tspan dy="-4.65" font-size="15.5"> · S</tspan><tspan dy="4.65" font-size="10.54">x</tspan></text><text x="280.00" y="558.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">腹板大部分仍在彈性範圍，未充分利用強度</text></g><g transform="translate(560,76)" clip-path="url(#sdclip1)"><rect width="560" height="580" fill="#FFFFFF"/><rect x="6" y="6" width="548" height="568" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="280.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">塑性分布（全斷面降伏）</text><text x="226.08" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#15803D" text-anchor="start" dominant-baseline="middle" font-weight="700">✓ 本題適用：M<tspan dy="3.75" font-size="8.5">n</tspan><tspan dy="-3.75" font-size="12.5"> = M</tspan><tspan dy="3.75" font-size="8.5">p</tspan></text><line x1="172.0" y1="82" x2="190.0" y2="82" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/><text x="198.00" y="82.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">壓應力，全斷面 = F<tspan dy="3.45" font-size="7.82">y</tspan><tspan dy="-3.45" font-size="11.5">（均勻）</tspan></text><line x1="172.0" y1="99" x2="190.0" y2="99" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><text x="198.00" y="99.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">拉應力，同上</text><polygon points="52.50,187.25 234.64,187.25 234.64,196.36 148.12,196.36 148.12,451.36 234.64,451.36 234.64,460.46 52.50,460.46 52.50,451.36 139.02,451.36 139.02,196.36 52.50,196.36" fill="none" stroke="#3F4A5A" stroke-width="2.4" opacity="1.0"/><polygon points="148.12,196.36 154.80,196.36 148.12,203.04" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="139.02,196.36 132.34,196.36 139.02,203.04" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="148.12,451.36 154.80,451.36 148.12,444.68" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="139.02,451.36 132.34,451.36 139.02,444.68" fill="#3F4A5A" stroke="none" stroke-width="1" opacity="1.0"/><line x1="40.36" y1="323.86" x2="350.00" y2="323.86" stroke="#8A94A6" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><text x="34.36" y="323.86" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">N.A.</text><line x1="271.07" y1="481.71" x2="271.07" y2="166.00" stroke="#8A94A6" stroke-width="1.2" stroke-linecap="round" opacity="1.0"/><polygon points="271.07,323.86 350.00,323.86 350.00,187.25 271.07,187.25" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="1.8" opacity="1.0"/><polygon points="271.07,323.86 350.00,323.86 350.00,460.46 271.07,460.46" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.8" opacity="1.0"/><line x1="271.07" y1="191.80" x2="380.36" y2="191.80" stroke="#B45309" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><circle cx="271.07" cy="191.80" r="3.6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="366.00" y="191.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">z<tspan dy="3.30" font-size="7.48">f</tspan><tspan dy="-3.30" font-size="11"> = h</tspan><tspan dy="3.30" font-size="7.48">w</tspan><tspan dy="-3.30" font-size="11">/2+t</tspan><tspan dy="3.30" font-size="7.48">f</tspan><tspan dy="-3.30" font-size="11">/2 = 21.75</tspan></text><line x1="271.07" y1="260.11" x2="380.36" y2="260.11" stroke="#B45309" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3" opacity="1.0"/><circle cx="271.07" cy="260.11" r="3.6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="366.00" y="260.11" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">z<tspan dy="3.30" font-size="7.48">w</tspan><tspan dy="-3.30" font-size="11"> = h</tspan><tspan dy="3.30" font-size="7.48">w</tspan><tspan dy="-3.30" font-size="11">/4 = 10.5</tspan></text><text x="242.95" y="512.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">M<tspan dy="4.65" font-size="10.54">p</tspan><tspan dy="-4.65" font-size="15.5"> = F</tspan><tspan dy="4.65" font-size="10.54">y</tspan><tspan dy="-4.65" font-size="15.5"> · Z</tspan><tspan dy="4.65" font-size="10.54">x</tspan></text><text x="211.61" y="534.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Z<tspan dy="3.30" font-size="7.48">x</tspan><tspan dy="-3.30" font-size="11"> = 2b</tspan><tspan dy="3.30" font-size="7.48">f</tspan><tspan dy="-3.30" font-size="11">t</tspan><tspan dy="3.30" font-size="7.48">f</tspan><tspan dy="-3.30" font-size="11">·z</tspan><tspan dy="3.30" font-size="7.48">f</tspan><tspan dy="-3.30" font-size="11"> + 2(h</tspan><tspan dy="3.30" font-size="7.48">w</tspan><tspan dy="-3.30" font-size="11">/2)t</tspan><tspan dy="3.30" font-size="7.48">w</tspan><tspan dy="-3.30" font-size="11">·z</tspan><tspan dy="3.30" font-size="7.48">w</tspan></text><text x="280.00" y="554.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="700">= 1957.5 + 661.5 = 2619 cm³</text><text x="280.00" y="574.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">翼板貢獻與腹板貢獻分開計算，兩者都要算</text></g><text x="560.0" y="680" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">φ_bM_n = 0.9 × F_y × Z_x = 0.9 × 2.5 × 2619 = 5,892.75 tf·cm ≈ 58.9 tf·m</text></svg>