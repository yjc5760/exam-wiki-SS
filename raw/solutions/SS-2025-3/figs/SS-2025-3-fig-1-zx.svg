<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="642" viewBox="0 0 1000 642"><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1000" height="520"/></clipPath></defs><rect width="1000" height="642" fill="#FFFFFF"/><text x="500.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">圖 1　Zx = 4,867.2 + 1,381.6 = 6,248.8 cm³；Mp = 218.7、Mr = 157.6 tf·m</text><text x="500.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">翼板力臂量到翼板形心（hw/2 + tf/2），腹板半高的力臂是 hw/4</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="988" height="508" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="500.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">Zx = Σ(面積 × 至塑性中性軸距離)：翼板 ＋ 腹板</text><text x="500.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">對稱 H 型：塑性中性軸在腹板中點；全斷面拉壓各達 Fy</text><polygon points="135.00,105.00 285.00,105.00 285.00,117.00 135.00,117.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><polygon points="135.00,455.00 285.00,455.00 285.00,443.00 135.00,443.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><polygon points="206.75,443.00 213.25,443.00 213.25,117.00 206.75,117.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.4" opacity="1.0"/><line x1="115.00" y1="280.00" x2="305.00" y2="280.00" stroke="#B45309" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="8 3 2 3" opacity="1.0"/><text x="311.00" y="280.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">PNA</text><polygon points="355.00,280.00 415.00,280.00 415.00,105.00 355.00,105.00" fill="rgba(29,78,216,0.25)" stroke="#1D4ED8" stroke-width="1.6" opacity="1.0"/><polygon points="355.00,280.00 354.95,280.00 354.95,455.00 355.00,455.00" fill="none" stroke="none" stroke-width="1" opacity="1.0"/><polygon points="355.00,280.00 415.00,280.00 415.00,455.00 355.00,455.00" fill="rgba(124,58,237,0.25)" stroke="#7C3AED" stroke-width="1.6" opacity="1.0"/><text x="385.00" y="95.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">Fy（壓）</text><text x="385.00" y="473.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#7C3AED" text-anchor="middle" dominant-baseline="middle" font-weight="700">Fy（拉）</text><line x1="95.00" y1="280.00" x2="95.00" y2="280.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="95.00" y1="111.00" x2="95.00" y2="111.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="95.00" y1="280.00" x2="95.00" y2="111.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="95.00,280.00 98.20,272.00 91.80,272.00" fill="#8A94A6"/><polygon points="95.00,111.00 91.80,119.00 98.20,119.00" fill="#8A94A6"/><text x="73.00" y="195.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">33.8</text><line x1="180.00" y1="280.00" x2="180.00" y2="280.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="180.00" y1="198.50" x2="180.00" y2="198.50" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="180.00" y1="280.00" x2="180.00" y2="198.50" stroke="#8A94A6" stroke-width="1.2"/><polygon points="180.00,280.00 183.20,272.00 176.80,272.00" fill="#8A94A6"/><polygon points="180.00,198.50 176.80,206.50 183.20,206.50" fill="#8A94A6"/><text x="162.00" y="239.25" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">16.3</text><text x="520.00" y="130.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">翼板：2 × (30 × 2.4) × 33.8 = 4,867.2</text><text x="520.00" y="162.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">腹板：2 × (32.6 × 1.3) × 16.3 = 1,381.6</text><text x="520.00" y="194.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">Zx = 6,248.8 cm³</text><text x="520.00" y="258.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">Sx = Ix / (d/2) = 197,000 / 35 = 5,628.6 cm³</text><text x="520.00" y="290.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">Zx 大於 Sx：塑性比彈性多用到腹板與翼板內側</text><text x="520.00" y="354.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">Mp = Fy·Zx = 21,871 tf·cm ≈ 218.7 tf·m</text><text x="520.00" y="386.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">Mr = (Fy − Fr)·Sx = 15,760 tf·cm ≈ 157.6 tf·m</text></g><text x="500.0" y="620" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">用 Sx 算 Mp、或 Mr 漏扣殘留應力（取 FySx），都會把「塑性」與「彈性」彎矩混在一起</text></svg>