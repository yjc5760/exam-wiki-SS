<svg xmlns="http://www.w3.org/2000/svg" width="920" height="682" viewBox="0 0 920 682" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="460" height="560"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="460" height="560"/></clipPath></defs><rect width="920" height="682" fill="#FFFFFF"/><text x="460.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">剪力遲滯 U：不是所有斷面都來得及出力</text><text x="460.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">力從被連接的那一肢橫向擴散到突出肢，需要長度</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="448" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="230.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">偏心距 x̄：形心離連接面多遠</text><text x="230.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">只有一肢被連接 → 力偏心傳遞</text><polygon points="95.00,450.00 395.00,450.00 395.00,420.00 125.00,420.00 125.00,150.00 95.00,150.00" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="2.4" opacity="1.0"/><line x1="95.00" y1="450.00" x2="395.00" y2="450.00" stroke="#C0392B" stroke-width="4.5" stroke-linecap="round" opacity="1.0"/><circle cx="161.00" cy="435.00" r="16.50" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><circle cx="245.00" cy="435.00" r="16.50" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><circle cx="329.00" cy="435.00" r="16.50" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.6" opacity="1.0"/><text x="245.00" y="474.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">連接肢（被螺栓抓住）</text><text x="139.00" y="234.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">突出肢（沒有被連接）</text><circle cx="181.05" cy="363.95" r="6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.6"/><text x="193.05" y="349.95" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="400">形心</text><line x1="95.00" y1="363.95" x2="181.05" y2="363.95" stroke="#B45309" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="281.00" y1="450.00" x2="281.00" y2="450.00" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="281.00" y1="363.95" x2="281.00" y2="363.95" stroke="#B45309" stroke-width="1" stroke-dasharray="3 3"/><line x1="281.00" y1="450.00" x2="281.00" y2="363.95" stroke="#B45309" stroke-width="1.2"/><polygon points="281.00,450.00 284.20,442.00 277.80,442.00" fill="#B45309"/><polygon points="281.00,363.95 277.80,371.95 284.20,371.95" fill="#B45309"/><text x="297.00" y="406.97" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">x̄</text><text x="230.00" y="498.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">L100×100×10 → x̄ = 2.87 cm</text><text x="230.00" y="522.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">x̄ 由斷面幾何算出，不是查來的</text></g><g transform="translate(460,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="448" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="230.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">連接長度 L：力需要距離才能轉彎</text><text x="230.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">L 越長，突出肢越來得及出力</text><polygon points="40.00,370.00 380.00,370.00 380.00,346.20 40.00,346.20" fill="rgba(192,57,43,0.18)" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><polygon points="40.00,346.20 380.00,346.20 380.00,183.00 40.00,183.00" fill="#FFFFFF" stroke="#8A94A6" stroke-width="1.8" opacity="1.0"/><circle cx="82.50" cy="358.10" r="14.45" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="210.00" cy="358.10" r="14.45" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><circle cx="337.50" cy="358.10" r="14.45" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><line x1="82.50" y1="378.50" x2="82.50" y2="406.82" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="337.50" y1="378.50" x2="337.50" y2="406.82" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="82.50" y1="402.50" x2="337.50" y2="402.50" stroke="#8A94A6" stroke-width="1.2"/><polygon points="82.50,402.50 90.50,405.70 90.50,399.30" fill="#8A94A6"/><polygon points="337.50,402.50 329.50,399.30 329.50,405.70" fill="#8A94A6"/><text x="210.00" y="417.50" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">L = 15.0 cm</text><line x1="82.50" y1="346.20" x2="245.70" y2="183.00" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="210.00" y1="346.20" x2="373.20" y2="183.00" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><line x1="337.50" y1="346.20" x2="380.00" y2="303.70" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="1.0"/><polygon points="40.00,346.20 82.50,346.20 245.70,183.00 40.00,183.00" fill="rgba(29,78,216,0.18)" stroke="none" stroke-width="1" opacity="1.0"/><text x="50.20" y="223.80" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">這塊來不及出力</text><text x="369.80" y="201.70" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">突出肢（立面）</text><text x="145.40" y="358.10" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">連接肢</text><line x1="390.20" y1="358.10" x2="417.60" y2="358.10" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="427.60,358.10 417.60,362.70 417.60,353.50" fill="#C0392B"/><text x="433.60" y="358.10" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">P</text><text x="230.00" y="452.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">U = 1 - x̄/L = 1 - 2.87/15.0 = 0.809</text><text x="230.00" y="482.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="400">同一支角鋼，只用 2 支螺栓（L = 7.5 cm）→ U = 0.618</text><text x="230.00" y="508.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">螺栓少一支，有效斷面掉兩成</text></g><text x="460.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">陷阱：銲接接合不用扣孔（An = Ag），但只要不是全斷面被銲住，照樣要乘 U</text></svg>