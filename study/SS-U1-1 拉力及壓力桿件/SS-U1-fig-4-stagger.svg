<svg xmlns="http://www.w3.org/2000/svg" width="920" height="630" viewBox="0 0 920 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text x="460.00" y="34.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="18" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">交錯螺栓孔：破壞路徑不只一條，取淨寬最小者</text><text x="252.30" y="58.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">板寬 30 cm × 厚 1 cm，螺栓 d<tspan dy="3.90" font-size="8.84">b</tspan><tspan dy="-3.90" font-size="13"> = 2 cm（扣除 2.3 cm），s = 6 cm，g = 8 cm</tspan></text><polygon points="48.00,520.00 480.00,520.00 480.00,160.00 48.00,160.00" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.2" opacity="1.0"/><line x1="48.00" y1="380.00" x2="48.00" y2="300.00" stroke="#8A94A6" stroke-width="3.2" stroke-linecap="round"/><line x1="48.00" y1="377.21" x2="56.00" y2="384.21" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round"/><line x1="48.00" y1="358.60" x2="56.00" y2="365.60" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round"/><line x1="48.00" y1="340.00" x2="56.00" y2="347.00" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round"/><line x1="48.00" y1="321.40" x2="56.00" y2="328.40" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round"/><line x1="48.00" y1="302.79" x2="56.00" y2="309.79" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round"/><line x1="498.00" y1="340.00" x2="529.00" y2="340.00" stroke="#C0392B" stroke-width="3.4" stroke-linecap="round"/><polygon points="540.00,340.00 529.00,345.06 529.00,334.94" fill="#C0392B"/><text x="548.00" y="340.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">P</text><circle cx="276.00" cy="424.00" r="12.00" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><circle cx="348.00" cy="328.00" r="12.00" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><circle cx="276.00" cy="232.00" r="12.00" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.0" opacity="1.0"/><polyline points="276.00,520.00 276.00,424.00 348.00,328.00 276.00,232.00 276.00,160.00" fill="none" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/><polyline points="276.00,520.00 276.00,160.00" fill="none" stroke="#1D4ED8" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5" opacity="1.0"/><text x="276.00" y="144.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">路徑 A</text><text x="362.00" y="328.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">路徑 B</text><line x1="276.00" y1="424.00" x2="276.00" y2="459.40" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="348.00" y1="424.00" x2="348.00" y2="459.40" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="276.00" y1="454.00" x2="348.00" y2="454.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="276.00,454.00 284.00,457.20 284.00,450.80" fill="#8A94A6"/><polygon points="348.00,454.00 340.00,450.80 340.00,457.20" fill="#8A94A6"/><text x="312.00" y="468.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">s = 6</text><line x1="348.00" y1="424.00" x2="388.12" y2="424.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="348.00" y1="328.00" x2="388.12" y2="328.00" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="382.00" y1="424.00" x2="382.00" y2="328.00" stroke="#8A94A6" stroke-width="1.2"/><polygon points="382.00,424.00 385.20,416.00 378.80,416.00" fill="#8A94A6"/><polygon points="382.00,328.00 378.80,336.00 385.20,336.00" fill="#8A94A6"/><text x="397.00" y="376.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">g = 8</text><rect x="570" y="150" width="340" height="300" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="592.00" y="182.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700">路徑 A（直線，穿 2 孔）</text><text x="592.00" y="212.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">w<tspan dy="4.65" font-size="10.54">n</tspan><tspan dy="-4.65" font-size="15.5"> = 30 - 2(2.3) = 25.40 cm</tspan></text><text x="592.00" y="258.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">路徑 B（折線，穿 3 孔，加回 2 段）</text><text x="592.00" y="288.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">w<tspan dy="4.65" font-size="10.54">n</tspan><tspan dy="-4.65" font-size="15.5"> = 30 - 3(2.3) + 2·s</tspan><tspan dy="-6.20" font-size="10.54">2</tspan><tspan dy="6.20" font-size="15.5">/4g</tspan></text><text x="592.00" y="316.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">  = 30 - 6.9 + 2(1.125) = 25.35 cm</text><line x1="120.00" y1="520.00" x2="120.00" y2="520.00" stroke="#E1E6ED" stroke-width="0" stroke-linecap="round" opacity="1.0"/><text x="592.00" y="362.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">取最小 → 路徑 B 控制</text><text x="592.00" y="392.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">A<tspan dy="4.80" font-size="10.88">n</tspan><tspan dy="-4.80" font-size="16"> = 25.35 × 1.0 = 25.35 cm</tspan><tspan dy="-6.40" font-size="10.88">2</tspan></text><text x="592.00" y="424.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">兩條只差 0.05 cm，目測猜不出來</text><text x="460.00" y="598.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩條路徑在最上與最下段重合；s²/4g 是折線多繞的路所「賺回」的寬度，s 越大、g 越小賺得越多</text></svg>