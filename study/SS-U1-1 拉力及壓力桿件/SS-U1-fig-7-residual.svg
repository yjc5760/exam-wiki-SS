-weight="700">外加壓應力</text><rect x="70" y="144" width="320" height="30" rx="7" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="70" y="144" width="224.0" height="30" rx="7" fill="#1D4ED8" stroke="none" stroke-width="1"/><text x="400.00" y="159.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1D4ED8" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">0.7F<tspan dy="4.35" font-size="9.86">y</tspan></text><text x="70.00" y="202.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">既有殘留壓應力</text><rect x="70" y="218" width="320" height="30" rx="7" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="70" y="218" width="96.0" height="30" rx="7" fill="#C0392B" stroke="none" stroke-width="1"/><text x="400.00" y="233.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">0.3F<tspan dy="4.35" font-size="9.86">y</tspan></text><text x="70.00" y="276.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">翼板端合計</text><rect x="70" y="292" width="320" height="30" rx="7" fill="#EDF1F6" stroke="none" stroke-width="1"/><rect x="70" y="292" width="320.0" height="30" rx="7" fill="#B45309" stroke="none" stroke-width="1"/><text x="400.00" y="307.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">1.0F<tspan dy="4.35" font-size="9.86">y</tspan></text><rect x="389" y="126" width="2" height="200" rx="0" fill="#B45309" stroke="none" stroke-width="1"/><text x="390.00" y="114.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">降伏</text><text x="149.58" y="404.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">0.7F<tspan dy="5.10" font-size="11.56">y</tspan><tspan dy="-5.10" font-size="17"> + 0.3F</tspan><tspan dy="5.10" font-size="11.56">y</tspan><tspan dy="-5.10" font-size="17"> = 1.0F</tspan><tspan dy="5.10" font-size="11.56">y</tspan></text><text x="230.00" y="440.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">比例限只到 0.7Fy：超過後最外緣先屈服，</text><text x="230.00" y="462.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">剩下的彈性核心變小 → 勁度 EI 有效值下降</text><text x="230.00" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">這就是 0.658 那支公式存在的理由</text></g><text x="460.0" y="660" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">λc ≤ 1.5 時 Fcr 與 Fy 強相關；λc &gt; 1.5 時 Fcr 只剩 0.877Fe，與 Fy 無關</text></svg>