<svg xmlns="http://www.w3.org/2000/svg" width="920" height="682" viewBox="0 0 920 682" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="460" height="560"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="460" height="560"/></clipPath></defs><rect width="920" height="682" fill="#FFFFFF"/><text x="460.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">為什麼非彈性段不能用 Euler：殘留應力吃掉了三成</text><text x="460.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">0.658^λc² 不是湊出來的係數，它在描述提早降伏後的勁度衰減</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="448" height="548" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="230.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">軋延冷卻後的殘留應力</text><text x="230.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">翼板端先冷卻 → 端部受壓、中央受拉</text><polygon points="145.00,248.70 145.00,230.00 315.00,230.00 315.00,248.70 237.65,248.70 237.65,381.30 315.00,381.30 315.00,400.00 145.00,400.00 145.00,381.30 222.35,381.30 222.35,248.70" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.2" opacity="1.0"/><polyline points="145.00,213.00 145.00,234.42 149.25,231.29 153.50,228.32 157.75,225.50 162.00,222.85 166.25,220.36 170.50,218.03 174.75,215.86 179.00,213.86 183.25,212.01 187.50,210.32 191.75,208.80 196.00,207.43 200.25,206.23 204.50,205.18 