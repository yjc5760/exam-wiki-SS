<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">弱軸彎曲為什麼沒有 LTB？</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">受壓區要挫屈，必須往「更強」的方向去 — 它去不動</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <rect x="22" y="106" width="420" height="308" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <rect x="22" y="106" width="420" height="32" rx="8" fill="#C0392B"/>
  <rect x="22" y="130" width="420" height="8" fill="#C0392B"/>
  <text x="232" y="128" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">強軸彎曲（繞 x 軸）</text>
  <rect x="65.0" y="182.0" width="150" height="18" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="133.5" y="200.0" width="13" height="144" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="65.0" y="344.0" width="150" height="18" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <rect x="65.0" y="182.0" width="150" height="18" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
  <rect x="65.0" y="344.0" width="150" height="18" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  <line x1="41.0" y1="272" x2="239.0" y2="272" stroke="#5C7A99" stroke-width="1.4" stroke-dasharray="12 4 3 4"/>
  <text x="243.0" y="277" font-size="13" font-weight="700" fill="#5C7A99">x</text>
  <line x1="140" y1="160.0" x2="236" y2="160.0" stroke="#E8734A" stroke-width="2.6" marker-end="url(#arO)"/>
  <text x="190" y="152.0" font-size="12" font-weight="700" fill="#E8734A" text-anchor="middle">側移</text>
  <text x="262" y="232" font-size="13" font-weight="700" fill="#1B2A41">受壓翼板想往 y 方向側移</text>
  <rect x="254" y="248" width="176" height="74" rx="6" fill="#F4F6F9" stroke="#C0392B" stroke-width="1.6"/>
  <text x="342" y="274" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="middle">結論</text>
  <text x="342" y="298" font-size="12" fill="#1B2A41" text-anchor="middle">側移方向勁度小（I&#8202;y 小）</text>
  <text x="342" y="318" font-size="13" font-weight="700" fill="#C0392B" text-anchor="middle">LTB 會發生</text>
  <text x="232" y="398" font-size="15" font-weight="700" fill="#C0392B" text-anchor="middle">M<tspan font-size='11' dy='4'>n</tspan><tspan dy='-4'> 隨 L</tspan><tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> 三區段變化</tspan></text>
  <rect x="510" y="106" width="420" height="308" rx="8" fill="#FFFFFF" stroke="#1E8449" stroke-width="2"/>
  <rect x="510" y="106" width="420" height="32" rx="8" fill="#1E8449"/>
  <rect x="510" y="130" width="420" height="8" fill="#1E8449"/>
  <text x="720" y="128" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">弱軸彎曲（繞 y 軸）</text>
  <rect x="538.0" y="197.0" width="18" height="150" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
  <rect x="700.0" y="197.0" width="18" height="150" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  <rect x="556.0" y="265.5" width="144" height="13" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="628" y1="171.0" x2="628" y2="373.0" stroke="#5C7A99" stroke-width="1.4" stroke-dasharray="12 4 3 4"/>
  <text x="636" y="167.0" font-size="13" font-weight="700" fill="#5C7A99">y</text>
  <text x="547.0" y="369.0" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="middle">受壓</text>
  <text x="709.0" y="369.0" font-size="11.5" font-weight="700" fill="#2E6DA4" text-anchor="middle">受拉</text>
  <line x1="547.0" y1="189.0" x2="547.0" y2="147.0" stroke="#9FB3C8" stroke-width="2.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <g stroke="#C0392B" stroke-width="3.4"><line x1="537.0" y1="167.0" x2="557.0" y2="187.0"/><line x1="537.0" y1="187.0" x2="557.0" y2="167.0"/></g>
  <rect x="563.0" y="165.0" width="60" height="20" fill="#FFFFFF"/>
  <text x="565.0" y="180.0" font-size="12.5" font-weight="700" fill="#C0392B">挫不動</text>
  <text x="750" y="232" font-size="13" font-weight="700" fill="#1B2A41">受壓區想往 x 方向側移</text>
  <rect x="742" y="248" width="176" height="74" rx="6" fill="#F4F6F9" stroke="#1E8449" stroke-width="1.6"/>
  <text x="830" y="274" font-size="12.5" font-weight="700" fill="#1E8449" text-anchor="middle">結論</text>
  <text x="830" y="298" font-size="12" fill="#1B2A41" text-anchor="middle">側移方向勁度大（I&#8202;x 大）</text>
  <text x="830" y="318" font-size="13" font-weight="700" fill="#1E8449" text-anchor="middle">挫不動</text>
  <text x="720" y="398" font-size="15" font-weight="700" fill="#1E8449" text-anchor="middle">M<tspan font-size='11' dy='4'>n</tspan><tspan dy='-4'> 與 L</tspan><tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> 完全無關</tspan></text>
  <rect x="34" y="432" width="912" height="150" rx="8" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.5"/>
  <text x="56" y="462" font-size="14.5" font-weight="700" fill="#4C6B8A">弱軸雖然免檢 LTB，卻另外有一個「矩形形狀因子」上限</text>
  <text x="56" y="510" font-size="24" font-weight="700" fill="#1B2A41">M<tspan font-size="16" dy="6">ny</tspan><tspan dy="-6"> = min ( F</tspan><tspan font-size="16" dy="6">y</tspan><tspan dy="-6"> Z</tspan><tspan font-size="16" dy="6">y</tspan><tspan dy="-6"> ,　1.5 F</tspan><tspan font-size="16" dy="6">y</tspan><tspan dy="-6"> S</tspan><tspan font-size="16" dy="6">y</tspan><tspan dy="-6"> )</tspan></text>
  <text x="56" y="544" font-size="12.5" fill="#5C7A99">繞弱軸時翼板像兩片「矩形」在抵抗，形狀因子接近 1.5；</text>
  <text x="56" y="566" font-size="12.5" fill="#5C7A99">規範直接用 1.5 F<tspan font-size="10" dy="3">y</tspan><tspan dy="-3">S</tspan><tspan font-size="10" dy="3">y</tspan><tspan dy="-3"> 封頂，避免使用階段變形過大。</tspan></text>
  <text x="640" y="462" font-size="12" font-weight="700" fill="#5C7A99">形狀因子對照</text>
  <text x="640" y="485" font-size="11.5" fill="#1B2A41">H 型強軸 Z/S</text>
  <rect x="748" y="474" width="150" height="15" rx="3" fill="#DCE6F0"/>
  <rect x="748" y="474" width="93" height="15" rx="3" fill="#4C6B8A"/>
  <text x="908" y="486" font-size="11.5" font-weight="700" fill="#4C6B8A">1.12</text>
  <text x="640" y="517" font-size="11.5" fill="#1B2A41">H 型弱軸 Z/S</text>
  <rect x="748" y="506" width="150" height="15" rx="3" fill="#DCE6F0"/>
  <rect x="748" y="506" width="129" height="15" rx="3" fill="#C0392B"/>
  <text x="908" y="518" font-size="11.5" font-weight="700" fill="#C0392B">1.55</text>
  <text x="640" y="549" font-size="11.5" fill="#1B2A41">規範上限</text>
  <rect x="748" y="538" width="150" height="15" rx="3" fill="#DCE6F0"/>
  <rect x="748" y="538" width="125" height="15" rx="3" fill="#1E8449"/>
  <text x="908" y="550" font-size="11.5" font-weight="700" fill="#1E8449">1.50</text>
</svg>
