  <line x1="570" y1="180" x2="570" y2="202" stroke="#E8734A" stroke-width="3"/>
  <rect x="557" y="202" width="26" height="9" rx="2" fill="#E8734A"/>
  <text x="570" y="226" font-size="11.5" font-weight="700" fill="#E8734A" text-anchor="middle">側撐點</text>
  <path d="M890,179 L878,200 L902,200 z" fill="#FFF" stroke="#1B2A41" stroke-width="2"/>
  <rect x="870" y="200" width="40" height="7" fill="url(#grd)" stroke="#5C7A99" stroke-width="1"/>
  <text x="890" y="224" font-size="11.5" font-weight="700" fill="#1B2A41" text-anchor="middle">支承（兼側撐）</text>
  <g stroke="#1B2A41" stroke-width="1.5" marker-end="url(#ar)"><line x1="110" y1="132" x2="110" y2="164"/><line x1="186" y1="132" x2="186" y2="164"/><line x1="262" y1="132" x2="262" y2="164"/><line x1="338" y1="132" x2="338" y2="164"/><line x1="414" y1="132" x2="414" y2="164"/><line x1="490" y1="132" x2="490" y2="164"/><line x1="566" y1="132" x2="566" y2="164"/><line x1="642" y1="132" x2="642" y2="164"/><line x1="718" y1="132" x2="718" y2="164"/><line x1="794" y1="132" x2="794" y2="164"/><line x1="870" y1="132" x2="870" y2="164"/></g>
  <line x1="110" y1="132" x2="870" y2="132" stroke="#1B2A41" stroke-width="1.8"/>
  <text x="60" y="258" font-size="14.5" font-weight="700" fill="#4C6B8A">② 彎矩圖：每段有自己的 L<tspan font-size="11" dy="4">b</tspan><tspan dy="-4">、C</tspan><tspan font-size="11" dy="4">b</tspan><tspan dy="-4"> 與 M</tspan><tspan font-size="11" dy="4">u</tspan></text>
  <line x1="90" y1="272" x2="890" y2="272" stroke="#1B2A41" stroke-width="1.4"/>
  <polygon points="90,272 90.0,272.0 100.0,277.3 110.0,282.5 120.0,287.6 130.0,292.5 140.0,297.3 150.0,302.0 160.0,306.5 170.0,310.9 180.0,315.1 190.0,319.2 200.0,323.2 210.0,327.1 220.0,330.8 230.0,334.4 240.0,337.8 250.0,341.1 260.0,344.3 270.0,347.3 280.0,350.2 290.0,353.0 300.0,355.6 310.0,358.1 320.0,360.5 330.0,362.7 340.0,364.8 350.0,366.8 360.0,368.6 370.0,370.3 380.0,371.8 390.0,373.2 400.0,374.5 410.0,375.7 420.0,376.7 430.0,377.6 440.0,378.3 450.0,378.9 460.0,379.4 470.0,379.7 480.0,379.9 490.0,380.0 500.0,379.9 510.0,379.7 520.0,379.4 530.0,378.9 540.0,378.3 550.0,377.6 560.0,376.7 570.0,375.7 580.0,374.5 590.0,373.2 600.0,371.8 610.0,370.3 620.0,368.6 630.0,366.8 640.0,364.8 650.0,362.7 660.0,360.5 670.0,358.1 680.0,355.6 690.0,353.0 700.0,350.2 710.0,347.3 720.0,344.3 730.0,341.1 740.0,337.8 750.0,334.4 760.0,330.8 770.0,327.1 780.0,323.2 790.0,319.2 800.0,315.1 810.0,310.9 820.0,306.5 830.0,302.0 840.0,297.3 850.0,292.5 860.0,287.6 870.0,282.5 880.0,277.3 890.0,272.0 890,272" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2.2"/>
