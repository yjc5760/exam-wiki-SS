  <rect x="98" y="412" width="224" height="124" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.8"/>
  <text x="210.0" y="440" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="middle">第 ① 段</text>
  <text x="210.0" y="466" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='10' dy='3'>b1</tspan><tspan dy='-3'> = 3.0 m</tspan>　　C<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> ≈ 1.46</tspan></text>
  <text x="210.0" y="490" font-size="12" fill="#5C7A99" text-anchor="middle">彎矩小、C&#8202;b 大</text>
  <text x="210.0" y="516" font-size="12.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">φ&#8202;b M&#8202;n 與該段 M&#8202;u 比對</text>
  <line x1="210.0" y1="396" x2="210.0" y2="406" stroke="#4C6B8A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="338" y="412" width="224" height="124" rx="7" fill="#FDF0E9" stroke="#C0392B" stroke-width="2.6"/>
  <text x="450.0" y="440" font-size="15" font-weight="700" fill="#C0392B" text-anchor="middle">第 ② 段</text>
  <text x="450.0" y="466" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='10' dy='3'>b2</tspan><tspan dy='-3'> = 2.4 m</tspan>　　C<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> ≈ 1.01</tspan></text>
  <text x="450.0" y="490" font-size="12" fill="#5C7A99" text-anchor="middle">彎矩最大、C&#8202;b 最小</text>
  <text x="450.0" y="516" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="middle">★ 本例由第 ② 段控制</text>
  <line x1="450.0" y1="396" x2="450.0" y2="406" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="578" y="412" width="304" height="124" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="1.8"/>
  <text x="730.0" y="440" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="middle">第 ③ 段</text>
  <text x="730.0" y="466" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='10' dy='3'>b3</tspan><tspan dy='-3'> = 3.2 m</tspan>　　C<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> ≈ 1.52</tspan></text>
  <text x="730.0" y="490" font-size="12" fill="#5C7A99" text-anchor="middle">L&#8202;b 最長但彎矩小</text>
  <text x="730.0" y="516" font-size="12.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">φ&#8202;b M&#8202;n 與該段 M&#8202;u 比對</text>
  <line x1="730.0" y1="396" x2="730.0" y2="406" stroke="#4C6B8A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="34" y="556" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="586" font-size="13.5" fill="#1B2A41">・每一段都要「用該段自己的 C<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'>、L</tspan><tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> 算出 φ</tspan><tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'>M</tspan><tspan font-size='10' dy='3'>n</tspan><tspan dy='-3'>，再跟該段自己的 M</tspan><tspan font-size='10' dy='3'>u</tspan><tspan dy='-3'> 比」，三段都要過。</tspan></text>
  <text x="54" y="612" font-size="13.5" fill="#1B2A41">・L<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> 最長的那段不一定最危險：C</tspan><tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> 的紅利常常把它救回來；反之跨中段 L</tspan><tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> 短但 C</tspan><tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'>≈1 又碰上最大彎矩，往往才是控制段。</tspan></text>
</svg>
