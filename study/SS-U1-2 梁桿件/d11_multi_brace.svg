  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">有多個側撐點時：逐段各算各的，再逐段比對</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">不能用全梁最大彎矩一概而論 — 控制段不一定是彎矩最大的那一段</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <text x="60" y="122" font-size="14.5" font-weight="700" fill="#4C6B8A">① 側撐點把梁切成三段</text>
