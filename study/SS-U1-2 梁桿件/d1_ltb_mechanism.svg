<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/>
    </marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/>
    </marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto">
      <path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/>
    </marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/>
    </marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/>
    </pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/>
    </pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="980" height="690" fill="#FFFFFF"/>

  <!-- ===== header ===== -->
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="40" font-size="20" font-weight="700" fill="#1B2A41">受壓翼板想挫屈　＋　受拉翼板不肯動</text>
  <text x="52" y="63" font-size="17" font-weight="700" fill="#E8734A">＝ 腹板被迫「一邊側移、一邊扭轉」（側扭挫屈 LTB）</text>

  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>

  <!-- ================= PANEL A : 立面圖 ================= -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#4C6B8A">① 立面圖　彎矩把梁分成上壓下拉</text>

  <!-- UDL arrows -->
  <g stroke="#1B2A41" stroke-width="1.6" marker-end="url(#ar)">
    <line x1="80" y1="126" x2="80" y2="150"/>
    <line x1="150" y1="126" x2="150" y2="150"/>
    <line x1="220" y1="126" x2="220" y2="150"/>
    <line x1="290" y1="126" x2="290" y2="150"/>
    <line x1="360" y1="126" x2="360" y2="150"/>
    <line x1="430" y1="126" x2="430" y2="150"/>
    <line x1="500" y1="126" x2="500" y2="150"/>
  </g>
  <line x1="80" y1="126" x2="500" y2="126" stroke="#1B2A41" stroke-width="1.8"/>
  <text x="512" y="133" font-size="13" fill="#1B2A41">w</text>

  <!-- beam elevation -->
  <rect x="70" y="156" width="440" height="18" fill="url(#hatchR)" stroke="#C0392B" stroke-width="1.8"/>
  <rect x="70" y="174" width="440" height="26" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.4"/>
  <rect x="70" y="200" width="440" height="18" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="1.8"/>

  <text x="524" y="169" font-size="13" font-weight="700" fill="#C0392B">上翼板 受壓</text>
  <text x="524" y="192" font-size="12" fill="#5C7A99">腹板（強迫連結）</text>
  <text x="524" y="214" font-size="13" font-weight="700" fill="#2E6DA4">下翼板 受拉</text>

  <!-- supports -->
  <path d="M70,218 L58,238 L82,238 z" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.6"/>
  <path d="M510,218 L498,238 L522,238 z" fill="#FFFFFF" stroke="#1B2A41" stroke-width="1.6"/>
  <rect x="50" y="238" width="40" height="7" fill="url(#grd)" stroke="#5C7A99" stroke-width="1"/>
  <rect x="490" y="238" width="40" height="7" fill="url(#grd)" stroke="#5C7A99" stroke-width="1"/>

  <!-- ================= PANEL B : 平面圖 ================= -->
  <text x="40" y="296" font-size="14" font-weight="700" fill="#4C6B8A">② 平面圖（俯視）　只有上翼板彎得出去</text>

  <!-- brace marks -->
  <g stroke="#5C7A99" stroke-width="1.4">
    <line x1="70" y1="318" x2="70" y2="432"/>
    <line x1="510" y1="318" x2="510" y2="432"/>
  </g>
  <rect x="56" y="318" width="14" height="114" fill="url(#grd)" stroke="#5C7A99" stroke-width="1"/>
  <rect x="510" y="318" width="14" height="114" fill="url(#grd)" stroke="#5C7A99" stroke-width="1"/>
  <text x="46" y="452" font-size="12" fill="#5C7A99">側撐</text>
  <text x="492" y="452" font-size="12" fill="#5C7A99">側撐</text>

  <!-- original straight (dashed) -->
  <line x1="70" y1="375" x2="510" y2="375" stroke="#9FB3C8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="272" y="392" font-size="11.5" fill="#9FB3C8" text-anchor="middle">原直線位置</text>

  <!-- bottom flange: stays straight (tension) -->
  <line x1="70" y1="375" x2="510" y2="375" stroke="#2E6DA4" stroke-width="4"/>
  <text x="524" y="380" font-size="12.5" font-weight="700" fill="#2E6DA4">下翼板：張力自穩，不動</text>

  <!-- top flange: bows sideways (compression) -->
  <path d="M70,375 C 180,313 400,313 510,375" fill="none" stroke="#C0392B" stroke-width="4"/>
  <text x="524" y="330" font-size="12.5" font-weight="700" fill="#C0392B">上翼板：受壓像壓桿，側向彎出</text>

  <!-- u dimension -->
  <line x1="290" y1="329" x2="290" y2="375" stroke="#E8734A" stroke-width="1.6" marker-start="url(#arO)" marker-end="url(#arO)"/>
  <text x="300" y="356" font-size="13" font-weight="700" fill="#E8734A">u</text>

  <!-- Lb dimension -->
  <line x1="70" y1="470" x2="510" y2="470" stroke="#5C7A99" stroke-width="1.3" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <line x1="70" y1="440" x2="70" y2="476" stroke="#5C7A99" stroke-width="0.9"/>
  <line x1="510" y1="440" x2="510" y2="476" stroke="#5C7A99" stroke-width="0.9"/>
  <rect x="212" y="456" width="158" height="24" fill="#FFFFFF"/>
  <text x="290" y="476" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="middle">L<tspan font-size="11" dy="4">b</tspan><tspan dy="-4"> （無側撐長度）</tspan></text>

  <!-- ================= PANEL C : 斷面 ================= -->
  <line x1="600" y1="500" x2="600" y2="112" stroke="#DCE6F0" stroke-width="2"/>
  <text x="622" y="112" font-size="14" font-weight="700" fill="#4C6B8A">③ 斷面　側移 u ＋ 扭轉 θ 必然同時發生</text>

  <!-- original section (dashed) : centered 745,300 -->
  <g stroke="#9FB3C8" stroke-width="1.7" fill="none" stroke-dasharray="6 4">
    <rect x="685" y="228" width="120" height="14"/>
    <rect x="740" y="242" width="10" height="116"/>
    <rect x="685" y="358" width="120" height="14"/>
  </g>
  <text x="745" y="396" font-size="11.5" fill="#9FB3C8" text-anchor="middle">變形前</text>

  <!-- deformed section -->
  <g transform="translate(802,300) rotate(15) translate(-745,-300)">
    <rect x="685" y="228" width="120" height="14" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
    <rect x="740" y="242" width="10" height="116" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.6"/>
    <rect x="685" y="358" width="120" height="14" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  </g>

  <!-- u arrow at top flange -->
  <line x1="745" y1="206" x2="836" y2="206" stroke="#E8734A" stroke-width="2" marker-end="url(#arO)"/>
  <line x1="745" y1="222" x2="745" y2="200" stroke="#9FB3C8" stroke-width="0.9"/>
  <text x="790" y="198" font-size="14" font-weight="700" fill="#E8734A" text-anchor="middle">側移 u</text>

  <!-- theta arc -->
  <path d="M690,424 A 90 90 0 0 1 736,447" fill="none" stroke="#E8734A" stroke-width="2.2" marker-end="url(#arO)"/>
  <text x="676" y="466" font-size="14" font-weight="700" fill="#E8734A">扭轉 θ</text>

  <!-- caption strip -->
  <rect x="34" y="510" width="912" height="64" rx="6" fill="#1B2A41"/>
  <text x="54" y="536" font-size="14.5" font-weight="700" fill="#FFFFFF">本單元所有公式都在回答同一件事：</text>
  <text x="54" y="560" font-size="14.5" font-weight="700" fill="#E8734A">「這根梁有沒有資格把塑性彎矩容量 Mp 用完？」</text>

  <rect x="34" y="588" width="912" height="70" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="614" font-size="13" fill="#1B2A41">・受壓側自己想側移，受拉側被張力拉直不肯動 → 兩者被腹板綁在一起，只能扭著走。</text>
  <text x="54" y="640" font-size="13" fill="#1B2A41">・所以 LTB 的解答一定同時含「側向彎曲勁度 EI<tspan font-size="10" dy="3">y</tspan><tspan dy="-3">」與「扭轉勁度 GJ、翹曲勁度 EC</tspan><tspan font-size="10" dy="3">w</tspan><tspan dy="-3">」兩種抵抗。</tspan></text>
</svg>
