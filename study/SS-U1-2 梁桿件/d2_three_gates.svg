<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">斷面先給本錢，再逐級扣減</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">M&#8202;p 是天花板，三道關卡只會往下打折 — 取最不利者控制</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <text x="40" y="118" font-size="14" font-weight="700" fill="#4C6B8A">① 逐級扣減流水線（彎矩強度）</text>
  <rect x="70" y="150" width="174" height="128" rx="7" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.2"/>
  <rect x="70" y="150" width="174" height="30" rx="7" fill="#1B2A41"/>
  <rect x="70" y="172" width="174" height="8" fill="#1B2A41"/>
  <text x="157" y="171" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">斷面本錢</text>
  <text x="157" y="204" font-size="12.5" fill="#5C7A99" text-anchor="middle">全斷面降伏</text>
  <text x="157" y="230" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">M<tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> = F</tspan><tspan font-size='11' dy='4'>y</tspan><tspan dy='-4'>Z</tspan><tspan font-size='11' dy='4'>x</tspan></text>
  <rect x="90" y="246" width="134" height="16" rx="3" fill="#DCE6F0"/>
  <rect x="90" y="246" width="134" height="16" rx="3" fill="#1B2A41"/>
  <text x="157" y="274" font-size="11" fill="#5C7A99" text-anchor="middle">剩餘容量 100%</text>
  <line x1="248" y1="214" x2="284" y2="214" stroke="#E8734A" stroke-width="3" marker-end="url(#arO)"/>
  <text x="270.0" y="202" font-size="12" font-weight="700" fill="#E8734A" text-anchor="middle">打折</text>
  <rect x="292" y="150" width="174" height="128" rx="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.2"/>
  <rect x="292" y="150" width="174" height="30" rx="7" fill="#C0392B"/>
  <rect x="292" y="172" width="174" height="8" fill="#C0392B"/>
  <text x="379" y="171" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">關卡一　FLB</text>
  <text x="379" y="204" font-size="12.5" fill="#5C7A99" text-anchor="middle">板件會不會先皺？</text>
  <text x="379" y="230" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">λ<tspan font-size='11' dy='4'>f</tspan><tspan dy='-4'> 、 λ</tspan><tspan font-size='11' dy='4'>w</tspan><tspan dy='-4'> vs λ</tspan><tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'>、λ</tspan><tspan font-size='11' dy='4'>r</tspan></text>
  <rect x="312" y="246" width="134" height="16" rx="3" fill="#DCE6F0"/>
  <rect x="312" y="246" width="110" height="16" rx="3" fill="#C0392B"/>
  <text x="379" y="274" font-size="11" fill="#5C7A99" text-anchor="middle">剩餘容量 82%</text>
  <line x1="470" y1="214" x2="506" y2="214" stroke="#E8734A" stroke-width="3" marker-end="url(#arO)"/>
  <text x="492.0" y="202" font-size="12" font-weight="700" fill="#E8734A" text-anchor="middle">打折</text>
  <rect x="514" y="150" width="174" height="128" rx="7" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.2"/>
  <rect x="514" y="150" width="174" height="30" rx="7" fill="#2E6DA4"/>
  <rect x="514" y="172" width="174" height="8" fill="#2E6DA4"/>
  <text x="601" y="171" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">關卡二　LTB</text>
  <text x="601" y="204" font-size="12.5" fill="#5C7A99" text-anchor="middle">側撐夠不夠密？</text>
  <text x="601" y="230" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> vs L</tspan><tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'>、L</tspan><tspan font-size='11' dy='4'>r</tspan></text>
  <rect x="534" y="246" width="134" height="16" rx="3" fill="#DCE6F0"/>
  <rect x="534" y="246" width="78" height="16" rx="3" fill="#2E6DA4"/>
  <text x="601" y="274" font-size="11" fill="#5C7A99" text-anchor="middle">剩餘容量 57%</text>
  <line x1="692" y1="214" x2="728" y2="214" stroke="#E8734A" stroke-width="3" marker-end="url(#arO)"/>
  <text x="714.0" y="202" font-size="12" font-weight="700" fill="#E8734A" text-anchor="middle">打折</text>
  <rect x="736" y="150" width="174" height="128" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2.2"/>
  <rect x="736" y="150" width="174" height="30" rx="7" fill="#1E8449"/>
  <rect x="736" y="172" width="174" height="8" fill="#1E8449"/>
  <text x="823" y="171" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">設計強度</text>
  <text x="823" y="204" font-size="12.5" fill="#5C7A99" text-anchor="middle">取最不利 × 折減</text>
  <text x="823" y="230" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">φ<tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'>M</tspan><tspan font-size='11' dy='4'>n</tspan><tspan dy='-4'> ≥ M</tspan><tspan font-size='11' dy='4'>u</tspan></text>
  <rect x="756" y="246" width="134" height="16" rx="3" fill="#DCE6F0"/>
  <rect x="756" y="246" width="70" height="16" rx="3" fill="#1E8449"/>
  <text x="823" y="274" font-size="11" fill="#5C7A99" text-anchor="middle">剩餘容量 52%</text>
  <text x="40" y="330" font-size="14" font-weight="700" fill="#4C6B8A">② 獨立檢核線（與彎矩無關，但一樣會落選）</text>
  <rect x="70" y="352" width="400" height="96" rx="7" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.8"/>
  <rect x="70" y="352" width="400" height="6" rx="3" fill="#4C6B8A"/>
  <text x="90" y="383" font-size="15" font-weight="700" fill="#1B2A41">剪力檢核</text>
  <text x="90" y="410" font-size="15" font-weight="700" fill="#4C6B8A">V<tspan font-size="11" dy="4">n</tspan><tspan dy="-4"> = 0.6F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4">A</tspan><tspan font-size="11" dy="4">w</tspan><tspan dy="-4">C</tspan><tspan font-size="11" dy="4">v</tspan></text>
  <text x="90" y="434" font-size="12.5" fill="#5C7A99">剪力面積用全深　A<tspan font-size='11' dy='4'>w</tspan><tspan dy='-4'> = d × t</tspan><tspan font-size='11' dy='4'>w</tspan></text>
  <rect x="510" y="352" width="400" height="96" rx="7" fill="#F4F6F9" stroke="#4C6B8A" stroke-width="1.8"/>
  <rect x="510" y="352" width="400" height="6" rx="3" fill="#4C6B8A"/>
  <text x="530" y="383" font-size="15" font-weight="700" fill="#1B2A41">使用性撓度</text>
  <text x="530" y="410" font-size="15" font-weight="700" fill="#4C6B8A">δ ≤ L / 360</text>
  <text x="530" y="434" font-size="12.5" fill="#5C7A99">必用<tspan font-weight='700' fill='#C0392B'>服務載重</tspan>與 I<tspan font-size='11' dy='4'>x</tspan><tspan dy='-4'>，不可用 1.2D+1.6L</tspan></text>
  <rect x="34" y="470" width="912" height="100" rx="7" fill="#1B2A41"/>
  <text x="54" y="500" font-size="15" font-weight="700" fill="#FFFFFF">判讀口訣</text>
  <text x="54" y="528" font-size="14" fill="#DCE6F0">斷面給本錢 M<tspan font-size="11" dy="4">p</tspan><tspan dy="-4">　→　關卡一 板的尺度（局部挫屈 FLB）　→　關卡二 桿的尺度（側扭挫屈 LTB）　→　截頂 × φ</tspan><tspan font-size="11" dy="4">b</tspan><tspan dy="-4"> 與獨立檢核</tspan></text>
  <text x="54" y="554" font-size="14" font-weight="700" fill="#E8734A">三道關卡是「串聯」的：只要有一關沒過，強度就要打折 — 最後取最不利者控制。</text>
  <rect x="34" y="592" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="622" font-size="13.5" fill="#1B2A41">・注意方向性：關卡只會把 M<tspan font-size='10' dy='3'>n</tspan><tspan dy='-3'> 往下壓，永遠不會超過 M</tspan><tspan font-size='10' dy='3'>p</tspan><tspan dy='-3'>；所有折減式最後都要做 ≤ M</tspan><tspan font-size='10' dy='3'>p</tspan><tspan dy='-3'> 截頂。</tspan></text>
  <text x="54" y="648" font-size="13.5" fill="#1B2A41">・剪力與撓度不參與上面的流水線，但任一條沒過，設計一樣不合格 — 收尾一定要回頭補這兩刀。</text>
</svg>
