<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">寬厚比：翼板量「一半」，腹板量「淨高」</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">量錯基準＝整題全錯 — 翼板是懸臂板、腹板是兩端支承板</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <text x="40" y="118" font-size="14" font-weight="700" fill="#4C6B8A">① 斷面尺寸定義</text>
  <rect x="170.0" y="175.0" width="260" height="24" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="291.0" y="199.0" width="18" height="202" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="170.0" y="401.0" width="260" height="24" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="300" y1="137.0" x2="300" y2="463.0" stroke="#5C7A99" stroke-width="1" stroke-dasharray="14 4 3 4"/>
  <line x1="170.0" y1="123.0" x2="430.0" y2="123.0" stroke="#5C7A99" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <line x1="170.0" y1="117.0" x2="170.0" y2="171.0" stroke="#5C7A99" stroke-width="0.9"/>
  <line x1="430.0" y1="117.0" x2="430.0" y2="171.0" stroke="#5C7A99" stroke-width="0.9"/>
  <rect x="274" y="107.0" width="52" height="22" fill="#FFFFFF"/>
  <text x="300" y="123.0" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="middle">b<tspan font-size="11" dy="4">f</tspan></text>
  <rect x="309.0" y="175.0" width="121.0" height="24" fill="url(#hatchR)"/>
  <line x1="309.0" y1="151.0" x2="430.0" y2="151.0" stroke="#C0392B" stroke-width="1.6" marker-start="url(#arR)" marker-end="url(#arR)"/>
  <text x="371.0" y="145.0" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">b<tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> / 2</tspan></text>
  <line x1="446.0" y1="175.0" x2="446.0" y2="199.0" stroke="#5C7A99" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <text x="454.0" y="192.0" font-size="14" font-weight="700" fill="#4C6B8A">t<tspan font-size="11" dy="4">f</tspan></text>
  <line x1="140.0" y1="199.0" x2="140.0" y2="401.0" stroke="#2E6DA4" stroke-width="1.6" marker-start="url(#arB)" marker-end="url(#arB)"/>
  <line x1="134.0" y1="199.0" x2="174.0" y2="199.0" stroke="#2E6DA4" stroke-width="0.9"/>
  <line x1="134.0" y1="401.0" x2="174.0" y2="401.0" stroke="#2E6DA4" stroke-width="0.9"/>
  <text x="130.0" y="306" font-size="15" font-weight="700" fill="#2E6DA4" text-anchor="end">h</text>
  <text x="130.0" y="326" font-size="11.5" fill="#2E6DA4" text-anchor="end">腹板淨高</text>
  <line x1="74.0" y1="175.0" x2="74.0" y2="425.0" stroke="#5C7A99" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <text x="66.0" y="306" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="end">d</text>
  <text x="66.0" y="326" font-size="11.5" fill="#5C7A99" text-anchor="end">全深</text>
  <line x1="291.0" y1="447.0" x2="309.0" y2="447.0" stroke="#5C7A99" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <text x="340" y="452.0" font-size="14" font-weight="700" fill="#4C6B8A">t<tspan font-size="11" dy="4">w</tspan></text>
  <line x1="478" y1="112" x2="478" y2="520" stroke="#DCE6F0" stroke-width="2"/>
  <text x="500" y="118" font-size="14" font-weight="700" fill="#4C6B8A">② 為什麼翼板除以 2？看板的邊界條件</text>
  <rect x="530" y="150" width="250" height="86" rx="4" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
  <rect x="514" y="140" width="16" height="106" fill="url(#grd)" stroke="#5C7A99" stroke-width="1.2"/>
  <text x="494" y="198" font-size="13" font-weight="700" fill="#5C7A99" text-anchor="middle">固</text>
  <text x="494" y="216" font-size="13" font-weight="700" fill="#5C7A99" text-anchor="middle">定</text>
  <line x1="790" y1="150" x2="790" y2="236" stroke="#C0392B" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="800" y="196" font-size="13" font-weight="700" fill="#C0392B">自由端</text>
  <text x="655" y="200" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="middle">翼板 ≒ 懸臂板</text>
  <text x="655" y="264" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">懸出長度只有半個翼寬　→　λ<tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> = b</tspan><tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> / 2t</tspan><tspan font-size="11" dy="4">f</tspan></text>
  <rect x="560" y="322" width="200" height="110" rx="4" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  <rect x="544" y="312" width="216" height="12" fill="url(#grd)" stroke="#5C7A99" stroke-width="1.2"/>
  <rect x="544" y="432" width="216" height="12" fill="url(#grd)" stroke="#5C7A99" stroke-width="1.2"/>
  <text x="660" y="384" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="middle">腹板 ≒ 兩端支承板</text>
  <text x="790" y="356" font-size="12.5" fill="#5C7A99">上下都被翼板夾住</text>
  <text x="790" y="412" font-size="12.5" fill="#5C7A99">→ 限值 λ<tspan font-size="10" dy="3">p</tspan><tspan dy="-3"> 寬鬆得多</tspan></text>
  <text x="660" y="472" font-size="14" font-weight="700" fill="#2E6DA4" text-anchor="middle">量的是「淨高」，不含翼板厚　→　λ<tspan font-size="11" dy="4">w</tspan><tspan dy="-4"> = h / t</tspan><tspan font-size="11" dy="4">w</tspan></text>
  <rect x="34" y="520" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="550" font-size="13.5" fill="#1B2A41">・翼板懸出 b<tspan font-size='10' dy='3'>f</tspan><tspan dy='-3'>/2 只有一邊被腹板撐住，最容易皺 → λ</tspan><tspan font-size='10' dy='3'>p</tspan><tspan dy='-3'> 限值嚴格；腹板兩邊都有翼板撐住，限值寬鬆。</tspan></text>
  <text x="54" y="576" font-size="13.5" fill="#1B2A41">・剪力用的是<tspan font-weight='700' fill='#C0392B'>全深 d</tspan>，寬厚比用的是<tspan font-weight='700' fill='#2E6DA4'>淨高 h</tspan> — 兩者不同，是最常見的代錯值。</text>
</svg>
