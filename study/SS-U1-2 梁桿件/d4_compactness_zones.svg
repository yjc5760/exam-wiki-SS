<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">關卡一：板件一皺，本錢就守不住</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">同一張「三分區」圖，橫軸換成寬厚比 λ</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <rect x="120" y="132" width="230" height="368" fill="#E8F5EC"/>
  <rect x="350" y="132" width="260" height="368" fill="#FDF0E9"/>
  <rect x="610" y="132" width="220" height="368" fill="#FBE9E7"/>
  <line x1="120" y1="500" x2="870" y2="500" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="120" y1="500" x2="120" y2="130" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/>
  <text x="882" y="506" font-size="16" font-weight="700" fill="#1B2A41">λ</text>
  <text x="114" y="126" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="middle">M<tspan font-size="12" dy="4">n</tspan></text>
  <line x1="120" y1="168" x2="830" y2="168" stroke="#1B2A41" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
  <text x="106" y="174" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="end">M<tspan font-size="12" dy="4">p</tspan></text>
  <line x1="120" y1="300" x2="830" y2="300" stroke="#4C6B8A" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.65"/>
  <text x="106" y="306" font-size="17" font-weight="700" fill="#4C6B8A" text-anchor="end">M<tspan font-size="12" dy="4">r</tspan></text>
  <path d="M120,168 L350,168 L610,300 C 680,338 750,362 830,427" fill="none" stroke="#E8734A" stroke-width="4.5"/>
  <line x1="350" y1="132" x2="350" y2="510" stroke="#1B2A41" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="350" y="534" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">λ<tspan font-size="12" dy="4">p</tspan></text>
  <line x1="610" y1="132" x2="610" y2="510" stroke="#1B2A41" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="610" y="534" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">λ<tspan font-size="12" dy="4">r</tspan></text>
  <circle cx="350" cy="168" r="6" fill="#E8734A" stroke="#FFF" stroke-width="2"/>
  <circle cx="610" cy="300" r="6" fill="#E8734A" stroke="#FFF" stroke-width="2"/>
  <text x="235.0" y="152" font-size="14.5" font-weight="700" fill="#1E8449" text-anchor="middle">結實斷面　Compact</text>
  <text x="235.0" y="448" font-size="14" font-weight="700" fill="#1E8449" text-anchor="middle">λ ≤ λ<tspan font-size='11' dy='4'>p</tspan></text>
  <text x="235.0" y="472" font-size="11.5" fill="#5C7A99" text-anchor="middle">板件不會先皺，可進第二關爭取 M<tspan font-size='11' dy='4'>p</tspan></text>
  <text x="480.0" y="152" font-size="14.5" font-weight="700" fill="#E8734A" text-anchor="middle">半結實　Non-compact</text>
  <text x="480.0" y="448" font-size="14" font-weight="700" fill="#E8734A" text-anchor="middle">λ<tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> &lt; λ ≤ λ</tspan><tspan font-size='11' dy='4'>r</tspan></text>
  <text x="480.0" y="472" font-size="11.5" fill="#5C7A99" text-anchor="middle">中途挫屈，強度線性折減</text>
  <text x="720.0" y="152" font-size="14.5" font-weight="700" fill="#C0392B" text-anchor="middle">細長　Slender</text>
  <text x="720.0" y="448" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">λ &gt; λ<tspan font-size='11' dy='4'>r</tspan></text>
  <text x="720.0" y="472" font-size="11.5" fill="#5C7A99" text-anchor="middle">彈性局部挫屈，折減最重</text>
  <rect x="360" y="336" width="300" height="58" rx="6" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.8"/>
  <text x="510" y="358" font-size="12.5" font-weight="700" fill="#E8734A" text-anchor="middle">線性折減（與 LTB 同一個長相）</text>
  <text x="510" y="383" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">M<tspan font-size="11" dy="4">n</tspan><tspan dy="-4">=M</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4">−(M</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4">−M</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">)(λ−λ</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4">)/(λ</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">−λ</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4">)</tspan></text>
  <rect x="120" y="552" width="380" height="60" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="138" y="578" font-size="14" font-weight="700" fill="#C0392B">翼板　λ<tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> = b</tspan><tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> / 2t</tspan><tspan font-size="11" dy="4">f</tspan><tspan dy="-4">　（懸臂板）</tspan></text>
  <text x="138" y="602" font-size="14" font-weight="700" fill="#2E6DA4">腹板　λ<tspan font-size="11" dy="4">w</tspan><tspan dy="-4"> = h / t</tspan><tspan font-size="11" dy="4">w</tspan><tspan dy="-4">　　（兩端支承板，h 為淨高）</tspan></text>
  <rect x="520" y="552" width="426" height="60" rx="6" fill="#1B2A41"/>
  <text x="540" y="578" font-size="13.5" font-weight="700" fill="#FFFFFF">翼板與腹板要<tspan fill="#E8734A">分別</tspan>檢核，兩者都過才算結實斷面；</text>
  <text x="540" y="602" font-size="13.5" font-weight="700" fill="#FFFFFF">任一項落入半結實，該項的折減值就是這一關的答案。</text>
</svg>
