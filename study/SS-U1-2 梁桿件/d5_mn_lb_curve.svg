  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">關卡二：側撐夠不夠密？一張圖看完三區段</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">橫軸 L&#8202;b、縱軸 M&#8202;n — 全單元最核心的一張圖</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <rect x="120" y="132" width="200" height="376" fill="#E8F5EC"/>
  <rect x="320" y="132" width="240" height="376" fill="#FDF0E9"/>
  <rect x="560" y="132" width="240" height="376" fill="#EAF0F7"/>
  <line x1="120" y1="508" x2="836" y2="508" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="120" y1="508" x2="120" y2="124" stroke="#1B2A41" stroke-width="2" marker-end="url(#ar)"/>
  <text x="848" y="514" font-size="17" font-weight="700" fill="#1B2A41">L<tspan font-size="12" dy="4">b</tspan></text>
  <text x="120" y="118" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">M<tspan font-size="12" dy="4">n</tspan></text>
  <line x1="120" y1="158" x2="800" y2="158" stroke="#1B2A41" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="106" y="160" font-size="18" font-weight="700" fill="#1B2A41" text-anchor="end">M<tspan font-size="12" dy="4">p</tspan></text>
  <text x="106" y="178" font-size="11" fill="#1B2A41" text-anchor="end">= F&#8202;y Z&#8202;x</text>
  <line x1="120" y1="292" x2="800" y2="292" stroke="#4C6B8A" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="106" y="294" font-size="18" font-weight="700" fill="#4C6B8A" text-anchor="end">M<tspan font-size="12" dy="4">r</tspan></text>
  <text x="106" y="312" font-size="11" fill="#4C6B8A" text-anchor="end">= (F&#8202;y − F&#8202;r) S&#8202;x</text>
