  <text x="194" y="219" font-size="12.5" font-weight="700" fill="#1B2A41">C<tspan font-size="10" dy="3">b</tspan><tspan dy="-3"> = 1.0 基準線</tspan></text>
  <line x1="150" y1="242" x2="186" y2="242" stroke="#E8734A" stroke-width="3.2" stroke-dasharray="9 5"/>
  <text x="194" y="247" font-size="12.5" font-weight="700" fill="#E8734A">× C<tspan font-size="10" dy="3">b</tspan><tspan dy="-3"> 後（C</tspan><tspan font-size="10" dy="3">b</tspan><tspan dy="-3">=1.3）</tspan></text>
  <line x1="417.0" y1="106" x2="417.0" y2="152" stroke="#C0392B" stroke-width="2" marker-end="url(#arR)"/>
  <rect x="299.0" y="76" width="236" height="30" rx="5" fill="#C0392B"/>
  <text x="417.0" y="97" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">乘完 C&#8202;b 一定要截頂 ≤ M&#8202;p</text>
  <line x1="320" y1="132" x2="320" y2="518" stroke="#1B2A41" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="320" y="542" font-size="18" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size="12" dy="4">p</tspan></text>
  <line x1="560" y1="132" x2="560" y2="518" stroke="#1B2A41" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="560" y="542" font-size="18" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size="12" dy="4">r</tspan></text>
  <circle cx="320" cy="158" r="6.5" fill="#1B2A41" stroke="#FFF" stroke-width="2"/>
  <circle cx="560" cy="292" r="6.5" fill="#1B2A41" stroke="#FFF" stroke-width="2"/>
  <text x="220.0" y="420" font-size="15" font-weight="700" fill="#1E8449" text-anchor="middle">① 塑性區</text>
  <text x="220.0" y="444" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> ≤ L</tspan><tspan font-size='11' dy='4'>p</tspan></text>
  <text x="220.0" y="468" font-size="14" font-weight="700" fill="#1E8449" text-anchor="middle">M<tspan font-size='11' dy='4'>n</tspan><tspan dy='-4'> = M</tspan><tspan font-size='11' dy='4'>p</tspan></text>
  <text x="220.0" y="490" font-size="11.5" fill="#5C7A99" text-anchor="middle">不需乘 C&#8202;b</text>
  <text x="440.0" y="420" font-size="15" font-weight="700" fill="#E8734A" text-anchor="middle">② 非彈性 LTB 區</text>
  <text x="440.0" y="444" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> &lt; L</tspan><tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> ≤ L</tspan><tspan font-size='11' dy='4'>r</tspan></text>
  <text x="440.0" y="468" font-size="14" font-weight="700" fill="#E8734A" text-anchor="middle">線性內插 × C<tspan font-size='11' dy='4'>b</tspan></text>
  <text x="440.0" y="490" font-size="11.5" fill="#5C7A99" text-anchor="middle">★ 最常考</text>
  <text x="680.0" y="420" font-size="15" font-weight="700" fill="#4C6B8A" text-anchor="middle">③ 彈性 LTB 區</text>
  <text x="680.0" y="444" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle">L<tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> &gt; L</tspan><tspan font-size='11' dy='4'>r</tspan></text>
  <text x="680.0" y="468" font-size="14" font-weight="700" fill="#4C6B8A" text-anchor="middle">min( C<tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'>M</tspan><tspan font-size='11' dy='4'>cr</tspan><tspan dy='-4'>, M</tspan><tspan font-size='11' dy='4'>p</tspan><tspan dy='-4'> )</tspan></text>
  <text x="680.0" y="490" font-size="11.5" fill="#5C7A99" text-anchor="middle">全斷面彈性挫屈</text>
  <rect x="836" y="150" width="110" height="330" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="891" y="176" font-size="12.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">側撐密度</text>
