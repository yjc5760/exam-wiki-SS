  <text x="891" y="218" font-size="12" font-weight="700" fill="#1E8449" text-anchor="middle">極密</text>
  <text x="891" y="262" font-size="11" fill="#5C7A99" text-anchor="middle">① 區</text>
  <line x1="852" y1="324" x2="930" y2="324" stroke="#1B2A41" stroke-width="3"/>
  <line x1="852" y1="314" x2="852" y2="334" stroke="#E8734A" stroke-width="2.6"/>
  <line x1="878" y1="314" x2="878" y2="334" stroke="#E8734A" stroke-width="2.6"/>
  <line x1="904" y1="314" x2="904" y2="334" stroke="#E8734A" stroke-width="2.6"/>
  <line x1="930" y1="314" x2="930" y2="334" stroke="#E8734A" stroke-width="2.6"/>
  <text x="891" y="308" font-size="12" font-weight="700" fill="#E8734A" text-anchor="middle">中等</text>
  <text x="891" y="352" font-size="11" fill="#5C7A99" text-anchor="middle">② 區</text>
  <line x1="852" y1="414" x2="930" y2="414" stroke="#1B2A41" stroke-width="3"/>
  <line x1="852" y1="404" x2="852" y2="424" stroke="#4C6B8A" stroke-width="2.6"/>
  <line x1="930" y1="404" x2="930" y2="424" stroke="#4C6B8A" stroke-width="2.6"/>
  <text x="891" y="398" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">很疏</text>
  <text x="891" y="442" font-size="11" fill="#5C7A99" text-anchor="middle">③ 區</text>
  <rect x="34" y="592" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="622" font-size="13.5" fill="#1B2A41">・殘留應力 F<tspan font-size='10' dy='3'>r</tspan><tspan dy='-3'> 只進入 M</tspan><tspan font-size='10' dy='3'>r</tspan><tspan dy='-3'> 與 L</tspan><tspan font-size='10' dy='3'>r</tspan><tspan dy='-3'>（決定折線的右端點），</tspan><tspan font-weight='700' fill='#C0392B'>絕不影響 M</tspan><tspan font-size='10' dy='3' font-weight='700' fill='#C0392B'>p</tspan><tspan dy='-3' font-weight='700' fill='#C0392B'> = F</tspan><tspan font-size='10' dy='3' font-weight='700' fill='#C0392B'>y</tspan><tspan dy='-3' font-weight='700' fill='#C0392B'>Z</tspan><tspan font-size='10' dy='3' font-weight='700' fill='#C0392B'>x</tspan><tspan dy='-3'>（左端高度）。</tspan></text>
  <text x="54" y="648" font-size="13.5" fill="#1B2A41">・C<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'> 是「彎矩梯度紅利」，把整條曲線往上抬；但天花板 M</tspan><tspan font-size='10' dy='3'>p</tspan><tspan dy='-3'> 不會跟著抬 → 抬過頭的部分一律削平。</tspan></text>
