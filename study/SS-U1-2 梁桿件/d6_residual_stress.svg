<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">殘留應力 F&#8202;r：只吃掉「開始降伏」，吃不掉「全斷面降伏」</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">F&#8202;r 只進入 M&#8202;r 與 L&#8202;r — 絕不影響 M&#8202;p = F&#8202;y Z&#8202;x</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#4C6B8A">① 軋製殘留應力</text>
  <text x="60" y="141" font-size="11.5" fill="#5C7A99">冷卻不均：尖端受壓、翼腹交會受拉</text>
  <text x="378" y="118" font-size="15" font-weight="700" fill="#4C6B8A">② 加上彎曲應力</text>
  <text x="378" y="141" font-size="11.5" fill="#5C7A99">尖端只剩 F&#8202;y − F&#8202;r 的餘量</text>
  <text x="696" y="118" font-size="15" font-weight="700" fill="#4C6B8A">③ 繼續加載到底</text>
  <text x="696" y="141" font-size="11.5" fill="#5C7A99">全斷面降伏，殘留應力自行抵銷</text>
  <rect x="60" y="162" width="224" height="26" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="172.0" y1="156" x2="172.0" y2="194" stroke="#5C7A99" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <text x="172.0" y="210" font-size="11.5" fill="#5C7A99" text-anchor="middle">上翼板（俯視）</text>
  <line x1="60" y1="322" x2="284" y2="322" stroke="#1B2A41" stroke-width="1.6"/>
  <polygon points="60,322 60.0,280.0 69.3,287.0 78.7,294.0 88.0,301.0 97.3,308.0 106.7,315.0 116.0,322.0 125.3,329.0 134.7,336.0 144.0,343.0 153.3,350.0 162.7,357.0 172.0,364.0 181.3,357.0 190.7,350.0 200.0,343.0 209.3,336.0 218.7,329.0 228.0,322.0 237.3,315.0 246.7,308.0 256.0,301.0 265.3,294.0 274.7,287.0 284.0,280.0 284,322" fill="url(#hatchR)" opacity="0.9"/>
  <polyline points="60.0,280.0 69.3,287.0 78.7,294.0 88.0,301.0 97.3,308.0 106.7,315.0 116.0,322.0 125.3,329.0 134.7,336.0 144.0,343.0 153.3,350.0 162.7,357.0 172.0,364.0 181.3,357.0 190.7,350.0 200.0,343.0 209.3,336.0 218.7,329.0 228.0,322.0 237.3,315.0 246.7,308.0 256.0,301.0 265.3,294.0 274.7,287.0 284.0,280.0" fill="none" stroke="#1B2A41" stroke-width="2.6"/>
  <text x="56" y="270" font-size="12.5" font-weight="700" fill="#C0392B">壓 −F<tspan font-size="10" dy="3">r</tspan></text>
  <text x="172.0" y="384" font-size="12.5" font-weight="700" fill="#2E6DA4" text-anchor="middle">拉 +F<tspan font-size="10" dy="3">r</tspan></text>
  <text x="60" y="422" font-size="12.5" fill="#1B2A41">熱軋型鋼　F<tspan font-size="10" dy="3">r</tspan><tspan dy="-3"> = 0.7 tf/cm²</tspan></text>
  <text x="60" y="446" font-size="12.5" fill="#1B2A41">銲接組合　F<tspan font-size="10" dy="3">r</tspan><tspan dy="-3"> = 1.16 tf/cm²</tspan></text>
  <rect x="378" y="162" width="224" height="26" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="490.0" y1="156" x2="490.0" y2="194" stroke="#5C7A99" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <text x="490.0" y="210" font-size="11.5" fill="#5C7A99" text-anchor="middle">同一斷面，開始加彎矩</text>
  <line x1="378" y1="322" x2="602" y2="322" stroke="#1B2A41" stroke-width="1.6"/>
  <rect x="378" y="292" width="224" height="30" fill="#DCE6F0" stroke="#4C6B8A" stroke-width="1.6"/>
  <text x="490.0" y="312" font-size="11.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">外加彎曲應力 f<tspan font-size="9" dy="3">b</tspan></text>
  <polyline points="378.0,250.0 387.3,257.0 396.7,264.0 406.0,271.0 415.3,278.0 424.7,285.0 434.0,292.0 443.3,299.0 452.7,306.0 462.0,313.0 471.3,320.0 480.7,327.0 490.0,334.0 499.3,327.0 508.7,320.0 518.0,313.0 527.3,306.0 536.7,299.0 546.0,292.0 555.3,285.0 564.7,278.0 574.0,271.0 583.3,264.0 592.7,257.0 602.0,250.0" fill="none" stroke="#C0392B" stroke-width="2.8"/>
  <line x1="368" y1="250" x2="628" y2="250" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="632" y="255" font-size="13" font-weight="700" fill="#C0392B">F<tspan font-size="10" dy="3">y</tspan></text>
  <circle cx="378" cy="250" r="6" fill="#C0392B" stroke="#FFF" stroke-width="2"/>
  <circle cx="602" cy="250" r="6" fill="#C0392B" stroke="#FFF" stroke-width="2"/>
  <text x="490.0" y="384" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="middle">尖端最先到 F<tspan font-size="10" dy="3">y</tspan></text>
  <rect x="378" y="400" width="224" height="50" rx="5" fill="#FFF" stroke="#C0392B" stroke-width="1.8"/>
  <text x="490.0" y="421" font-size="11.5" fill="#5C7A99" text-anchor="middle">開始降伏彎矩（折線右端點）</text>
  <text x="490.0" y="443" font-size="15" font-weight="700" fill="#C0392B" text-anchor="middle">M<tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> = (F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4"> − F</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">) S</tspan><tspan font-size="11" dy="4">x</tspan></text>
  <rect x="696" y="162" width="224" height="26" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="808.0" y1="156" x2="808.0" y2="194" stroke="#5C7A99" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <text x="808.0" y="210" font-size="11.5" fill="#5C7A99" text-anchor="middle">載重續加到全斷面降伏</text>
  <line x1="696" y1="322" x2="920" y2="322" stroke="#1B2A41" stroke-width="1.6"/>
  <rect x="696" y="250" width="224" height="72" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2.4"/>
  <line x1="686" y1="250" x2="942" y2="250" stroke="#C0392B" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="946" y="255" font-size="13" font-weight="700" fill="#C0392B">F<tspan font-size="10" dy="3">y</tspan></text>
  <text x="808.0" y="292" font-size="13" font-weight="700" fill="#C0392B" text-anchor="middle">整片都是 F<tspan font-size="10" dy="3">y</tspan></text>
  <text x="808.0" y="384" font-size="12.5" font-weight="700" fill="#1E8449" text-anchor="middle">殘留應力自平衡 → 總和抵銷</text>
  <rect x="696" y="400" width="224" height="50" rx="5" fill="#FFF" stroke="#1E8449" stroke-width="1.8"/>
  <text x="808.0" y="421" font-size="11.5" fill="#5C7A99" text-anchor="middle">塑性彎矩（折線左端高度）</text>
  <text x="808.0" y="443" font-size="15" font-weight="700" fill="#1E8449" text-anchor="middle">M<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> = F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4"> Z</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4">　（不含 F</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">）</tspan></text>
  <line x1="300" y1="302" x2="356" y2="302" stroke="#E8734A" stroke-width="3" marker-end="url(#arO)"/>
  <line x1="618" y1="302" x2="674" y2="302" stroke="#E8734A" stroke-width="3" marker-end="url(#arO)"/>
  <rect x="34" y="474" width="912" height="70" rx="6" fill="#1B2A41"/>
  <text x="54" y="503" font-size="14.5" font-weight="700" fill="#FFFFFF">F<tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> 出現的地方只有兩個：M</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> = (F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4">−F</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">)S</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4">　與　L</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> 式中的 F</tspan><tspan font-size="11" dy="4">L</tspan><tspan dy="-4"> = F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4">−F</tspan><tspan font-size="11" dy="4">r</tspan></text>
  <text x="54" y="530" font-size="14.5" font-weight="700" fill="#E8734A">看到題目給 F<tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> 就把它丟進 M</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4"> 與 L</tspan><tspan font-size="11" dy="4">r</tspan><tspan dy="-4">；M</tspan><tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> 那一行看都不要看它一眼。</tspan></text>
  <rect x="34" y="566" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="596" font-size="13.5" fill="#1B2A41">・殘留應力是斷面內部自平衡的應力：合力＝0、合彎矩＝0，所以「全斷面都降伏」之後它完全不影響總彎矩容量。</text>
  <text x="54" y="622" font-size="13.5" fill="#1B2A41">・但它讓翼板尖端提早到 F<tspan font-size='10' dy='3'>y</tspan><tspan dy='-3'>，因此「開始降伏」這個門檻被拉低 → M</tspan><tspan font-size='10' dy='3'>r</tspan><tspan dy='-3'> 變小、L</tspan><tspan font-size='10' dy='3'>r</tspan><tspan dy='-3'> 也跟著改變。</tspan></text>
</svg>
