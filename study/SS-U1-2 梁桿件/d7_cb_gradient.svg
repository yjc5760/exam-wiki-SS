  <text x="470" y="524" font-size="18" font-weight="700" fill="#1B2A41">C<tspan font-size="13" dy="5">b</tspan><tspan dy="-5"> = 12.5 M</tspan><tspan font-size="13" dy="5">max</tspan><tspan dy="-5"> / ( 2.5M</tspan><tspan font-size="13" dy="5">max</tspan><tspan dy="-5"> + 3M</tspan><tspan font-size="13" dy="5">A</tspan><tspan dy="-5"> + 4M</tspan><tspan font-size="13" dy="5">B</tspan><tspan dy="-5"> + 3M</tspan><tspan font-size="13" dy="5">C</tspan><tspan dy="-5"> ) ≤ 3.0</tspan></text>
  <text x="470" y="552" font-size="12.5" fill="#5C7A99">全部取絕對值；C<tspan font-size="10" dy="3">b</tspan><tspan dy="-3">=1.0 永遠偏保守，不確定時可直接取 1.0。</tspan></text>
