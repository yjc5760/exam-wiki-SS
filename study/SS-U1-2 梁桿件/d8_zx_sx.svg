<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">Z&#8202;x 不是 I&#8202;x / c：兩種應力塊，兩個中性軸</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">S&#8202;x 看「最外緣」，Z&#8202;x 看「等面積」— 算 Z&#8202;x 完全用不到 I&#8202;x</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <line x1="490" y1="106" x2="490" y2="540" stroke="#DCE6F0" stroke-width="2"/>
  <text x="110" y="122" font-size="16" font-weight="700" fill="#4C6B8A">① 彈性：S&#8202;x</text>
  <text x="110" y="145" font-size="11.5" fill="#5C7A99">應力呈三角形分布，只有最外緣到 f</text>
  <rect x="75.0" y="173.0" width="170" height="20" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="153.0" y="193.0" width="14" height="150" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="75.0" y="343.0" width="170" height="20" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="50" y1="268" x2="450" y2="268" stroke="#4C6B8A" stroke-width="2" stroke-dasharray="12 4 3 4"/>
  <text x="50" y="259" font-size="12" font-weight="700" fill="#4C6B8A">ENA（形心軸）</text>
  <polygon points="268,268 346,173.0 268,173.0" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
  <polygon points="268,268 346,363.0 268,363.0" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  <line x1="268" y1="161.0" x2="268" y2="375.0" stroke="#1B2A41" stroke-width="1.4"/>
  <text x="352" y="177.0" font-size="12.5" font-weight="700" fill="#C0392B">f ≤ F<tspan font-size="10" dy="3">y</tspan></text>
  <text x="352" y="367.0" font-size="12.5" font-weight="700" fill="#2E6DA4">f</text>
  <line x1="49.0" y1="268" x2="49.0" y2="173.0" stroke="#5C7A99" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
  <text x="41.0" y="225.5" font-size="14" font-weight="700" fill="#5C7A99" text-anchor="end">c</text>
  <rect x="50" y="400" width="400" height="104" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2"/>
  <text x="250" y="432" font-size="20" font-weight="700" fill="#1B2A41" text-anchor="middle">S<tspan font-size="14" dy="5">x</tspan><tspan dy="-5"> = I</tspan><tspan font-size="14" dy="5">x</tspan><tspan dy="-5"> / c</tspan></text>
  <text x="250" y="460" font-size="14" font-weight="700" fill="#4C6B8A" text-anchor="middle">M<tspan font-size="11" dy="4">y</tspan><tspan dy="-4"> = F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4"> S</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4">　（最外緣剛降伏）</tspan></text>
  <text x="250" y="486" font-size="12" fill="#5C7A99" text-anchor="middle">中性軸在形心：軸上下的「一次矩」相等</text>
  <text x="560" y="122" font-size="16" font-weight="700" fill="#C0392B">② 塑性：Z&#8202;x</text>
  <text x="560" y="145" font-size="11.5" fill="#5C7A99">應力是兩塊矩形，整個斷面都是 F&#8202;y</text>
  <rect x="525.0" y="173.0" width="170" height="20" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="603.0" y="193.0" width="14" height="150" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="525.0" y="343.0" width="170" height="20" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="500" y1="268" x2="900" y2="268" stroke="#C0392B" stroke-width="2" stroke-dasharray="12 4 3 4"/>
  <text x="500" y="259" font-size="12" font-weight="700" fill="#C0392B">PNA（等面積軸）</text>
  <rect x="718" y="173.0" width="72" height="95.0" fill="url(#hatchR)" stroke="#C0392B" stroke-width="2"/>
  <rect x="718" y="268" width="72" height="95.0" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2"/>
  <text x="798" y="225.5" font-size="12.5" font-weight="700" fill="#C0392B">F<tspan font-size="10" dy="3">y</tspan><tspan dy="-3"> 全面</tspan></text>
  <text x="798" y="320.5" font-size="12.5" font-weight="700" fill="#2E6DA4">F<tspan font-size="10" dy="3">y</tspan><tspan dy="-3"> 全面</tspan></text>
  <circle cx="610" cy="220.5" r="4.5" fill="#C0392B"/>
  <circle cx="610" cy="315.5" r="4.5" fill="#2E6DA4"/>
  <line x1="610" y1="220.5" x2="610" y2="315.5" stroke="#E8734A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="610" y="159.0" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="middle">受壓面積形心</text>
  <text x="610" y="389.0" font-size="11.5" font-weight="700" fill="#2E6DA4" text-anchor="middle">受拉面積形心</text>
  <rect x="500" y="400" width="400" height="104" rx="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="700" y="432" font-size="20" font-weight="700" fill="#1B2A41" text-anchor="middle">Z<tspan font-size="14" dy="5">x</tspan><tspan dy="-5"> = Σ A</tspan><tspan font-size="14" dy="5">i</tspan><tspan dy="-5"> ȳ</tspan><tspan font-size="14" dy="5">i</tspan></text>
  <text x="700" y="460" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">M<tspan font-size="11" dy="4">p</tspan><tspan dy="-4"> = F</tspan><tspan font-size="11" dy="4">y</tspan><tspan dy="-4"> Z</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4">　（全斷面降伏）</tspan></text>
  <text x="700" y="486" font-size="12" font-weight="700" fill="#C0392B" text-anchor="middle">中性軸在等面積軸：軸上下的「面積」相等</text>
  <rect x="34" y="522" width="912" height="106" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="552" font-size="13.5" fill="#1B2A41">・Z<tspan font-size='10' dy='3'>x</tspan><tspan dy='-3'> 的算法是「PNA 上下兩側面積各自對 PNA 取一次矩再相加」，</tspan><tspan font-weight='700' fill='#C0392B'>整個過程用不到 I</tspan><tspan font-size='10' dy='3' font-weight='700' fill='#C0392B'>x</tspan><tspan dy='-3'>。</tspan></text>
  <text x="54" y="578" font-size="13.5" fill="#1B2A41">・形狀因子 Z<tspan font-size='10' dy='3'>x</tspan><tspan dy='-3'>/S</tspan><tspan font-size='10' dy='3'>x</tspan><tspan dy='-3'>：H 型鋼強軸約 1.10~1.20、矩形 1.5、圓形 1.7 — 這就是塑性設計比彈性設計多賺的那一段。</tspan></text>
  <text x="54" y="604" font-size="13.5" fill="#1B2A41">・對稱斷面 ENA＝PNA；<tspan font-weight='700' fill='#C0392B'>非對稱斷面兩者不同</tspan>，必須分開計算，這是最容易失分的一步。</text>
</svg>
