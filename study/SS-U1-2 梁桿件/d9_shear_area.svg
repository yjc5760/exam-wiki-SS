<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.6" opacity="0.55"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.6" opacity="0.5"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
  </defs>
  <rect width="980" height="690" fill="#FFFFFF"/>
  <rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
  <text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">剪力檢核：面積用「全深 d」，不是淨高 h</text>
  <text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">剪應力幾乎全部由腹板承擔 — 翼板貢獻極小，規範直接忽略</text>
  <line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
  <text x="60" y="120" font-size="14.5" font-weight="700" fill="#4C6B8A">① 剪應力分布：腹板吃掉 ~95%</text>
  <rect x="225.0" y="185.0" width="190" height="22" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/><rect x="312.0" y="207.0" width="16" height="186" fill="#DCE6F0" stroke="#1B2A41" stroke-width="1.8"/><rect x="225.0" y="393.0" width="190" height="22" fill="#F4F6F9" stroke="#1B2A41" stroke-width="1.8"/>
  <line x1="445.0" y1="171.0" x2="445.0" y2="429.0" stroke="#1B2A41" stroke-width="1.4"/>
  <polygon points="445.0,185.0 454.9,185.0 454.9,190.8 454.9,196.5 454.9,202.2 500.2,208.0 502.7,213.8 505.1,219.5 507.3,225.2 509.3,231.0 511.2,236.8 512.9,242.5 514.4,248.2 515.8,254.0 517.0,259.8 518.1,265.5 519.0,271.2 519.7,277.0 520.3,282.8 520.7,288.5 520.9,294.2 521.0,300.0 520.9,305.8 520.7,311.5 520.3,317.2 519.7,323.0 519.0,328.8 518.1,334.5 517.0,340.2 515.8,346.0 514.4,351.8 512.9,357.5 511.2,363.2 509.3,369.0 507.3,374.8 505.1,380.5 502.7,386.2 500.2,392.0 454.9,397.8 454.9,403.5 454.9,409.2 454.9,415.0 445.0,415.0" fill="url(#hatchB)" stroke="#2E6DA4" stroke-width="2.2"/>
  <text x="529.0" y="305" font-size="13" font-weight="700" fill="#2E6DA4">τ<tspan font-size="10" dy="3">max</tspan></text>
  <text x="475.0" y="177.0" font-size="11.5" fill="#5C7A99">翼板 τ 極小</text>
  <text x="453.0" y="157.0" font-size="12" fill="#5C7A99">剪應力分布</text>
  <line x1="191.0" y1="185.0" x2="191.0" y2="415.0" stroke="#C0392B" stroke-width="2" marker-start="url(#arR)" marker-end="url(#arR)"/>
  <line x1="183.0" y1="185.0" x2="231.0" y2="185.0" stroke="#C0392B" stroke-width="1"/>
  <line x1="183.0" y1="415.0" x2="231.0" y2="415.0" stroke="#C0392B" stroke-width="1"/>
  <text x="181.0" y="298" font-size="18" font-weight="700" fill="#C0392B" text-anchor="end">d</text>
  <text x="181.0" y="320" font-size="11" font-weight="700" fill="#C0392B" text-anchor="end">全深｜剪力用</text>
  <line x1="99.0" y1="207.0" x2="99.0" y2="393.0" stroke="#9FB3C8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="93.0" y="298" font-size="15" font-weight="700" fill="#9FB3C8" text-anchor="end">h</text>
  <text x="93.0" y="320" font-size="11" fill="#9FB3C8" text-anchor="end">淨高｜寬厚比用</text>
  <rect x="312.0" y="185.0" width="16" height="230" fill="url(#hatchR)" opacity="0.85"/>
  <line x1="320" y1="449.0" x2="320" y2="421.0" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arR)"/>
  <text x="320" y="469.0" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">A<tspan font-size="11" dy="4">w</tspan><tspan dy="-4"> = d × t</tspan><tspan font-size="11" dy="4">w</tspan></text>
  <line x1="600" y1="106" x2="600" y2="540" stroke="#DCE6F0" stroke-width="2"/>
  <text x="620" y="120" font-size="14.5" font-weight="700" fill="#4C6B8A">② 公式與檢核順序</text>
  <rect x="620" y="140" width="326" height="96" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2"/>
  <text x="783" y="178" font-size="21" font-weight="700" fill="#1B2A41" text-anchor="middle">V<tspan font-size="15" dy="6">n</tspan><tspan dy="-6"> = 0.6 F</tspan><tspan font-size="15" dy="6">y</tspan><tspan dy="-6"> A</tspan><tspan font-size="15" dy="6">w</tspan><tspan dy="-6"> C</tspan><tspan font-size="15" dy="6">v</tspan></text>
  <text x="783" y="208" font-size="12.5" fill="#5C7A99" text-anchor="middle">0.6 F<tspan font-size="10" dy="3">y</tspan><tspan dy="-3"> ≒ F</tspan><tspan font-size="10" dy="3">y</tspan><tspan dy="-3">/√3：von Mises 的剪力降伏應力</tspan></text>
  <text x="783" y="228" font-size="12.5" fill="#5C7A99" text-anchor="middle">C<tspan font-size="10" dy="3">v</tspan><tspan dy="-3"> 為腹板剪力挫屈折減；腹板夠厚時 C</tspan><tspan font-size="10" dy="3">v</tspan><tspan dy="-3"> = 1.0</tspan></text>
  <rect x="620" y="256" width="326" height="76" rx="6" fill="#F4F6F9"/>
  <rect x="620" y="256" width="5" height="76" fill="#4C6B8A"/>
  <text x="638" y="284" font-size="13.5" font-weight="700" fill="#4C6B8A">V<tspan font-size='11' dy='4'>u</tspan><tspan dy='-4'> 取在哪裡？</tspan></text>
  <text x="638" y="310" font-size="11.5" fill="#1B2A41">支承附近剪力最大；均布載重取支承處</text>
  <rect x="620" y="342" width="326" height="76" rx="6" fill="#F4F6F9"/>
  <rect x="620" y="342" width="5" height="76" fill="#C0392B"/>
  <text x="638" y="370" font-size="13.5" font-weight="700" fill="#C0392B">為什麼用全深 d？</text>
  <text x="638" y="396" font-size="11.5" fill="#1B2A41">交會處仍在傳剪力，規範取全腹板高簡化</text>
  <rect x="620" y="428" width="326" height="76" rx="6" fill="#F4F6F9"/>
  <rect x="620" y="428" width="5" height="76" fill="#1E8449"/>
  <text x="638" y="456" font-size="13.5" font-weight="700" fill="#1E8449">設計式</text>
  <text x="638" y="482" font-size="11.5" fill="#1B2A41">φ<tspan font-size='11' dy='4'>v</tspan><tspan dy='-4'>V</tspan><tspan font-size='11' dy='4'>n</tspan><tspan dy='-4'> ≥ V</tspan><tspan font-size='11' dy='4'>u</tspan><tspan dy='-4'>，φ</tspan><tspan font-size='11' dy='4'>v</tspan><tspan dy='-4'> = 0.90（與彎矩的 φ</tspan><tspan font-size='11' dy='4'>b</tspan><tspan dy='-4'> 相同但各自檢核）</tspan></text>
  <rect x="34" y="560" width="912" height="80" rx="6" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
  <text x="54" y="590" font-size="13.5" fill="#1B2A41">・剪力與彎矩<tspan font-weight='700'>互不相干</tspan>：深梁短跨常常是剪力控制，淺梁長跨常常是撓度控制 — 別只算完 φ<tspan font-size='10' dy='3'>b</tspan><tspan dy='-3'>M</tspan><tspan font-size='10' dy='3'>n</tspan><tspan dy='-3'> 就交卷。</tspan></text>
  <text x="54" y="616" font-size="13.5" fill="#1B2A41">・同一題裡 d 與 h 會同時出現：<tspan font-weight='700' fill='#C0392B'>剪力面積用 d</tspan>、<tspan font-weight='700' fill='#2E6DA4'>腹板寬厚比用 h</tspan> — 代錯就是整題報銷。</text>
</svg>
