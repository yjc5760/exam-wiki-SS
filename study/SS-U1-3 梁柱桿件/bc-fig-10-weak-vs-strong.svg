','Nimbus Roman',serif" font-size="13.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">P<tspan dy="4.05" font-size="9.18">u</tspan><tspan dy="-4.05" font-size="13.5">/P</tspan><tspan dy="4.05" font-size="9.18">e1</tspan><tspan dy="-4.05" font-size="13.5"> = 0.743</tspan></text><text x="402.00" y="198.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">→ B<tspan dy="4.20" font-size="9.52">1</tspan><tspan dy="-4.20" font-size="14"> = 3.90</tspan></text><text x="260.00" y="250.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">軸力比差 3.0 倍，放大倍率差距更大</text><rect x="144.0" y="406.82142857142856" width="84" height="45.17857142857143" rx="7" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="1.8"/><text x="186.00" y="392.82" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">1.33</text><text x="177.10" y="470.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">B<tspan dy="4.35" font-size="9.86">1x</tspan></text><rect x="292.0" y="320.0" width="84" height="132.0" rx="7" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.8"/><text x="334.00" y="306.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">3.90</text><text x="325.10" y="470.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="14.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">B<tspan dy="4.35" font-size="9.86">1y</tspan></text><text x="260.00" y="562.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">弱軸的放大程度是強軸的 2.9 倍 → 必須分開算</text></g><text x="520.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">本例 B1y / B1x = 2.92。若貪快用強軸的 B1 去放大弱軸彎矩，Muy 會嚴重低估。</text></svg>