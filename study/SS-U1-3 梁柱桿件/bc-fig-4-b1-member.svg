<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="722" viewBox="0 0 1040 722" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="600"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="600"/></clipPath></defs><rect width="1040" height="722" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">左腿第一段：B1 管的是「構件自己彎出來的」二階效應</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">它跟整層有沒有側移無關，所以有效長度一律用非側移模式</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">P-δ：桿件相對「自己的弦線」鼓出</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩端不平移，中央撓出 δ</text><line x1="260.00" y1="435.73" x2="260.00" y2="161.75" stroke="#C3CAD5" stroke-width="2.6" stroke-linecap="butt" stroke-dasharray="6 6" opacity="1.0"/><polyline points="260.00,435.73 257.78,431.16 255.56,426.59 253.36,422.03 251.17,417.46 249.01,412.89 246.88,408.33 244.78,403.76 242.73,399.20 240.72,394.63 238.77,390.06 236.87,385.50 235.04,380.93 233.28,376.37 231.58,371.80 229.97,367.23 228.44,362.67 227.00,358.10 225.64,353.53 224.39,348.97 223.22,344.40 222.16,339.84 221.21,335.27 220.35,