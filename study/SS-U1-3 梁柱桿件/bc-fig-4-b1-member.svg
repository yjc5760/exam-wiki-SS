y="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="18" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">δ</text><circle cx="260.00" cy="161.75" r="5.4" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.4"/><circle cx="260.00" cy="435.73" r="5.4" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="2.4"/><text x="274.00" y="205.59" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">弦線（兩端連線）</text><text x="260.00" y="538.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">端點無相對側移，弦線仍為鉛直</text><text x="165.54" y="564.00" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="16" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700" font-style="italic">B<tspan dy="4.80" font-size="10.88">1</tspan><tspan dy="-4.80" font-size="16"> = C</tspan><tspan dy="4.80" font-size="10.88">m</tspan><tspan dy="-4.80" font-size="16"> / (1 − P</tspan><tspan dy="4.80" font-size="10.88">u</tspan><tspan dy="-4.80" font-size="16">/P</tspan><tspan dy="4.80" font-size="10.88">e1</tspan><tspan dy="-4.80" font-size="16">) ≥ 1.0</tspan></text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">有斜撐構架 → K 取非側移模式</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">實務取 K = 1.0</text><line x1="118.33" y1="446.00" x2="118.33" y2="168.22" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="396.11" y1="446.00" x2="396.11" y2="168.22" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="118.33" y1="168.22" x2="396.11" y2="168.22" stroke="#3F4A5A" stroke-width="6.5" stroke-linecap="butt" opacity="1.0"/><line x1="118.33" y1="446.00" x2="396.11" y2="168.22" stroke="#1D4ED8" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="10 6" opacity="1.0"/><polygon points="118.33,446.00 106.81,464.40 129.85,464.40" fill="none" stroke="#3F4A5A" stroke-width="2.6" stroke-linejoin="round"/><line x1="98.33" y1="464.40" x2="138.33" y2="464.40" stroke="#3F4A5A" stroke-width="2.6" stroke-linecap="round"/><line x1="99.73" y1="464.40" x2="92.73" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="109.03" y1="464.40" x2="102.03" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="118.33" y1="464.40" x2="111.33" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="127.64" y1="464.40" x2="120.64" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="136.94" y1="464.40" x2="129.94" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><polygon points="396.11,446.00 384.59,464.40 407.63,464.40" fill="none" stroke="#3F4A5A" stroke-width="2.6" stroke-linejoin="round"/><line x1="376.11" y1="464.40" x2="416.11" y2="464.40" stroke="#3F4A5A" stroke-width="2.6" stroke-linecap="round"/><line x1="377.51" y1="464.40" x2="370.51" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="386.81" y1="464.40" x2="379.81" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="396.11" y1="464.40" x2="389.11" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="405.41" y1="464.40" x2="398.41" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="414.72" y1="464.40" x2="407.72" y2="472.40" stroke="#3F4A5A" stroke-width="1.8" stroke-linecap="round"/><line x1="257.22" y1="101.56" x2="257.22" y2="147.11" stroke="#C0392B" stroke-width="3.2" stroke-linecap="round"/><polygon points="257.22,157.11 252.62,147.11 261.82,147.11" fill="#C0392B"/><text x="268.22" y="112.67" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="17" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="400" font-style="italic">P<tspan dy="5.10" font-size="11.56">u</tspan></text><text x="207.22" y="223.78" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">斜撐吸收側力</text><text x="207.22" y="243.78" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15.5" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700" font-style="italic">Δ ≈ 0</text><text x="169.34" y="538.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">沒有側移就沒有 P-Δ，故 M<tspan dy="3.90" font-size="8.84">lt</tspan><tspan dy="-3.90" font-size="13"> = 0</tspan></text><text x="206.35" y="564.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">整題只需要算 B<tspan dy="4.50" font-size="10.2">1</tspan></text></g><text x="520.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">最常見的錯誤是把對位圖查到的側移 K（K &gt; 1.0）拿去算 Pe1——Pe1 一律用 K = 1.0，側移 K 只屬於 B2 的 Pe2。</text></svg>