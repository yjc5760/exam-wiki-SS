<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">銲道方向角與坡口銲</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">橫向銲比縱向銲強 50%；全滲透開槽銲（CJP）則直接由母材控制</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<text x="40" y="110" font-size="14" font-weight="700" fill="#4C6B8A">① 受力方向角 θ：力越垂直於銲道軸線，銲道越強</text>
<rect x="36" y="126" width="448" height="276" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="36" y="126" width="448" height="28" rx="7" fill="#4C6B8A"/>
<rect x="36" y="146" width="448" height="8" fill="#4C6B8A"/>
<text x="260" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">同一片搭接板的兩種銲法</text>
<rect x="92" y="196" width="150" height="110" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="206" y="216" width="170" height="70" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/>
<line x1="206" y1="216" x2="376" y2="216" stroke="#C0392B" stroke-width="5"/>
<line x1="206" y1="286" x2="376" y2="286" stroke="#C0392B" stroke-width="5"/>
<text x="292" y="208" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="middle">縱向銲　θ = 0°</text>
<line x1="400" y1="251" x2="436" y2="251" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<text x="292" y="302" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="middle">係數 1.0</text>
<rect x="92" y="330" width="150" height="60" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="206" y="330" width="170" height="60" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/>
<line x1="242" y1="330" x2="242" y2="390" stroke="#2E6DA4" stroke-width="5"/>
<text x="300" y="348" font-size="11.5" font-weight="700" fill="#2E6DA4" text-anchor="middle">橫向銲　θ = 90°</text>
<text x="300" y="372" font-size="11.5" font-weight="700" fill="#2E6DA4" text-anchor="middle">係數 1.5</text>
<line x1="400" y1="360" x2="436" y2="360" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<rect x="504" y="126" width="440" height="276" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="504" y="126" width="440" height="28" rx="7" fill="#4C6B8A"/>
<rect x="504" y="146" width="440" height="8" fill="#4C6B8A"/>
<text x="724" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">方向強度增益係數</text>
<line x1="570" y1="356" x2="570" y2="188" stroke="#5C7A99" stroke-width="1.8" marker-end="url(#arS)"/>
<line x1="570" y1="356" x2="914" y2="356" stroke="#5C7A99" stroke-width="1.8" marker-end="url(#arS)"/>
<path d="M 570 356 L 588.333 351.986 L 606.667 344.712 L 625 335.459 L 643.333 324.797 L 661.667 313.141 L 680 300.846 L 698.333 288.234 L 716.667 275.606 L 735 263.242 L 753.333 251.406 L 771.667 240.343 L 790 230.275 L 808.333 221.402 L 826.667 213.897 L 845 207.905 L 863.333 203.541 L 881.667 200.89 L 900 200" fill="none" stroke="#E8734A" stroke-width="3"/>
<line x1="570" y1="356" x2="900" y2="356" stroke="#5C7A99" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="570" y1="200" x2="900" y2="200" stroke="#5C7A99" stroke-width="1" stroke-dasharray="4 3"/>
<text x="562" y="361" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="end">1.0</text>
<text x="562" y="205" font-size="11.5" font-weight="700" fill="#2E6DA4" text-anchor="end">1.5</text>
<text x="570" y="376" font-size="11" fill="#5C7A99" text-anchor="middle">0°</text>
<text x="900" y="376" font-size="11" fill="#5C7A99" text-anchor="middle">90°</text>
<text x="735" y="376" font-size="11" fill="#5C7A99" text-anchor="middle">45°</text>
<circle cx="570" cy="356" r="5" fill="#C0392B"/>
<circle cx="900" cy="200" r="5" fill="#2E6DA4"/>
<text x="730" y="180" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle">R<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = 0.6 F</tspan><tspan font-size='0.76em' dy='4'>EXX</tspan><tspan dy='-4'> (1.0 + 0.5 sin</tspan><tspan font-size='0.76em' dy='-4'>1</tspan><tspan dy='4'>.5 θ) A</tspan><tspan font-size='0.76em' dy='4'>we</tspan><tspan dy='-4'></tspan></text>
<text x="730" y="392" font-size="11.5" fill="#5C7A99" text-anchor="middle">θ 為「受力方向」與「銲道軸線」的夾角</text>
<text x="40" y="432" font-size="14" font-weight="700" fill="#4C6B8A">② 三種銲道，破壞面完全不同</text>
<rect x="36" y="450" width="290" height="148" rx="7" fill="#FFFFFF" stroke="#E8734A" stroke-width="2.2"/>
<rect x="36" y="450" width="290" height="30" rx="7" fill="#E8734A"/>
<rect x="36" y="472" width="290" height="8" fill="#E8734A"/>
<text x="181" y="471" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">填角銲　Fillet</text>
<text x="52" y="500" font-size="11.5" fill="#1B2A41">・破壞面：45° 喉部 t<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> = 0.707w</tspan></text>
<text x="52" y="526" font-size="11.5" fill="#1B2A41">・強度：0.75 × 0.6F<tspan font-size='0.76em' dy='4'>EXX</tspan><tspan dy='-4'> × t</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> L</tspan></text>
<text x="52" y="552" font-size="11.5" fill="#1B2A41">・最常考；必檢查銲腳限值</text>
<rect x="342" y="450" width="290" height="148" rx="7" fill="#FFFFFF" stroke="#1E8449" stroke-width="2.2"/>
<rect x="342" y="450" width="290" height="30" rx="7" fill="#1E8449"/>
<rect x="342" y="472" width="290" height="8" fill="#1E8449"/>
<text x="487" y="471" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">全滲透開槽銲　CJP</text>
<text x="358" y="500" font-size="11.5" fill="#1B2A41">・破壞面：母材本身</text>
<text x="358" y="526" font-size="11.5" fill="#1B2A41">・銲道比母材強 → 不必算銲道</text>
<text x="358" y="552" font-size="11.5" fill="#1B2A41">・直接用 φF<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>BM</tspan><tspan dy='-4'>（母材控制）</tspan></text>
<rect x="648" y="450" width="290" height="148" rx="7" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.2"/>
<rect x="648" y="450" width="290" height="30" rx="7" fill="#2E6DA4"/>
<rect x="648" y="472" width="290" height="8" fill="#2E6DA4"/>
<text x="793" y="471" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">部分滲透開槽銲　PJP</text>
<text x="664" y="500" font-size="11.5" fill="#1B2A41">・破壞面：有效喉厚 t<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'>（查表）</tspan></text>
<text x="664" y="526" font-size="11.5" fill="#1B2A41">・t<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> 依坡口角度與銲接方法折減</tspan></text>
<text x="664" y="552" font-size="11.5" fill="#1B2A41">・受拉時 φ 與填角銲不同，要查表</text>
<rect x="36" y="612" width="908" height="60" rx="6" fill="#FDF2EC" stroke="#E8734A" stroke-width="1.6"/>
<rect x="36" y="612" width="4.5" height="60" fill="#E8734A"/>
<text x="50" y="636" font-size="13" font-weight="700" fill="#E8734A">判讀技巧</text>
<text x="50" y="656" font-size="12" fill="#1B2A41">考題若只寫「開槽銲」而沒說滲透程度，先看是否寫「全滲透」— 全滲透就不必算銲道強度。</text>
</svg>