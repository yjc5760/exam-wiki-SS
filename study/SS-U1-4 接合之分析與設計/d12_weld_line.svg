<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4C6B8A"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.8" opacity="0.6"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchO" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#E8734A" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
  </defs>
<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">銲縫線圖法：把銲道當成「一條線」</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">先用單位寬度算「每 cm 的力」，最後才和 1.565w（每 cm 的容量）比較</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<text x="40" y="110" font-size="14" font-weight="700" fill="#4C6B8A">① 為什麼可以當成線？因為有效喉厚每一段都相同，可以先提出來</text>
<rect x="36" y="126" width="452" height="300" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="36" y="126" width="452" height="28" rx="7" fill="#4C6B8A"/>
<rect x="36" y="146" width="452" height="8" fill="#4C6B8A"/>
<text x="262" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">C 形銲縫（最常考的配置）</text>
<rect x="170" y="200" width="190" height="140" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/>
<rect x="144" y="176" width="26" height="188" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="144" y="176" width="26" height="188" fill="url(#grd)" opacity="0.25"/>
<line x1="170" y1="200" x2="360" y2="200" stroke="#C0392B" stroke-width="5"/>
<line x1="170" y1="340" x2="360" y2="340" stroke="#C0392B" stroke-width="5"/>
<line x1="170" y1="200" x2="170" y2="340" stroke="#C0392B" stroke-width="5"/>
<text x="265" y="190" font-size="11" font-weight="700" fill="#C0392B" text-anchor="middle">銲縫</text>
<text x="162" y="274" font-size="13" font-weight="700" fill="#C0392B" text-anchor="end">d</text>
<line x1="239.423" y1="170" x2="239.423" y2="384" stroke="#E8734A" stroke-width="1.6" stroke-dasharray="7 4"/>
<circle cx="239.423" cy="270" r="5" fill="#E8734A"/>
<text x="247.423" y="376" font-size="11" font-weight="700" fill="#E8734A">形心軸</text>
<line x1="170" y1="390" x2="170" y2="402" stroke="#E8734A" stroke-width="1.2"/>
<line x1="239.423" y1="390" x2="239.423" y2="402" stroke="#E8734A" stroke-width="1.2"/>
<line x1="170" y1="396" x2="239.423" y2="396" stroke="#E8734A" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="204.712" y="412" font-size="12" fill="#E8734A" text-anchor="middle">x̄ = b²/(2b+d)</text>
<line x1="170" y1="160" x2="170" y2="172" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="360" y1="160" x2="360" y2="172" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="170" y1="166" x2="360" y2="166" stroke="#5C7A99" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="265" y="156" font-size="12" fill="#5C7A99" text-anchor="middle">b（每邊有效長度）</text>
<line x1="380" y1="270" x2="416" y2="270" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<text x="420" y="275" font-size="13" font-weight="700" fill="#C0392B">P</text>
<circle cx="170" cy="200" r="7" fill="none" stroke="#1E8449" stroke-width="2.4"/>
<circle cx="170" cy="340" r="7" fill="none" stroke="#1E8449" stroke-width="2.4"/>
<text x="386" y="402" font-size="11" font-weight="700" fill="#1E8449" text-anchor="middle">※ 臨界點通常在角落（r 最大）</text>
<rect x="508" y="126" width="436" height="300" rx="7" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.2"/>
<rect x="508" y="126" width="436" height="28" rx="7" fill="#1B2A41"/>
<rect x="508" y="146" width="436" height="8" fill="#1B2A41"/>
<text x="726" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">三個步驟（單位要盯緊）</text>
<rect x="528" y="176" width="398" height="64" rx="6" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.6"/>
<rect x="528" y="176" width="5" height="64" fill="#E8734A"/>
<text x="546" y="200" font-size="11.5" font-weight="700" fill="#E8734A">Step 1</text>
<text x="606" y="200" font-size="12.5" font-weight="700" fill="#1B2A41">把銲縫視為寬度 1 cm 的線</text>
<text x="546" y="224" font-size="13" font-weight="700" fill="#1B2A41">總長 L<tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'> = 2b + d　（cm）</tspan></text>
<rect x="528" y="254" width="398" height="64" rx="6" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.6"/>
<rect x="528" y="254" width="5" height="64" fill="#2E6DA4"/>
<text x="546" y="278" font-size="11.5" font-weight="700" fill="#2E6DA4">Step 2</text>
<text x="606" y="278" font-size="12.5" font-weight="700" fill="#1B2A41">求線的極慣性矩</text>
<text x="546" y="302" font-size="13" font-weight="700" fill="#1B2A41">I<tspan font-size='0.76em' dy='4'>p</tspan><tspan dy='-4'> = I</tspan><tspan font-size='0.76em' dy='4'>x</tspan><tspan dy='-4'> + I</tspan><tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'>　（cm³）</tspan></text>
<rect x="528" y="332" width="398" height="64" rx="6" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.6"/>
<rect x="528" y="332" width="5" height="64" fill="#1E8449"/>
<text x="546" y="356" font-size="11.5" font-weight="700" fill="#1E8449">Step 3</text>
<text x="606" y="356" font-size="12.5" font-weight="700" fill="#1B2A41">算每 cm 的合力再比對容量</text>
<text x="546" y="380" font-size="13" font-weight="700" fill="#1B2A41">f = √(f<tspan font-size='0.76em' dy='4'>v</tspan><tspan dy='-4'>² + f</tspan><tspan font-size='0.76em' dy='4'>M</tspan><tspan dy='-4'>²) ≤ 1.565 w</tspan></text>
<text x="528" y="418" font-size="11.5" font-weight="700" fill="#C0392B">※ 求出所需 w 後仍要取整，並回頭檢查銲腳上下限。</text>
<text x="40" y="456" font-size="14" font-weight="700" fill="#4C6B8A">② 常用線圖性質（考場直接套，省時間）</text>
<rect x="36" y="472" width="234" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="153" y="492" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">銲縫配置</text>
<rect x="270" y="472" width="226" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="383" y="492" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">形心 x̄</text>
<rect x="496" y="472" width="226" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="609" y="492" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">I<tspan font-size='0.76em' dy='4'>x</tspan><tspan dy='-4'></tspan></text>
<rect x="722" y="472" width="222" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="833" y="492" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">I<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'></tspan></text>
<rect x="36" y="502" width="234" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="153" y="524" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">單一豎線（長 d）</text>
<rect x="270" y="502" width="226" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="383" y="524" font-size="12" fill="#1B2A41" text-anchor="middle">在線上</text>
<rect x="496" y="502" width="226" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="609" y="524" font-size="12" fill="#1B2A41" text-anchor="middle">d³/12</text>
<rect x="722" y="502" width="222" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="833" y="524" font-size="12" fill="#1B2A41" text-anchor="middle">0</text>
<rect x="36" y="536" width="234" height="34" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="153" y="558" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">兩條平行豎線（間距 b）</text>
<rect x="270" y="536" width="226" height="34" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="383" y="558" font-size="12" fill="#1B2A41" text-anchor="middle">b/2</text>
<rect x="496" y="536" width="226" height="34" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="609" y="558" font-size="12" fill="#1B2A41" text-anchor="middle">d³/6</text>
<rect x="722" y="536" width="222" height="34" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="833" y="558" font-size="12" fill="#1B2A41" text-anchor="middle">b²d/2</text>
<rect x="36" y="570" width="234" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="153" y="592" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">C 形（上下 b、豎 d）</text>
<rect x="270" y="570" width="226" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="383" y="592" font-size="12" fill="#1B2A41" text-anchor="middle">b²/(2b+d)</text>
<rect x="496" y="570" width="226" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="609" y="592" font-size="12" fill="#1B2A41" text-anchor="middle">d²(d+6b)/12</text>
<rect x="722" y="570" width="222" height="34" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="833" y="592" font-size="12" fill="#1B2A41" text-anchor="middle">以平移定理自行計算</text>
<text x="36" y="630" font-size="12" fill="#5C7A99">※ I<tspan font-size='0.76em' dy='4'>p</tspan><tspan dy='-4'> = I</tspan><tspan font-size='0.76em' dy='4'>x</tspan><tspan dy='-4'> + I</tspan><tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'>，單位為 cm³（因為線的寬度取 1 cm）；算出的 f 單位是 tf/cm。</tspan></text>
<text x="36" y="656" font-size="12" fill="#5C7A99">※ 若題目直接給「銲道喉厚 t<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'>」，也可改用 A</tspan><tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'> = t</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'>·L</tspan><tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'> 的應力法，兩者等價。</tspan></text>
</svg>