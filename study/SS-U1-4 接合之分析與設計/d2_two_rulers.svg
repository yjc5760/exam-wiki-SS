    <pattern id="hatchO" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#E8734A" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
  </defs>
<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">兩把尺，生出所有規範公式</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">尺一：受力型態決定要不要乘 0.6　│　尺二：破壞機制決定用「降伏」還是「斷裂」</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<text x="40" y="112" font-size="14" font-weight="700" fill="#4C6B8A">① 第一把尺：看受力型態</text>
<rect x="36" y="126" width="434" height="208" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="36" y="126" width="434" height="28" rx="7" fill="#4C6B8A"/>
<rect x="36" y="146" width="434" height="8" fill="#4C6B8A"/>
<text x="253" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">受拉面 × 1.0　vs　受剪面 × 0.6</text>
<rect x="76" y="182" width="96" height="54" fill="#DCE6F0" stroke="#2E6DA4" stroke-width="2"/>
<line x1="70" y1="209" x2="40" y2="209" stroke="#2E6DA4" stroke-width="3" marker-end="url(#arB)"/>
<line x1="178" y1="209" x2="208" y2="209" stroke="#2E6DA4" stroke-width="3" marker-end="url(#arB)"/>
<line x1="124" y1="176" x2="124" y2="242" stroke="#2E6DA4" stroke-width="2.4" stroke-dasharray="7 4"/>
<text x="124" y="170" font-size="11" fill="#2E6DA4" text-anchor="middle">破壞面 ⊥ 力</text>
<text x="124" y="264" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">受拉：直接拉開</text>
<text x="124" y="288" font-size="13" font-weight="700" fill="#2E6DA4" text-anchor="middle">不折減 → ×1.0</text>
<text x="124" y="314" font-size="12.5" fill="#1B2A41" text-anchor="middle">F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'>　或　F</tspan><tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'></tspan></text>
<line x1="232" y1="240" x2="232" y2="178" stroke="#8FA6BC" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="296" y="182" width="96" height="54" fill="#DCE6F0" stroke="#C0392B" stroke-width="2"/>
<line x1="290" y1="194" x2="258" y2="194" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<line x1="398" y1="224" x2="430" y2="224" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<line x1="296" y1="209" x2="392" y2="209" stroke="#C0392B" stroke-width="2.6" stroke-dasharray="7 4"/>
<text x="344" y="170" font-size="11" fill="#C0392B" text-anchor="middle">破壞面 ∥ 力（滑動）</text>
<text x="344" y="264" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">受剪：von Mises</text>
<text x="344" y="288" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="middle">τ<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> = F</tspan><tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'>/√3 ≈ 0.577F</tspan><tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'></tspan></text>
<text x="344" y="314" font-size="13" font-weight="700" fill="#C0392B" text-anchor="middle">一律 ×0.6</text>
<text x="510" y="112" font-size="14" font-weight="700" fill="#4C6B8A">② 第二把尺：看破壞機制</text>
<rect x="506" y="126" width="438" height="208" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="506" y="126" width="438" height="28" rx="7" fill="#4C6B8A"/>
<rect x="506" y="146" width="438" height="8" fill="#4C6B8A"/>
<text x="725" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">降伏（延性、有預警）　vs　斷裂（脆性、無預警）</text>
<line x1="560" y1="252" x2="560" y2="168" stroke="#5C7A99" stroke-width="1.8" marker-end="url(#arS)"/>
<line x1="560" y1="252" x2="920" y2="252" stroke="#5C7A99" stroke-width="1.8" marker-end="url(#arS)"/>
<text x="552" y="174" font-size="13" fill="#5C7A99" text-anchor="end">σ</text>
<text x="916" y="269" font-size="13" fill="#5C7A99" text-anchor="middle">ε</text>
<path d="M 560 252 L 604 216 L 684 216 Q 786 214 816 186 L 852 198" fill="none" stroke="#1B2A41" stroke-width="2.6"/>
<line x1="560" y1="216" x2="604" y2="216" stroke="#2E6DA4" stroke-width="1.4" stroke-dasharray="5 3"/>
<line x1="560" y1="186" x2="816" y2="186" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="552" y="220" font-size="12.5" font-weight="700" fill="#2E6DA4" text-anchor="end">F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'></tspan></text>
<text x="552" y="190" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="end">F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'></tspan></text>
<circle cx="604" cy="216" r="5.5" fill="#2E6DA4"/>
<circle cx="816" cy="186" r="5.5" fill="#C0392B"/>
<text x="614" y="208" font-size="11.5" font-weight="700" fill="#2E6DA4">降伏起點</text>
<text x="812" y="178" font-size="11.5" font-weight="700" fill="#C0392B" text-anchor="middle">斷裂</text>
<rect x="530" y="268" width="196" height="54" rx="5" fill="#EAF1F8" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="628" y="289" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">用 F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> × 毛面積 A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'></tspan></text>
<text x="628" y="310" font-size="12" fill="#2E6DA4" text-anchor="middle">φ = 0.90（可容忍）</text>
<rect x="736" y="268" width="196" height="54" rx="5" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.6"/>
<text x="834" y="289" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">用 F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> × 有效淨面積 A</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'></tspan></text>
<text x="834" y="310" font-size="12" fill="#C0392B" text-anchor="middle">φ = 0.75（要更保守）</text>
<text x="40" y="364" font-size="14" font-weight="700" fill="#4C6B8A">③ 兩把尺相乘 → 規範公式生成器（不必背，現場推得出來）</text>
<rect x="96" y="378" width="108" height="34" rx="4" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1.4"/>
<text x="150" y="400" font-size="10.5" fill="#5C7A99" text-anchor="middle">尺一 ↓ ／ 尺二 →</text>
<rect x="212" y="378" width="356" height="34" rx="4" fill="#2E6DA4"/>
<text x="390" y="401" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">尺二：降伏 → F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> × A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'></tspan></text>
<rect x="578" y="378" width="356" height="34" rx="4" fill="#C0392B"/>
<text x="756" y="401" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">尺二：斷裂 → F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> × A</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'></tspan></text>
<rect x="96" y="416" width="108" height="82" rx="4" fill="#2E6DA4"/>
<text x="150" y="450" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">受拉面</text>
<text x="150" y="474" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">×1.0</text>
<rect x="212" y="416" width="356" height="82" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.8"/>
<text x="390" y="444" font-size="12.5" fill="#5C7A99" text-anchor="middle">母材全斷面降伏 GSY</text>
<text x="390" y="476" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">φP<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = 0.90 F</tspan><tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'></tspan></text>
<rect x="578" y="416" width="356" height="82" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.8"/>
<text x="756" y="444" font-size="12.5" fill="#5C7A99" text-anchor="middle">母材淨斷面斷裂 NSF</text>
<text x="756" y="476" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">φP<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = 0.75 F</tspan><tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> (U A</tspan><tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'>)</tspan></text>
<rect x="96" y="504" width="108" height="82" rx="4" fill="#C0392B"/>
<text x="150" y="538" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">受剪面</text>
<text x="150" y="562" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">×0.6</text>
<rect x="212" y="504" width="356" height="82" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.8"/>
<text x="390" y="532" font-size="12.5" fill="#5C7A99" text-anchor="middle">塊狀剪力之「剪力降伏」項</text>
<text x="390" y="564" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">0.75 × 0.6 F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>gv</tspan><tspan dy='-4'></tspan></text>
<rect x="578" y="504" width="356" height="82" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1.8"/>
<text x="756" y="532" font-size="12.5" fill="#5C7A99" text-anchor="middle">螺栓／銲喉剪斷、BSR 剪斷項</text>
<text x="756" y="564" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="middle">0.75 × 0.6 F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>nv</tspan><tspan dy='-4'></tspan></text>
<rect x="96" y="600" width="838" height="79" rx="6" fill="#FDF2EC" stroke="#E8734A" stroke-width="1.6"/>
<rect x="96" y="600" width="4.5" height="79" fill="#E8734A"/>
<text x="110" y="624" font-size="13" font-weight="700" fill="#E8734A">兩把尺的使用守則</text>
<text x="110" y="644" font-size="12" fill="#1B2A41">0.6 只跟「這個面是不是被剪」有關，跟用 F<tspan font-size='0.76em' dy='4'>y</tspan><tspan dy='-4'> 還是 F</tspan><tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> 無關 — 兩把尺互相獨立，可任意組合。</tspan></text>
<text x="110" y="663" font-size="12" fill="#1B2A41">φ 跟著破壞機制走：延性降伏 φ=0.90；脆性斷裂 φ=0.75（接合區幾乎全部是 0.75）。</text>
</svg>