<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4C6B8A"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.8" opacity="0.6"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchO" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#E8734A" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
  </defs>
<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">淨斷面：破壞線不只一條</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">交錯孔時每條可能的破壞路徑都要試，取「扣最多」的那一條</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<text x="40" y="110" font-size="14" font-weight="700" fill="#4C6B8A">① 兩條候選破壞線：直線只扣 1 孔，鋸齒扣 2 孔但補回 s²/4g</text>
<rect x="150" y="168" width="510" height="180" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2.2"/>
<circle cx="300" cy="216" r="11" fill="#FFFFFF" stroke="#5C7A99" stroke-width="1.8"/>
<line x1="285" y1="216" x2="315" y2="216" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<line x1="300" y1="201" x2="300" y2="231" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<circle cx="420" cy="292" r="11" fill="#FFFFFF" stroke="#5C7A99" stroke-width="1.8"/>
<line x1="405" y1="292" x2="435" y2="292" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<line x1="420" y1="277" x2="420" y2="307" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<circle cx="540" cy="216" r="11" fill="#FFFFFF" stroke="#5C7A99" stroke-width="1.8"/>
<line x1="525" y1="216" x2="555" y2="216" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<line x1="540" y1="201" x2="540" y2="231" stroke="#5C7A99" stroke-width="0.9" stroke-dasharray="5 3"/>
<line x1="154" y1="216" x2="656" y2="216" stroke="#5C7A99" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="154" y1="292" x2="656" y2="292" stroke="#5C7A99" stroke-width="1" stroke-dasharray="6 4"/>
<text x="164" y="208" font-size="10.5" fill="#5C7A99">標距線 1</text>
<text x="164" y="284" font-size="10.5" fill="#5C7A99">標距線 2</text>
<line x1="420" y1="152" x2="420" y2="364" stroke="#2E6DA4" stroke-width="3.2"/>
<text x="420" y="144" font-size="12" font-weight="700" fill="#2E6DA4" text-anchor="middle">① 直線：扣 1 孔</text>
<path d="M 300 156 L 300 216 L 414 292 L 414 360" fill="none" stroke="#C0392B" stroke-width="3.2" stroke-dasharray="10 5"/>
<text x="290" y="144" font-size="12" font-weight="700" fill="#C0392B" text-anchor="middle">② 鋸齒：扣 2 孔 + s²/4g</text>
<circle cx="300" cy="216" r="4.5" fill="#C0392B"/>
<circle cx="414" cy="292" r="4.5" fill="#C0392B"/>
<line x1="300" y1="374" x2="300" y2="386" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="420" y1="374" x2="420" y2="386" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="300" y1="380" x2="420" y2="380" stroke="#5C7A99" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="360" y="396" font-size="11.5" fill="#5C7A99" text-anchor="middle">s（平行受力方向）</text>
<line x1="598" y1="216" x2="610" y2="216" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="598" y1="292" x2="610" y2="292" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="604" y1="216" x2="604" y2="292" stroke="#5C7A99" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="595" y="258" font-size="11.5" fill="#5C7A99" text-anchor="end">g（標距）</text>
<line x1="112" y1="168" x2="124" y2="168" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="112" y1="348" x2="124" y2="348" stroke="#5C7A99" stroke-width="1.2"/>
<line x1="118" y1="168" x2="118" y2="348" stroke="#5C7A99" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="109" y="262" font-size="11.5" fill="#5C7A99" text-anchor="end">w<tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'>（全寬）</tspan></text>
<line x1="672" y1="258" x2="708" y2="258" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<text x="668" y="263" font-size="13.5" font-weight="700" fill="#C0392B" text-anchor="end">P</text>
<rect x="744" y="150" width="200" height="204" rx="7" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.2"/>
<rect x="744" y="150" width="200" height="28" rx="7" fill="#1B2A41"/>
<rect x="744" y="170" width="200" height="8" fill="#1B2A41"/>
<text x="844" y="169" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">淨寬計算式</text>
<text x="844" y="196" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">w<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = w</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'> − Σd</tspan><tspan font-size='0.76em' dy='4'>h</tspan><tspan dy='-4'> + Σ s²/4g</tspan></text>
<text x="844" y="224" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="middle">A<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = w</tspan><tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> × t</tspan></text>
<line x1="762" y1="242" x2="926" y2="242" stroke="#DCE6F0" stroke-width="1.6"/>
<text x="762" y="266" font-size="11.5" fill="#5C7A99">孔徑 d<tspan font-size='0.76em' dy='4'>h</tspan><tspan dy='-4'>（計算淨面積用）</tspan></text>
<text x="844" y="294" font-size="14" font-weight="700" fill="#E8734A" text-anchor="middle">d<tspan font-size='0.76em' dy='4'>h</tspan><tspan dy='-4'> = d + 0.3 cm</tspan></text>
<text x="844" y="316" font-size="10.5" fill="#5C7A99" text-anchor="middle">（標準孔 d+0.2，再加損傷 0.1）</text>
<text x="844" y="340" font-size="10.5" fill="#C0392B" text-anchor="middle">※ 題目有給就用題目給的</text>
<text x="40" y="420" font-size="14" font-weight="700" fill="#4C6B8A">② 三個步驟，一個都不能少</text>
<rect x="36" y="440" width="290" height="96" rx="6" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2"/>
<rect x="36" y="440" width="290" height="4" fill="#2E6DA4"/>
<text x="52" y="468" font-size="12" font-weight="700" fill="#2E6DA4">Step 1</text>
<text x="114" y="468" font-size="13" font-weight="700" fill="#1B2A41">列出所有可能破壞線</text>
<text x="52" y="492" font-size="11.5" fill="#5C7A99">直線、單鋸齒、雙鋸齒…</text>
<text x="52" y="512" font-size="11.5" fill="#5C7A99">只要能從一邊走到另一邊都要列</text>
<rect x="342" y="440" width="290" height="96" rx="6" fill="#FFFFFF" stroke="#E8734A" stroke-width="2"/>
<rect x="342" y="440" width="290" height="4" fill="#E8734A"/>
<text x="358" y="468" font-size="12" font-weight="700" fill="#E8734A">Step 2</text>
<text x="420" y="468" font-size="13" font-weight="700" fill="#1B2A41">每條線算 w<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'></tspan></text>
<text x="358" y="492" font-size="11.5" fill="#5C7A99">每經過一個孔扣一次 d<tspan font-size='0.76em' dy='4'>h</tspan><tspan dy='-4'></tspan></text>
<text x="358" y="512" font-size="11.5" fill="#5C7A99">每走一段斜線補回一次 s²/4g</text>
<rect x="648" y="440" width="290" height="96" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
<rect x="648" y="440" width="290" height="4" fill="#C0392B"/>
<text x="664" y="468" font-size="12" font-weight="700" fill="#C0392B">Step 3</text>
<text x="726" y="468" font-size="13" font-weight="700" fill="#1B2A41">取 w<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> 最小者</tspan></text>
<text x="664" y="492" font-size="11.5" fill="#5C7A99">最小淨寬才是控制斷面</text>
<text x="664" y="512" font-size="11.5" fill="#5C7A99">再乘 U 得 A<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> = U A</tspan><tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'></tspan></text>
<rect x="36" y="556" width="908" height="98" rx="6" fill="#FDF2EC" stroke="#E8734A" stroke-width="1.6"/>
<rect x="36" y="556" width="4.5" height="98" fill="#E8734A"/>
<text x="50" y="580" font-size="13" font-weight="700" fill="#E8734A">最常見的三個扣分點</text>
<text x="50" y="600" font-size="12" fill="#1B2A41">斜線補回項只補「斜著走的那一段」— 走幾段斜線就補幾次 s²/4g，不是每個孔都補；其餘路徑同理逐一檢查。</text>
<text x="50" y="619" font-size="12" fill="#1B2A41">拼接板（續接板）另有上限 A<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> ≤ 0.85 A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'>；角鋼展開成板時 w</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'> 取兩肢長相加再扣一個板厚。</tspan></text>
<text x="50" y="638" font-size="12" fill="#1B2A41">銲接沒有孔，A<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = A</tspan><tspan font-size='0.76em' dy='4'>g</tspan><tspan dy='-4'>，鋸齒問題不存在；但 U 仍要算。</tspan></text>
</svg>