<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">螺栓兩個世界：摩阻型 vs 承壓型</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">力走的路不一樣 → 極限狀態不一樣 → φ 不一樣</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<rect x="36" y="108" width="450" height="306" rx="7" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2.2"/>
<rect x="36" y="108" width="450" height="30" rx="7" fill="#2E6DA4"/>
<rect x="36" y="130" width="450" height="8" fill="#2E6DA4"/>
<text x="261" y="129" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">世界 A　摩阻型（Slip-Critical）</text>
<text x="261" y="330" font-size="12.5" fill="#5C7A99" text-anchor="middle">不准滑動：靠預拉力夾緊，力走摩擦面</text>
<rect x="128" y="196" width="150" height="26" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="244" y="222" width="150" height="26" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="256" y="180" width="20" height="84" rx="2" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2"/>
<rect x="246" y="170" width="40" height="12" fill="#1B2A41"/>
<rect x="246" y="262" width="40" height="12" fill="#1B2A41"/>
<line x1="118" y1="209" x2="82" y2="209" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<text x="78" y="214" font-size="13" font-weight="700" fill="#C0392B" text-anchor="end">P</text>
<line x1="404" y1="235" x2="440" y2="235" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<line x1="266" y1="146" x2="266" y2="166" stroke="#2E6DA4" stroke-width="3" marker-end="url(#arB)"/>
