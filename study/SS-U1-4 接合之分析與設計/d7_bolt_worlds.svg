<text x="278" y="154" font-size="11.5" font-weight="700" fill="#2E6DA4">T<tspan font-size='0.76em' dy='4'>b</tspan><tspan dy='-4'>（預拉力）</tspan></text>
<line x1="244" y1="222" x2="394" y2="222" stroke="#1E8449" stroke-width="4"/>
<text x="332" y="244" font-size="11.5" font-weight="700" fill="#1E8449" text-anchor="middle">摩擦面（滑動面 n<tspan font-size='0.76em' dy='4'>s</tspan><tspan dy='-4'>）</tspan></text>
<text x="261" y="314" font-size="12" font-weight="700" fill="#2E6DA4" text-anchor="middle">螺栓桿不受剪、孔壁不承壓</text>
<rect x="60" y="348" width="402" height="54" rx="5" fill="#EAF1F8" stroke="#2E6DA4" stroke-width="1.6"/>
<text x="261" y="371" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="middle">φR<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = φ · μ D</tspan><tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> h</tspan><tspan font-size='0.76em' dy='4'>sc</tspan><tspan dy='-4'> T</tspan><tspan font-size='0.76em' dy='4'>b</tspan><tspan dy='-4'> n</tspan><tspan font-size='0.76em' dy='4'>s</tspan><tspan dy='-4'></tspan></text>
<text x="261" y="392" font-size="11.5" fill="#2E6DA4" text-anchor="middle">φ = 1.0（標準孔）— 這是「使用性」極限，不是斷裂</text>
<rect x="494" y="108" width="450" height="306" rx="7" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.2"/>
<rect x="494" y="108" width="450" height="30" rx="7" fill="#C0392B"/>
<rect x="494" y="130" width="450" height="8" fill="#C0392B"/>
<text x="719" y="129" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">世界 B　承壓型（Bearing-Type）</text>
<text x="719" y="330" font-size="12.5" fill="#5C7A99" text-anchor="middle">允許滑動至貼緊：力走螺栓桿與孔壁</text>
<rect x="586" y="196" width="150" height="26" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="702" y="222" width="150" height="26" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
