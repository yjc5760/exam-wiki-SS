<rect x="704" y="170" width="40" height="12" fill="#1B2A41"/>
<rect x="704" y="262" width="40" height="12" fill="#1B2A41"/>
<line x1="576" y1="209" x2="540" y2="209" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<text x="536" y="214" font-size="13" font-weight="700" fill="#C0392B" text-anchor="end">P</text>
<line x1="862" y1="235" x2="898" y2="235" stroke="#C0392B" stroke-width="3" marker-end="url(#arR)"/>
<line x1="712" y1="216" x2="736" y2="216" stroke="#C0392B" stroke-width="4"/>
<line x1="712" y1="228" x2="736" y2="228" stroke="#C0392B" stroke-width="4"/>
<text x="754" y="208" font-size="11.5" font-weight="700" fill="#C0392B">桿身受剪</text>
<line x1="708" y1="198" x2="708" y2="220" stroke="#E8734A" stroke-width="5"/>
<line x1="740" y1="224" x2="740" y2="246" stroke="#E8734A" stroke-width="5"/>
<text x="646" y="274" font-size="11.5" font-weight="700" fill="#E8734A" text-anchor="middle">孔壁承壓</text>
<line x1="674" y1="266" x2="704" y2="222" stroke="#E8734A" stroke-width="1.6"/>
<text x="719" y="314" font-size="12" font-weight="700" fill="#C0392B" text-anchor="middle">板已滑動貼緊，力靠「頂」與「剪」傳</text>
<rect x="518" y="348" width="194" height="54" rx="5" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.6"/>
<text x="615" y="371" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">螺栓剪斷</text>
<text x="615" y="392" font-size="13.5" font-weight="700" fill="#C0392B" text-anchor="middle">0.75 F<tspan font-size='0.76em' dy='4'>nv</tspan><tspan dy='-4'> A</tspan><tspan font-size='0.76em' dy='4'>b</tspan><tspan dy='-4'> n</tspan><tspan font-size='0.76em' dy='4'>s</tspan><tspan dy='-4'></tspan></text>
<rect x="726" y="348" width="194" height="54" rx="5" fill="#FDF2EC" stroke="#E8734A" stroke-width="1.6"/>
<text x="823" y="371" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">孔壁承壓</text>
<text x="823" y="392" font-size="13.5" font-weight="700" fill="#E8734A" text-anchor="middle">0.75 · 2.4 F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> d t</tspan></text>
<text x="40" y="452" font-size="14" font-weight="700" fill="#4C6B8A">兩世界對照（選錯世界，整題全錯）</text>
<rect x="36" y="468" width="168" height="32" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="120" y="489" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">比較項目</text>
<rect x="204" y="468" width="370" height="32" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="389" y="489" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">摩阻型 Slip-Critical</text>
<rect x="574" y="468" width="370" height="32" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="759" y="489" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">承壓型 Bearing-Type</text>
<rect x="36" y="500" width="168" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="120" y="520" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">力的傳遞</text>
<rect x="204" y="500" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="389" y="520" font-size="12" fill="#1B2A41" text-anchor="middle">板與板之間的摩擦力</text>
<rect x="574" y="500" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="759" y="520" font-size="12" fill="#1B2A41" text-anchor="middle">螺栓桿受剪 ＋ 孔壁承壓</text>
<rect x="36" y="530" width="168" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="120" y="550" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">控制的極限狀態</text>
<rect x="204" y="530" width="370" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="389" y="550" font-size="12" fill="#1B2A41" text-anchor="middle">滑動（使用性）</text>
<rect x="574" y="530" width="370" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="759" y="550" font-size="12" fill="#1B2A41" text-anchor="middle">剪斷、承壓（強度）</text>
<rect x="36" y="560" width="168" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="120" y="580" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">抗力係數 φ</text>
<rect x="204" y="560" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="389" y="580" font-size="12" fill="#1B2A41" text-anchor="middle">1.00（標準孔）／ 0.85（槽孔）</text>
<rect x="574" y="560" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="759" y="580" font-size="12" fill="#1B2A41" text-anchor="middle">0.75</text>
<rect x="36" y="590" width="168" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="120" y="610" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">螺栓要求</text>
<rect x="204" y="590" width="370" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="389" y="610" font-size="12" fill="#1B2A41" text-anchor="middle">必須為高強度螺栓且施加預拉力 T<tspan font-size='0.76em' dy='4'>b</tspan><tspan dy='-4'></tspan></text>
<rect x="574" y="590" width="370" height="30" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="759" y="610" font-size="12" fill="#1B2A41" text-anchor="middle">可用 A307；不必預拉</text>
<rect x="36" y="620" width="168" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="120" y="640" font-size="12" font-weight="700" fill="#4C6B8A" text-anchor="middle">何時一定要用</text>
<rect x="204" y="620" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="389" y="640" font-size="12" fill="#1B2A41" text-anchor="middle">反復載重、需控制變形、長槽孔</text>
<rect x="574" y="620" width="370" height="30" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="759" y="640" font-size="12" fill="#1B2A41" text-anchor="middle">一般靜載重接合</text>
<text x="36" y="664" font-size="12.5" font-weight="700" fill="#C0392B">※ 摩阻型仍須檢核「萬一滑動後」的承壓型強度 — 兩個世界都要算，不是二選一。</text>
</svg>