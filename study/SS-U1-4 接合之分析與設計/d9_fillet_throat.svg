<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690" font-family="Noto Sans CJK TC, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1B2A41"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#C0392B"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2E6DA4"/></marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#E8734A"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1E8449"/></marker>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4C6B8A"/></marker>
    <marker id="dimS" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M9,0 L1,3 L9,6 z" fill="#5C7A99"/></marker>
    <marker id="dimE" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#5C7A99"/></marker>
    <pattern id="hatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#C0392B" stroke-width="1.8" opacity="0.6"/></pattern>
    <pattern id="hatchB" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#2E6DA4" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchO" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#E8734A" stroke-width="1.8" opacity="0.55"/></pattern>
    <pattern id="hatchG" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#5C7A99" stroke-width="1.4" opacity="0.45"/></pattern>
    <pattern id="grd" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#5C7A99" stroke-width="1.2"/></pattern>
  </defs>
<rect width="980" height="690" fill="#FFFFFF"/>
<rect x="34" y="24" width="6" height="30" fill="#E8734A"/>
<text x="52" y="41" font-size="20" font-weight="700" fill="#1B2A41">填角銲：破壞面在 45° 喉部</text>
<text x="52" y="64" font-size="15" font-weight="700" fill="#E8734A">銲腳 w 是「畫出來的尺寸」，有效喉厚 0.707w 才是「算強度用的尺寸」</text>
<line x1="34" y1="82" x2="946" y2="82" stroke="#DCE6F0" stroke-width="2"/>
<text x="40" y="110" font-size="14" font-weight="700" fill="#4C6B8A">① 三個候選破壞面，最小的是 45° 喉部</text>
<rect x="36" y="126" width="470" height="288" rx="7" fill="#FFFFFF" stroke="#4C6B8A" stroke-width="2.2"/>
<rect x="36" y="126" width="470" height="28" rx="7" fill="#4C6B8A"/>
<rect x="36" y="146" width="470" height="8" fill="#4C6B8A"/>
<text x="271" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">填角銲斷面放大（T 形接頭）</text>
<rect x="140" y="320" width="312" height="32" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<rect x="236" y="178" width="28" height="142" fill="#DCE6F0" stroke="#1B2A41" stroke-width="2"/>
<text x="442" y="374" font-size="11.5" fill="#1B2A41" text-anchor="end">底板</text>
<text x="250" y="168" font-size="11.5" fill="#1B2A41" text-anchor="middle">立板</text>
<polygon points="264,320 340,320 264,244" fill="url(#hatchO)" stroke="#E8734A" stroke-width="2.4"/>
<line x1="264" y1="244" x2="340" y2="320" stroke="#C0392B" stroke-width="3.4"/>
<line x1="264" y1="320" x2="264" y2="244" stroke="#2E6DA4" stroke-width="3"/>
<line x1="264" y1="320" x2="340" y2="320" stroke="#2E6DA4" stroke-width="3"/>
<line x1="264" y1="320" x2="302" y2="282" stroke="#1E8449" stroke-width="4"/>
<circle cx="264" cy="320" r="4" fill="#1E8449"/>
<text x="312" y="276" font-size="13.5" font-weight="700" fill="#1E8449">t<tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> = 0.707 w</tspan></text>
<text x="312" y="294" font-size="11" font-weight="700" fill="#1E8449">← 最小破壞面（控制）</text>
<path d="M 290 320 A 26 26 0 0 0 282 301" fill="none" stroke="#5C7A99" stroke-width="1.2"/>
<text x="298" y="312" font-size="11" fill="#5C7A99">45°</text>
<line x1="264" y1="380" x2="264" y2="392" stroke="#E8734A" stroke-width="1.2"/>
<line x1="340" y1="380" x2="340" y2="392" stroke="#E8734A" stroke-width="1.2"/>
<line x1="264" y1="386" x2="340" y2="386" stroke="#E8734A" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="302" y="402" font-size="12" fill="#E8734A" text-anchor="middle">銲腳 w</text>
<line x1="212" y1="244" x2="224" y2="244" stroke="#E8734A" stroke-width="1.2"/>
<line x1="212" y1="320" x2="224" y2="320" stroke="#E8734A" stroke-width="1.2"/>
<line x1="218" y1="244" x2="218" y2="320" stroke="#E8734A" stroke-width="1.4" marker-start="url(#dimS)" marker-end="url(#dimE)"/>
<text x="209" y="286" font-size="12" fill="#E8734A" text-anchor="end">銲腳 w</text>
<text x="352" y="240" font-size="11" font-weight="700" fill="#C0392B">銲面（不控制）</text>
<text x="294" y="346" font-size="11" font-weight="700" fill="#2E6DA4">熔接邊（母材側）</text>
<line x1="290" y1="336" x2="274" y2="322" stroke="#2E6DA4" stroke-width="1.2"/>
<rect x="526" y="126" width="418" height="288" rx="7" fill="#FFFFFF" stroke="#1B2A41" stroke-width="2.2"/>
<rect x="526" y="126" width="418" height="28" rx="7" fill="#1B2A41"/>
<rect x="526" y="146" width="418" height="8" fill="#1B2A41"/>
<text x="735" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">強度怎麼算（LRFD）</text>
<text x="735" y="178" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="middle">φR<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = 0.75 × (0.6 F</tspan><tspan font-size='0.76em' dy='4'>EXX</tspan><tspan dy='-4'>) × t</tspan><tspan font-size='0.76em' dy='4'>e</tspan><tspan dy='-4'> × L</tspan><tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'></tspan></text>
<text x="735" y="204" font-size="11.5" fill="#5C7A99" text-anchor="middle">銲道也是「被剪的面」→ 帶 0.6；脆性 → φ = 0.75</text>
<line x1="556" y1="222" x2="914" y2="222" stroke="#DCE6F0" stroke-width="1.6"/>
<rect x="556" y="238" width="358" height="62" rx="6" fill="#FDF2EC" stroke="#E8734A" stroke-width="1.8"/>
<text x="735" y="266" font-size="17" font-weight="700" fill="#E8734A" text-anchor="middle">E70 代入後：φR<tspan font-size='0.76em' dy='4'>n</tspan><tspan dy='-4'> = 1.565 w L</tspan><tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'></tspan></text>
<text x="735" y="289" font-size="11" fill="#5C7A99" text-anchor="middle">（單位 tf、cm；F<tspan font-size='0.76em' dy='4'>EXX</tspan><tspan dy='-4'> = 4.92 tf/cm²）</tspan></text>
<text x="556" y="328" font-size="12" fill="#1B2A41">推導：0.75 × 0.6 × 4.92 × 0.707 = 1.565</text>
<text x="556" y="354" font-size="12" font-weight="700" fill="#1B2A41">→ 每 1 cm 銲長、每 1 cm 銲腳 ＝ 1.565 tf</text>
<text x="556" y="384" font-size="11.5" font-weight="700" fill="#C0392B">※ 母材側也要驗：銲道旁母材的剪力強度</text>
<text x="556" y="404" font-size="11.5" fill="#C0392B">　0.75 × 0.6 F<tspan font-size='0.76em' dy='4'>u</tspan><tspan dy='-4'> t（每 cm）不得小於銲道值</tspan></text>
<text x="40" y="444" font-size="14" font-weight="700" fill="#4C6B8A">② 銲腳尺寸的構造限制（算完 w 要取整，還要回頭檢查這一關）</text>
<rect x="36" y="460" width="200" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="136" y="480" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">項目</text>
<rect x="236" y="460" width="400" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="436" y="480" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">規定</text>
<rect x="636" y="460" width="308" height="30" fill="#1B2A41" stroke="#FFFFFF" stroke-width="1"/>
<text x="790" y="480" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">理由</text>
<rect x="36" y="490" width="200" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="136" y="511" font-size="11.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">最小銲腳 w<tspan font-size='0.76em' dy='4'>min</tspan><tspan dy='-4'></tspan></text>
<rect x="236" y="490" width="400" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="248" y="511" font-size="11.5" fill="#1B2A41">依「較厚板」厚度：t ≤ 6mm→3mm；≤13mm→5mm；≤19mm→6mm；&gt;19mm→8mm</text>
<rect x="636" y="490" width="308" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="790" y="511" font-size="11.5" fill="#1B2A41" text-anchor="middle">太小會急速冷卻而龜裂</text>
<rect x="36" y="522" width="200" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="136" y="543" font-size="11.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">最大銲腳 w<tspan font-size='0.76em' dy='4'>max</tspan><tspan dy='-4'></tspan></text>
<rect x="236" y="522" width="400" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="248" y="543" font-size="11.5" fill="#1B2A41">沿板邊時：t &lt; 6mm → w = t；t ≥ 6mm → w = t − 2mm</text>
<rect x="636" y="522" width="308" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="790" y="543" font-size="11.5" fill="#1B2A41" text-anchor="middle">避免燒穿、保留板邊</text>
<rect x="36" y="554" width="200" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="136" y="575" font-size="11.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">最小有效長度</text>
<rect x="236" y="554" width="400" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="248" y="575" font-size="11.5" fill="#1B2A41">L<tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'> ≥ 4w，否則有效長度只能取 L</tspan><tspan font-size='0.76em' dy='4'>w</tspan><tspan dy='-4'>/4</tspan></text>
<rect x="636" y="554" width="308" height="32" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
<text x="790" y="575" font-size="11.5" fill="#1B2A41" text-anchor="middle">太短則起弧收弧佔太大比例</text>
<rect x="36" y="586" width="200" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="136" y="607" font-size="11.5" font-weight="700" fill="#4C6B8A" text-anchor="middle">端回銲</text>
<rect x="236" y="586" width="400" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="248" y="607" font-size="11.5" fill="#1B2A41">端部回銲長度 ≥ 2w</text>
<rect x="636" y="586" width="308" height="32" fill="#F4F6F9" stroke="#DCE6F0" stroke-width="1"/>
<text x="790" y="607" font-size="11.5" fill="#1B2A41" text-anchor="middle">避免端點應力集中</text>
<text x="36" y="644" font-size="12.5" font-weight="700" fill="#C0392B">※ 只要看到填角銲，先問三件事：喉厚對不對、長度夠不夠、銲腳在不在限值內。</text>
</svg>