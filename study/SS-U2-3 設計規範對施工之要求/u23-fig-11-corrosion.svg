<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="722" viewBox="0 0 1040 722" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="600"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="600"/></clipPath></defs><rect width="1040" height="722" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">防蝕：油漆與鍍鋅差在「膜破掉之後」</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">一個是純物理屏障，一個多了犧牲陽極的電化學保護</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">電位階梯：誰當陽極誰先溶</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">標準電極電位（V vs SHE）</text><line x1="150.00" y1="100.00" x2="150.00" y2="400.00" stroke="#6B7684" stroke-width="1.8" stroke-linecap="round" opacity="1.0"/><line x1="136.0" y1="148.75" x2="386.88" y2="148.75" stroke="#B45309" stroke-width="2.6"/><text x="128.00" y="148.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">Cu 銅</text><text x="391.92" y="135.75" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#B45309" text-anchor="end" dominant-baseline="middle" font-weight="700">+0.34 V</text><line x1="136.0" y1="295.0" x2="386.88" y2="295.0" stroke="#3F4A5A" stroke-width="2.6"/><text x="128.00" y="295.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#3F4A5A" text-anchor="end" dominant-baseline="middle" font-weight="700">Fe 鋼</text><text x="391.92" y="282.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#3F4A5A" text-anchor="end" dominant-baseline="middle" font-weight="700">-0.44 V</text><line x1="136.0" y1="355.0" x2="386.88" y2="355.0" stroke="#2E7D6F" stroke-width="2.6"/><text x="128.00" y="355.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">Zn 鋅</text><text x="391.92" y="342.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">-0.76 V</text><text x="270.96" y="115.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">電位愈負 → 愈容易失去電子 → 當陽極</text><line x1="331.44" y1="355.0" x2="331.44" y2="307.0" stroke="#2E7D6F" stroke-width="2.4"/><polygon points="331.44,295.0 326.04,306.0 336.84,306.0" fill="#2E7D6F"/><text x="316.40" y="325.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">鋅優先當陽極溶解</text><text x="316.40" y="343.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11" fill="#6B7684" text-anchor="end" dominant-baseline="middle" font-weight="400">鋼被迫當陰極 → 不生鏽</text><text x="260.00" y="518.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">腐蝕＝一顆自然形成的原電池</text><text x="260.00" y="542.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">陽極（失電子、溶解）＋陰極＋電解液＋導電迴路</text><text x="260.00" y="570.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">防蝕就是把這四個要素之一拆掉</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">塗層被劃傷之後</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">這一刀決定兩種防蝕法的高下</text><text x="260.00" y="112.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">① 油漆塗裝：純物理屏障</text><rect x="64" y="168" width="392" height="44" rx="2" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6"/><rect x="64" y="160" width="392" height="8" rx="2" fill="rgba(192,57,43,0.40)" stroke="none" stroke-width="1"/><path d="M 254.0 160 l 6 14 l 6 -14" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.6"/><text x="260.00" y="144.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">劃傷</text><circle cx="214.0" cy="185.52" r="4.2" fill="rgba(192,57,43,0.35)" stroke="#C0392B" stroke-width="1.3"/><circle cx="234.0" cy="183.12" r="5.4" fill="rgba(192,57,43,0.35)" stroke="#C0392B" stroke-width="1.3"/><circle cx="260.0" cy="180.0" r="7.0" fill="rgba(192,57,43,0.35)" stroke="#C0392B" stroke-width="1.3"/><circle cx="286.0" cy="183.12" r="5.4" fill="rgba(192,57,43,0.35)" stroke="#C0392B" stroke-width="1.3"/><circle cx="306.0" cy="185.52" r="4.2" fill="rgba(192,57,43,0.35)" stroke="#C0392B" stroke-width="1.3"/><text x="260.00" y="230.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">鏽從傷口往兩側鑽入塗層下方 → 保護歸零</text><text x="260.00" y="288.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">② 熱浸鍍鋅：屏障 ＋ 犧牲陽極</text><rect x="64" y="344" width="392" height="44" rx="2" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.6"/><rect x="64" y="336" width="392" height="8" rx="2" fill="rgba(46,125,111,0.45)" stroke="none" stroke-width="1"/><path d="M 254.0 336 l 6 14 l 6 -14" fill="#FFFFFF" stroke="#3F4A5A" stroke-width="1.6"/><text x="260.00" y="320.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">劃傷</text><path d="M 246.0 350 A 14 9.799999999999999 0 0 1 274.0 350" fill="none" stroke="#2E7D6F" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/><path d="M 235.0 350 A 25 17.5 0 0 1 285.0 350" fill="none" stroke="#2E7D6F" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/><path d="M 224.0 350 A 36 25.2 0 0 1 296.0 350" fill="none" stroke="#2E7D6F" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/><path d="M 213.0 350 A 47 32.9 0 0 1 307.0 350" fill="none" stroke="#2E7D6F" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.7"/><text x="260.00" y="406.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">鋅在傷口周圍犧牲溶解 → 保護半徑內鋼材不鏽</text><rect x="46" y="436" width="428" height="136" rx="10" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.8"/><text x="260.00" y="458.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">答題關鍵：兩者的保護「機制」不同層次</text><text x="260.00" y="484.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">油漆：只要膜完整就有效，膜一破保護即歸零</text><text x="260.00" y="506.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">鍍鋅：物理屏障之外，還有電化學保護</text><text x="260.00" y="528.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">鋅 -0.76 V 比鐵 -0.44 V 更負 → 鋅先溶解</text><text x="260.00" y="550.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">所以鍍鋅層有「保護半徑」，油漆沒有</text></g><text x="520.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">常被漏掉的施工細節：高拉力螺栓摩阻面與工地銲接處（相鄰兩側各 100 mm）不予塗裝，等銲接與鎖固完成後再補塗。</text></svg>