<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="722" viewBox="0 0 1040 722" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="600"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="600"/></clipPath></defs><rect width="1040" height="722" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">填角銲強度公式的兩個常數，都不是背來的</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">0.707 來自幾何、0.6 來自 von Mises 降伏準則</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">銲喉 = 最短破壞面</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">等腳填角銲斷面為等腰直角三角形</text><polygon points="70.89,467.58 446.89,467.58 446.89,410.07 70.89,410.07" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><polygon points="70.89,410.07 132.82,410.07 132.82,100.42 70.89,100.42" fill="rgba(29,78,216,0.18)" stroke="#3F4A5A" stroke-width="1.8" opacity="1.0"/><polygon points="132.82,410.07 354.00,410.07 132.82,188.89" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/><line x1="132.82" y1="410.07" x2="243.41" y2="299.48" stroke="#B45309" stroke-width="4.2" stroke-linecap="round" opacity="1.0"/><circle cx="243.41" cy="299.48" r="5.0" fill="#FFFFFF" stroke="#B45309" stroke-width="2.4"/><text x="202.12" y="372.78" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">t<tspan dy="5.10" font-size="11.56">e</tspan></text><path d="M 185.90588235294118 410.0705882352941 A 53.082352941176474 53.082352941176474 0 0 0 170.4235294117647 372.47058823529414" fill="none" stroke="#6B7684" stroke-width="1.6"/><text x="199.18" y="387.95" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">45°</text><line x1="132.82" y1="421.13" x2="132.82" y2="451.81" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="354.00" y1="421.13" x2="354.00" y2="451.81" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="132.82" y1="447.13" x2="354.00" y2="447.13" stroke="#8A94A6" stroke-width="1.2"/><polygon points="132.82,447.13 140.82,450.33 140.82,443.93" fill="#8A94A6"/><polygon points="354.00,447.13 346.00,443.93 346.00,450.33" fill="#8A94A6"/><text x="243.41" y="460.13" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">w</text><line x1="121.76" y1="410.07" x2="152.44" y2="410.07" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="121.76" y1="188.89" x2="152.44" y2="188.89" stroke="#8A94A6" stroke-width="1" stroke-dasharray="3 3"/><line x1="147.76" y1="410.07" x2="147.76" y2="188.89" stroke="#8A94A6" stroke-width="1.2"/><polygon points="147.76,410.07 150.96,402.07 144.56,402.07" fill="#8A94A6"/><polygon points="147.76,188.89 144.56,196.89 150.96,196.89" fill="#8A94A6"/><text x="160.76" y="299.48" font-family="'Latin Modern Math','Cambria Math','Times New Roman','Nimbus Roman',serif" font-size="15" fill="#8A94A6" text-anchor="middle" dominant-baseline="middle" font-weight="400" font-style="italic">w</text><text x="265.53" y="272.94" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">破壞面</text><text x="164.37" y="504.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="start" dominant-baseline="middle" font-weight="700">t<tspan dy="4.80" font-size="10.88">e</tspan><tspan dy="-4.80" font-size="16"> = w · sin45° = w ÷ 1.414</tspan></text><text x="260.00" y="532.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">= 0.7071 w ≈ 0.707 w</text><text x="260.00" y="560.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">0.707 是幾何常數，不是經驗值</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">每 1 mm 銲長能扛多少</text><text x="177.12" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">E70 銲條 F<tspan dy="3.75" font-size="8.5">EXX</tspan><tspan dy="-3.75" font-size="12.5"> = 490 MPa，LRFD</tspan></text><text x="200.72" y="116.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="start" dominant-baseline="middle" font-weight="400">單位銲長設計強度 φR<tspan dy="3.90" font-size="8.84">n</tspan><tspan dy="-3.90" font-size="13"> / L</tspan></text><rect x="138" y="142" width="123.63636363636363" height="40" rx="6" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.5"/><text x="124.00" y="162.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">w = 6 mm</text><text x="251.64" y="162.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">0.94 kN/mm</text><rect x="138" y="208" width="164.84848484848482" height="40" rx="6" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.2"/><text x="124.00" y="228.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="700">w = 8 mm</text><text x="292.85" y="228.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="end" dominant-baseline="middle" font-weight="700">1.25 kN/mm</text><rect x="138" y="274" width="206.060606060606" height="40" rx="6" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.5"/><text x="124.00" y="294.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">w = 10 mm</text><text x="334.06" y="294.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">1.56 kN/mm</text><rect x="138" y="340" width="247.27272727272725" height="40" rx="6" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.5"/><text x="124.00" y="360.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#1F2733" text-anchor="end" dominant-baseline="middle" font-weight="400">w = 12 mm</text><text x="375.27" y="360.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#2E7D6F" text-anchor="end" dominant-baseline="middle" font-weight="700">1.87 kN/mm</text><text x="135.08" y="464.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="700">φR<tspan dy="4.80" font-size="10.88">n</tspan><tspan dy="-4.80" font-size="16"> = 0.75 × 0.6F</tspan><tspan dy="4.80" font-size="10.88">EXX</tspan><tspan dy="-4.80" font-size="16"> × (0.707w) × L</tspan></text><text x="260.00" y="494.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">0.6 來自 von Mises 剪切降伏</text><text x="177.78" y="520.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">τ<tspan dy="4.35" font-size="9.86">y</tspan><tspan dy="-4.35" font-size="14.5"> = F</tspan><tspan dy="4.35" font-size="9.86">y</tspan><tspan dy="-4.35" font-size="14.5"> ÷ 1.732 = 0.577 F</tspan><tspan dy="4.35" font-size="9.86">y</tspan></text><text x="202.05" y="544.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">規範取整為 0.6 F<tspan dy="4.35" font-size="9.86">y</tspan></text><text x="260.00" y="572.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">考場基準：w = 8 mm 約 1.25 kN/mm</text></g><text x="520.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">考場上先用 w = 8 mm 約 1.25 kN/mm 當基準，可立刻檢查自己算出來的量級有沒有錯一個數量級。</text></svg>