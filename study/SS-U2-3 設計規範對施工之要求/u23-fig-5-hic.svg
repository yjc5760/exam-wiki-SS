TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">19 ~ 38</text><text x="206.00" y="519.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">65°C</text><rect x="263.0" y="486" width="102" height="46" rx="7" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.4"/><text x="314.00" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">38 ~ 65</text><text x="314.00" y="519.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">110°C</text><rect x="371.0" y="486" width="102" height="46" rx="7" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.4"/><text x="422.00" y="500.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">t ＞ 65</text><text x="422.00" y="519.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">150°C</text><text x="260.00" y="552.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">板厚 mm；最高層間溫度不得超過 350°C</text></g><text x="520.0" y="700" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13.5" fill="#6B7684" text-anchor="middle">答題時三要素要一起寫出來，再指出預熱能同時削弱三者；只寫「預熱可防裂」而沒寫機制，通常只拿一半分數。</text></svg>