<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="722" viewBox="0 0 1040 722" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="520" height="600"/></clipPath><clipPath id="sdclip1"><rect x="0" y="0" width="520" height="600"/></clipPath></defs><rect width="1040" height="722" fill="#FFFFFF"/><text x="520.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">氫致冷裂：三要素模型與預熱這一招</text><text x="520.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">冷裂不是銲完就看得到——它是延遲裂縫，常在數小時到數天後才出現</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">氫致冷裂（延遲裂縫）的三要素</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">缺一不可 → 破壞任一個就能防裂</text><circle cx="260.00" cy="224.49" r="94.40" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="2.6" opacity="1.0"/><circle cx="207.56" cy="318.89" r="94.40" fill="rgba(29,78,216,0.18)" stroke="#1D4ED8" stroke-width="2.6" opacity="1.0"/><circle cx="312.44" cy="318.89" r="94.40" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="2.6" opacity="1.0"/><text x="260.00" y="182.49" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">氫源</text><text x="260.00" y="200.49" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">濕氣・油污・鏽</text><text x="167.56" y="352.89" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#1D4ED8" text-anchor="middle" dominant-baseline="middle" font-weight="700">高拉應力</text><text x="167.56" y="370.89" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">殘留應力・拘束度</text><text x="352.44" y="352.89" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">敏感組織</text><text x="352.44" y="370.89" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">高 CE → 麻田散鐵</text><circle cx="260.00" cy="287.42" r="7.0" fill="#B45309" stroke="#FFFFFF" stroke-width="2.4"/><text x="260.00" y="311.42" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">HIC</text><text x="260.00" y="476.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">低氫銲條的雙溫陷阱</text><text x="260.00" y="502.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">烘乾 300 ~ 350°C：趕走既有水分</text><text x="260.00" y="524.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="400">保溫筒 100 ~ 150°C：隨身攜帶防再吸濕</text><text x="260.00" y="554.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">兩個溫度都要寫，只寫一個扣一半</text></g><g transform="translate(520,76)" clip-path="url(#sdclip1)"><rect x="6" y="6" width="508" height="588" rx="14" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.2"/><text x="260.00" y="32.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15.5" fill="#1F2733" text-anchor="middle" dominant-baseline="middle" font-weight="700">預熱：一招同時破壞三個要素</text><text x="260.00" y="55.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">所以它是最高 CP 值的對策</text><rect x="142.0" y="128" width="236" height="46" rx="10" fill="rgba(180,83,9,0.18)" stroke="#B45309" stroke-width="2.4"/><text x="260.00" y="151.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="15" fill="#B45309" text-anchor="middle" dominant-baseline="middle" font-weight="700">預熱／層間溫度／後熱</text><line x1="260.0" y1="180.0" x2="260.0" y2="191.0" stroke="#B45309" stroke-width="2.0"/><polygon points="260.0,200.0 254.8,190.0 265.2,190.0" fill="#B45309"/><rect x="88.0" y="206" width="344" height="62" rx="9" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><rect x="88.0" y="206" width="7" height