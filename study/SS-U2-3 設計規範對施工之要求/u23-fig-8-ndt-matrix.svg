D" stroke-width="1.4"/><rect x="250" y="310" width="420" height="6" rx="3" fill="#C0392B" stroke="none" stroke-width="1"/><text x="274.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">UT　超音波</text><text x="274.00" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">聲波遇扁平缺陷大面積反射 → 回波強</text><text x="274.00" y="400.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#C0392B" text-anchor="start" dominant-baseline="middle" font-weight="700">對未熔合與裂縫最靈敏</text><rect x="268" y="418" width="384" height="48" rx="7" fill="#FFFFFF" stroke="#E1E6ED" stroke-width="1.2"/><text x="460.00" y="442.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">CJP 與耐震梁柱接頭：100% 全數檢測</text><rect x="686" y="310" width="420" height="176" rx="10" fill="#F5F7FA" stroke="#E1E6ED" stroke-width="1.4"/><rect x="686" y="310" width="420" height="6" rx="3" fill="#2E7D6F" stroke="none" stroke-width="1"/><text x="710.00" y="344.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="16" fill="#2E7D6F" text-anchor="start" dominant-baseline="middle" font-weight="700">RT　放射線</text><text x="710.00" y="374.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="12.5" fill="#1F2733" text-anchor="start" dominant-baseline="middle" font-weight="400">射線穿透量隨密度差變化 → 底片黑影</text><text x="710.00" y="400.00" font-family="'Noto Sans CJK TC','Noto San