<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="682" viewBox="0 0 1180 682" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><clipPath id="sdclip0"><rect x="0" y="0" width="1180" height="560"/></clipPath></defs><rect width="1180" height="682" fill="#FFFFFF"/><text x="590.0" y="34" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="17.5" fill="#1F2733" text-anchor="middle" font-weight="700">NDT 不用背表：位置 × 形狀 的 2×2 決策矩陣</text><text x="590.0" y="58" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="13" fill="#6B7684" text-anchor="middle">位置決定看得到看不到，形狀決定用聲波還是射線</text><g transform="translate(0,76)" clip-path="url(#sdclip0)"><rect x="0" y="0" width="1180" height="560" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect x="250" y="56" width="420" height="52" rx="10" fill="rgba(192,57,43,0.18)" stroke="#C0392B" stroke-width="1.8"/><text x="460.00" y="74.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#C0392B" text-anchor="middle" dominant-baseline="middle" font-weight="700">面積型（扁平）</text><text x="460.00" y="94.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="11.5" fill="#6B7684" text-anchor="middle" dominant-baseline="middle" font-weight="400">裂縫・未熔合・未滲透</text><rect x="686" y="56" width="420" height="52" rx="10" fill="rgba(46,125,111,0.20)" stroke="#2E7D6F" stroke-width="1.8"/><text x="896.00" y="74.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif" font-size="14.5" fill="#2E7D6F" text-anchor="middle" dominant-baseline="middle" font-weight="700">體積型（圓胖）</text><text x="896.00" y="94.00" font-family="'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei','PingFang TC','Hei